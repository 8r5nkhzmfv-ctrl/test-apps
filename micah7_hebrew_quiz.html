<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミカ書7章 ヘブル語クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17140f;
    --card:#211d16;
    --card2:#282318;
    --parchment:#eae0c6;
    --parchment-dim:#a89b7c;
    --thread:#a1442f;
    --thread-dim:#5c2a20;
    --gold:#b8935f;
    --gold-dim:#7a6440;
    --line:#3a3326;
    --good:#7a8f5c;
    --bad:#a1442f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #241f16 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #1c1810 0%, transparent 55%),
      var(--ink);
    color:var(--parchment);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .app{width:100%;max-width:640px;}
  .heb{font-family:'Noto Sans Hebrew',sans-serif;direction:rtl;unicode-bidi:isolate;}

  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .title{font-family:'Noto Serif JP',serif;font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--gold);}
  .counter{font-size:12px;color:var(--parchment-dim);font-variant-numeric:tabular-nums;}
  .stitches{display:flex;gap:3px;margin:10px 0 28px;}
  .stitch{flex:1;height:3px;background:var(--line);border-radius:1px;transition:background .25s ease;}
  .stitch.done{background:var(--thread);}
  .stitch.current{background:var(--gold);}

  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:6px;padding:36px 30px 28px;position:relative;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);}
  .card::before{content:"";position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
  .cat{font-size:11px;letter-spacing:.16em;color:var(--parchment-dim);text-align:center;margin-bottom:18px;text-transform:uppercase;}

  .prompt-ja{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:500;color:var(--parchment);text-align:center;margin-bottom:8px;line-height:1.7;}
  .prompt-sub{font-size:12px;color:var(--parchment-dim);text-align:center;margin-bottom:22px;}
  .prompt-heb{font-family:'Noto Sans Hebrew',sans-serif;direction:rtl;font-weight:500;font-size:30px;color:var(--gold);text-align:center;margin-bottom:6px;line-height:1.5;}
  .prompt-read{font-size:13px;color:var(--parchment-dim);text-align:center;margin-bottom:8px;letter-spacing:.03em;}

  .hero{text-align:center;margin-bottom:14px;min-height:64px;display:flex;align-items:center;justify-content:center;}
  .audio-btn{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #c79a5f, #7a5a33 70%);border:1px solid var(--gold-dim);color:var(--ink);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -4px rgba(0,0,0,.6), inset 0 0 0 3px rgba(23,20,15,.25);transition:transform .15s ease;}
  .audio-btn:active{transform:scale(.94);}
  .audio-btn-slow{width:52px;height:52px;font-size:20px;}
  .audio-hint{font-size:11px;color:var(--parchment-dim);margin-top:8px;}

  .options{display:grid;gap:10px;}
  .opt{text-align:left;background:transparent;border:1px solid var(--line);color:var(--parchment);padding:14px 16px;border-radius:4px;font-family:'Noto Sans JP',sans-serif;font-size:15px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .15s ease, background .15s ease;}
  .opt .opt-heb{font-family:'Noto Sans Hebrew',sans-serif;direction:rtl;font-weight:500;font-size:19px;color:var(--gold);text-align:center;}
  .opt .opt-read{font-size:11.5px;color:var(--parchment-dim);text-align:center;}
  .opt .opt-jp{font-size:15px;color:var(--parchment);text-align:center;}
  .opt:hover:not(:disabled){border-color:var(--gold-dim);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good);background:rgba(122,143,92,.14);}
  .opt.wrong{border-color:var(--bad);background:rgba(161,68,47,.14);}
  .opt.reveal{border-color:var(--good);}

  .feedback{margin-top:16px;min-height:20px;font-size:13px;text-align:center;color:var(--parchment-dim);}
  .feedback b{color:var(--gold);font-weight:700;}
  .feedback .fb-heb{font-family:'Noto Sans Hebrew',sans-serif;direction:rtl;color:var(--gold);font-size:16px;}

  .nextrow{display:flex;justify-content:flex-end;margin-top:18px;}
  .next-btn{background:var(--thread);color:var(--parchment);border:none;padding:10px 22px;border-radius:4px;font-size:14px;letter-spacing:.04em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .next-btn.show{opacity:1;pointer-events:auto;}
  .next-btn:hover{background:#b64f37;}

  .center-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:6px;padding:44px 30px;text-align:center;}
  .mark{font-family:'Noto Serif JP',serif;font-style:italic;font-size:34px;color:var(--gold);margin-bottom:8px;}
  h1.headline{font-family:'Noto Serif JP',serif;font-size:22px;margin:0 0 10px;font-weight:700;}
  p.sub{color:var(--parchment-dim);font-size:13.5px;line-height:1.8;margin:0 0 28px;}

  .primary-btn{background:var(--thread);color:var(--parchment);border:none;padding:14px 34px;border-radius:4px;font-size:15px;letter-spacing:.05em;cursor:pointer;}
  .primary-btn:hover{background:#b64f37;}
  .ghost-btn{background:transparent;border:1px solid var(--line);color:var(--parchment-dim);padding:14px 24px;border-radius:4px;font-size:14px;cursor:pointer;margin-left:10px;}
  .ghost-btn:hover{border-color:var(--gold-dim);color:var(--parchment);}

  .crumbs{font-size:11px;color:var(--parchment-dim);letter-spacing:.06em;margin-bottom:14px;}
  .choice-row{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;text-align:left;}
  .choice-btn{background:transparent;border:1px solid var(--line);color:var(--parchment);padding:14px 18px;border-radius:4px;font-size:14.5px;cursor:pointer;text-align:left;transition:border-color .15s ease, background .15s ease;}
  .choice-btn:hover{border-color:var(--gold-dim);background:rgba(184,147,95,.08);}
  .choice-btn .cb-sub{display:block;font-size:11.5px;color:var(--parchment-dim);margin-top:3px;}
  .back-link{background:none;border:none;color:var(--parchment-dim);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;}

  .score-big{font-family:'Noto Serif JP',serif;font-size:52px;font-weight:700;color:var(--gold);margin:6px 0 2px;}
  .score-label{font-size:12px;color:var(--parchment-dim);letter-spacing:.1em;margin-bottom:26px;}
  .breakdown{text-align:left;border-top:1px solid var(--line);padding-top:18px;margin-top:8px;}
  .bd-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--parchment-dim);}
  .bd-row b{color:var(--parchment);font-weight:500;}
  .review-list{text-align:left;margin-top:22px;max-height:280px;overflow-y:auto;border-top:1px solid var(--line);padding-top:14px;}
  .review-item{font-size:12.5px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--parchment-dim);}
  .review-item.is-correct{color:var(--parchment-dim);}
  .review-item .rmark{margin-right:6px;}
  .review-item .rprompt{color:var(--parchment);font-family:'Noto Sans Hebrew',sans-serif;}
  .review-item .ra{color:var(--good);}
  .review-item .rw{color:var(--bad);text-decoration:line-through;margin-right:4px;}
  .review-item .rref{display:block;margin-top:4px;font-size:11px;color:var(--parchment-dim);opacity:.7;padding-left:20px;}

  .note-box{font-size:11.5px;color:var(--parchment-dim);line-height:1.7;border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-top:22px;text-align:left;}

  .hidden{display:none !important;}

  @media (max-width:480px){
    .card,.center-card{padding:26px 18px 22px;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- START SCREEN -->
  <div id="screen-start" class="center-card">
    <div class="mark heb" style="font-size:26px;">מיכה</div>
    <h1 class="headline">ミカ書7章 ヘブル語クイズ</h1>
    <p class="sub">出題単位・方向・形式・問題数を選んで進む。</p>
    <div id="wizard-panel"></div>
    <div class="note-box">
      注：「元の形」「動詞root」は原文表に無い情報のため、標準的なヘブル語辞書知識に基づく推定です（母音記号なし・子音表記）。リスニングはブラウザのヘブル語音声合成に対応した環境でのみ実際の発音になります（非対応の場合、音声が出ないか不正確になることがあります）。
    </div>
    <div style="margin-top:16px;font-size:11.5px;color:var(--parchment-dim);text-align:center;line-height:1.8;">
      🔊 音声が流れない方へ：<a href="voice_guide.html" style="color:var(--gold);">こちら（音声インストール案内）</a><br>
      <a href="index.html" style="color:var(--gold);">← indexに戻る</a>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="hidden">
    <div class="top">
      <div class="title">ミカ書7章クイズ</div>
      <div class="counter"><span id="qnum">1</span> / <span id="qtotal">0</span></div>
    </div>
    <div class="stitches" id="stitches"></div>

    <div class="card">
      <div class="cat" id="q-cat"></div>
      <div id="q-prompt-wrap"></div>
      <div class="hero" id="q-hero"></div>
      <div class="options" id="q-options"></div>
      <div class="feedback" id="q-feedback"></div>
      <div class="nextrow">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次へ →</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="screen-result" class="center-card hidden">
    <div class="mark" style="font-size:30px;">Done.</div>
    <h1 class="headline">結果</h1>
    <div class="score-big"><span id="score-num">0</span> / <span id="score-total">0</span></div>
    <div class="score-label" id="score-pct">正答率 0%</div>
    <div class="breakdown" id="breakdown"></div>
    <div id="review-wrap"><div class="review-list" id="review-list"></div></div>
    <div style="margin-top:26px;">
      <button class="primary-btn" onclick="runQuiz(lastRun)">もう一度（同じ形式）</button>
      <button class="ghost-btn" onclick="showStart()">最初の画面へ</button>
    </div>
  </div>

</div>

<script>
/* =========================================================
   データソース：WORDDATA = {surface:[...], citation:[...], root:[...]}
   各要素: {heb, read, mean} （surfaceのみ ref 付き）
   ========================================================= */

const CAT_LABEL = {surface:'本文の単語', citation:'単語（元の形）', root:'動詞（root）'};

let wizardState = {cat:null, direction:null, format:null};
let order=[], current=0, score=0, results=[], currentOptions=[], answeredThis=false, lastRun=null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickN(pool, n, excludeIdx){
  const p = pool.filter((_,i)=>i!==excludeIdx);
  return shuffle(p).slice(0,n);
}

function choiceButton(label, sub, onclick){
  const b = document.createElement('button');
  b.className='choice-btn';
  b.innerHTML = label + (sub? '<span class="cb-sub">'+sub+'</span>' : '');
  b.onclick = onclick;
  return b;
}
function backLink(onclick){
  const b = document.createElement('button');
  b.className='back-link';
  b.textContent='← 戻る';
  b.onclick = onclick;
  return b;
}

function renderWizard(){
  const panel = document.getElementById('wizard-panel');
  panel.innerHTML='';
  const crumbs = document.createElement('div');
  crumbs.className='crumbs';
  const parts=[];
  if(wizardState.cat) parts.push(CAT_LABEL[wizardState.cat]);
  if(wizardState.direction) parts.push(wizardState.direction==='h2j' ? 'ヘブル語→日本語' : '日本語→ヘブル語');
  if(wizardState.format) parts.push(wizardState.format==='reading'?'リーディング':'リスニング');
  crumbs.textContent = parts.length ? parts.join(' / ') : '出題単位を選択';
  panel.appendChild(crumbs);

  const row = document.createElement('div');
  row.className='choice-row';

  if(!wizardState.cat){
    row.appendChild(choiceButton('単語（元の形）','辞書に載る基本形（推定）', ()=>{wizardState.cat='citation'; renderWizard();}));
    row.appendChild(choiceButton('動詞（root）','語根（3文字の基本形・推定）', ()=>{wizardState.cat='root'; renderWizard();}));
    row.appendChild(choiceButton('本文の単語','ミカ書7章に実際に現れる形', ()=>{wizardState.cat='surface'; renderWizard();}));
    panel.appendChild(row);
    return;
  }
  if(!wizardState.direction){
    row.appendChild(choiceButton('ヘブル語→日本語','ヘブル語を見て意味を選ぶ', ()=>{wizardState.direction='h2j'; renderWizard();}));
    row.appendChild(choiceButton('日本語→ヘブル語','日本語を見てヘブル語を選ぶ', ()=>{wizardState.direction='j2h'; renderWizard();}));
    panel.appendChild(row);
    panel.appendChild(backLink(()=>{wizardState.cat=null; renderWizard();}));
    return;
  }
  if(!wizardState.format){
    row.appendChild(choiceButton('リーディング','文字を見て答える', ()=>{wizardState.format='reading'; renderWizard();}));
    row.appendChild(choiceButton('リスニング','音声を聞いて答える', ()=>{wizardState.format='listening'; renderWizard();}));
    panel.appendChild(row);
    panel.appendChild(backLink(()=>{wizardState.direction=null; renderWizard();}));
    return;
  }

  const pool = WORDDATA[wizardState.cat];
  const max = pool.length;
  const counts = [10,20,max].filter((v,i,a)=>v<=max && a.indexOf(v)===i);
  counts.forEach(c=>{
    const label = (c===max) ? ('全'+max+'問') : (c+'問');
    row.appendChild(choiceButton(label,'', ()=>runQuiz({cat:wizardState.cat, direction:wizardState.direction, format:wizardState.format, count:c})));
  });
  panel.appendChild(row);
  panel.appendChild(backLink(()=>{wizardState.format=null; renderWizard();}));
}

function showStart(){
  wizardState = {cat:null, direction:null, format:null};
  renderWizard();
  document.getElementById('screen-start').classList.remove('hidden');
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
}

function buildQuestions(spec){
  const pool = WORDDATA[spec.cat];
  const idxs = shuffle(pool.map((_,i)=>i)).slice(0, spec.count);
  return idxs.map(i=>{
    const w = pool[i];
    return {
      cat: CAT_LABEL[spec.cat],
      direction: spec.direction,
      format: spec.format,
      heb: w.heb, read: w.read, mean: w.mean, ref: w.ref||null,
      poolIdx: i
    };
  });
}

function runQuiz(spec){
  lastRun = spec;
  const qs = buildQuestions(spec);
  beginQuiz(qs, spec);
}

let activePool = [];

function beginQuiz(qs, spec){
  activePool = WORDDATA[spec.cat];
  order = qs;
  current = 0; score = 0; results = [];

  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');

  document.getElementById('qtotal').textContent = order.length;
  buildStitches();
  renderQuestion();
}

function buildStitches(){
  const wrap = document.getElementById('stitches');
  wrap.innerHTML='';
  for(let i=0;i<order.length;i++){
    const d = document.createElement('div');
    d.className='stitch'; d.id='stitch-'+i;
    wrap.appendChild(d);
  }
}
function updateStitches(){
  for(let i=0;i<order.length;i++){
    const el = document.getElementById('stitch-'+i);
    if(!el) continue;
    el.classList.remove('done','current');
    if(i<current) el.classList.add('done');
    else if(i===current) el.classList.add('current');
  }
}

function speakHebrew(text, rate){
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      const u = new SpeechSynthesisUtterance(text);
      const voices = speechSynthesis.getVoices();
      const heVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('he'));
      if(heVoice) u.voice = heVoice;
      u.lang = 'he-IL';
      u.rate = rate || 0.9;
      speechSynthesis.speak(u);
    }, 60);
  }catch(e){ /* 音声合成非対応環境 */ }
}

function renderQuestion(){
  answeredThis = false;
  const q = order[current];
  document.getElementById('qnum').textContent = current+1;
  updateStitches();
  document.getElementById('q-cat').textContent = q.cat + '　' + (q.direction==='h2j'?'ヘブル語→日本語':'日本語→ヘブル語');

  const promptWrap = document.getElementById('q-prompt-wrap');
  promptWrap.innerHTML='';
  const hero = document.getElementById('q-hero');
  hero.innerHTML='';

  const isListening = (q.format==='listening');
  const isH2J = (q.direction==='h2j');

  if(isH2J){
    if(isListening){
      const col = document.createElement('div');
      col.style.cssText='display:flex;flex-direction:column;align-items:center;';
      const row = document.createElement('div');
      row.style.cssText='display:flex;gap:14px;align-items:center;justify-content:center;';
      const btn = document.createElement('button');
      btn.className='audio-btn'; btn.textContent='🔊';
      btn.onclick=()=>speakHebrew(q.heb, 0.9);
      const slowBtn = document.createElement('button');
      slowBtn.className='audio-btn audio-btn-slow'; slowBtn.textContent='🐢';
      slowBtn.title='ゆっくり再生';
      slowBtn.onclick=()=>speakHebrew(q.heb, 0.45);
      row.appendChild(btn); row.appendChild(slowBtn);
      const hint = document.createElement('div');
      hint.className='audio-hint'; hint.textContent='タップして発音を聞く（🐢=ゆっくり）';
      col.appendChild(row); col.appendChild(hint);
      hero.appendChild(col);
      setTimeout(()=>speakHebrew(q.heb, 0.9), 300);
      const sub = document.createElement('div');
      sub.className='prompt-sub'; sub.textContent='聞こえた語の意味はどれ？';
      promptWrap.appendChild(sub);
    } else {
      const hebEl = document.createElement('div');
      hebEl.className='prompt-heb'; hebEl.textContent = q.heb;
      const readEl = document.createElement('div');
      readEl.className='prompt-read'; readEl.textContent = q.read;
      const sub = document.createElement('div');
      sub.className='prompt-sub'; sub.textContent='この語の意味はどれ？';
      promptWrap.appendChild(hebEl); promptWrap.appendChild(readEl); promptWrap.appendChild(sub);
    }
  } else {
    const jaEl = document.createElement('div');
    jaEl.className='prompt-ja'; jaEl.textContent = q.mean;
    const sub = document.createElement('div');
    sub.className='prompt-sub'; sub.textContent = isListening ? '意味に合うヘブル語の発音はどれ？（選択肢は文字表示）' : 'この意味に合うヘブル語はどれ？';
    promptWrap.appendChild(jaEl); promptWrap.appendChild(sub);
  }

  const chosenWrongs = pickN(activePool, 3, q.poolIdx);
  currentOptions = shuffle([
    {heb:q.heb, read:q.read, mean:q.mean, correct:true},
    ...chosenWrongs.map(w=>({heb:w.heb, read:w.read, mean:w.mean, correct:false}))
  ]);

  const optWrap = document.getElementById('q-options');
  optWrap.innerHTML='';
  currentOptions.forEach(opt=>{
    const b = document.createElement('button');
    b.className='opt';
    if(isH2J){
      const jp = document.createElement('span');
      jp.className='opt-jp'; jp.textContent = opt.mean;
      b.appendChild(jp);
    } else {
      const heb = document.createElement('span');
      heb.className='opt-heb'; heb.textContent = opt.heb;
      const read = document.createElement('span');
      read.className='opt-read'; read.textContent = opt.read;
      b.appendChild(heb); b.appendChild(read);
    }
    b.onclick = ()=>selectOption(b, opt, q);
    optWrap.appendChild(b);
  });

  document.getElementById('q-feedback').innerHTML='';
  document.getElementById('next-btn').classList.remove('show');
}

function selectOption(btn, opt, q){
  if(answeredThis) return;
  answeredThis = true;
  const allBtns = document.querySelectorAll('#q-options .opt');
  allBtns.forEach(b=>b.disabled=true);

  const isH2J = (q.direction==='h2j');
  const fb = document.getElementById('q-feedback');

  if(opt.correct){
    btn.classList.add('correct');
    score++;
    fb.innerHTML = '<b>正解。</b>';
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b=>{
      const isCorrectBtn = isH2J
        ? (b.querySelector('.opt-jp') && b.querySelector('.opt-jp').textContent===q.mean)
        : (b.querySelector('.opt-heb') && b.querySelector('.opt-heb').textContent===q.heb);
      if(isCorrectBtn) b.classList.add('reveal');
    });
    fb.innerHTML = isH2J
      ? ('不正解。正解: <b>'+q.mean+'</b>')
      : ('不正解。正解: <b class="fb-heb">'+q.heb+'</b>　'+q.read);
  }
  if(!isH2J || q.format!=='listening'){
    fb.innerHTML += '<div style="margin-top:8px;" class="fb-heb">'+q.heb+'　<span style="color:var(--parchment-dim);font-size:11px;">'+q.read+'</span></div>';
  }
  if(q.ref){
    fb.innerHTML += '<div style="margin-top:4px;font-size:11px;color:var(--parchment-dim);">'+q.ref+'</div>';
  }

  results.push({
    cat:q.cat, direction:q.direction, heb:q.heb, read:q.read, mean:q.mean,
    chosenMean:opt.mean, chosenHeb:opt.heb, correct:opt.correct, ref:q.ref
  });
  document.getElementById('next-btn').classList.add('show');
}

function nextQuestion(){
  current++;
  if(current>=order.length) showResult();
  else renderQuestion();
}

function showResult(){
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  document.getElementById('score-num').textContent = score;
  document.getElementById('score-total').textContent = order.length;
  const pct = Math.round((score/order.length)*100);
  document.getElementById('score-pct').textContent = '正答率 ' + pct + '%';

  const byCat = {};
  results.forEach(r=>{
    if(!byCat[r.cat]) byCat[r.cat]={correct:0,total:0};
    byCat[r.cat].total++;
    if(r.correct) byCat[r.cat].correct++;
  });
  const bd = document.getElementById('breakdown');
  bd.innerHTML='';
  Object.keys(byCat).forEach(cat=>{
    const row = document.createElement('div');
    row.className='bd-row';
    row.innerHTML = '<span>'+cat+'</span><b>'+byCat[cat].correct+' / '+byCat[cat].total+'</b>';
    bd.appendChild(row);
  });

  const rl = document.getElementById('review-list');
  rl.innerHTML='';
  const h = document.createElement('div');
  h.style.cssText='font-size:12px;color:var(--parchment-dim);margin-bottom:10px;';
  h.textContent = '解答一覧（全'+results.length+'問）';
  rl.appendChild(h);

  results.forEach(r=>{
    const item = document.createElement('div');
    item.className='review-item' + (r.correct?' is-correct':' is-wrong');
    if(r.correct){
      item.innerHTML = '<span class="rmark">✅</span><span class="rprompt">'+r.heb+'</span>　<span class="ra">'+r.mean+'</span>';
    } else {
      item.innerHTML = '<span class="rmark">❌</span><span class="rprompt">'+r.heb+'</span>　'+
        '<span class="rw">'+(r.direction==='h2j'?r.chosenMean:r.chosenHeb)+'</span>'+
        '<span class="ra">→ '+r.mean+'</span>';
    }
    if(r.ref){
      const refEl = document.createElement('span');
      refEl.className='rref'; refEl.textContent = r.ref;
      item.appendChild(refEl);
    }
    rl.appendChild(item);
  });
}

showStart();
</script>
</body>
</html>
