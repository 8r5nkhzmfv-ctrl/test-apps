<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ヘブル語対話パートナー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #fcfbf8;
      color: #1c1917;
    }
    .hebrew-font {
      font-family: 'Noto Sans Hebrew', serif;
      direction: rtl;
      unicode-bidi: isolate;
    }
    .clickable-word {
      display: inline-block;
      padding: 0 3px;
      margin: 0 1px;
      border-bottom: 2px dashed #f59e0b;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .clickable-word:hover, .clickable-word:active {
      background-color: #fef3c7;
      border-bottom-color: #d97706;
      color: #b45309;
    }
    /* Dynamic Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

  <!-- Header -->
  <header class="bg-gradient-to-r from-amber-900 via-amber-800 to-amber-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse sm:space-x-3">
        <!-- Customized Logo: Orange gradient rounded rectangle with white Hebrew 'ש' -->
        <div class="w-11 h-11 bg-gradient-to-br from-amber-400 via-orange-500 to-amber-600 rounded-2xl flex items-center justify-center shadow-lg transform active:scale-95 transition-transform">
          <span class="hebrew-font text-2xl font-bold text-white select-none leading-none">ש</span>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-snug">ヘブル語対話パートナー</h1>
          <p class="text-xs text-amber-200">14場面 × 全112対話フレーズ（4往復）</p>
        </div>
      </div>
      <!-- Overall Progress Counter -->
      <div class="bg-amber-950/60 border border-amber-700/50 rounded-xl px-3 py-1.5 text-right">
        <div class="text-[10px] text-amber-300 font-medium">達成度</div>
        <div class="text-xs font-bold text-amber-100"><span id="progress-count">0</span> / 14 完了</div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-2xl mx-auto w-full px-4 pt-4 flex-1">

    <!-- VIEW 1: SCENE LIST -->
    <section id="view-scenes" class="space-y-3">
      <div class="flex items-center justify-between py-1 border-b border-stone-200">
        <h2 class="text-sm font-bold text-stone-700 flex items-center gap-2">
          <span>会話シーン（全14場面）</span>
        </h2>
        <span class="text-xs text-stone-500">好きな場面を選んで練習</span>
      </div>

      <div id="scenes-grid" class="grid grid-cols-1 gap-2.5">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- VIEW 2: DIALOGUE PRACTICE -->
    <section id="view-dialogue" class="hidden space-y-4">
      <!-- Top Navigation & Controls -->
      <div class="flex items-center justify-between gap-2">
        <button onclick="navToScenes()" class="flex items-center gap-1.5 px-3 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-xl text-xs font-bold transition-colors">
          <span>←</span>
          <span>シーン一覧</span>
        </button>
        <h2 id="current-scene-title" class="font-bold text-stone-800 text-sm sm:text-base truncate"></h2>
      </div>

      <!-- Settings & Practice Modes Toolbar -->
      <div class="bg-white p-3 rounded-2xl border border-stone-200 shadow-sm space-y-3">
        <!-- Speed Controls -->
        <div class="flex items-center justify-between text-xs">
          <span class="font-bold text-stone-600 flex items-center gap-1">
            <span>🔊 読み上げ速度:</span>
          </span>
          <div class="flex gap-1 bg-stone-100 p-1 rounded-xl">
            <button onclick="setSpeed(0.75, this)" class="speed-btn px-2.5 py-1 rounded-lg font-medium text-stone-600 transition-all">ゆっくり (0.75x)</button>
            <button onclick="setSpeed(0.88, this)" class="speed-btn active bg-amber-500 text-white font-bold px-2.5 py-1 rounded-lg transition-all shadow-sm">ふつう (0.88x)</button>
            <button onclick="setSpeed(1.05, this)" class="speed-btn px-2.5 py-1 rounded-lg font-medium text-stone-600 transition-all">はやめ (1.05x)</button>
          </div>
        </div>

        <!-- Mode Toggles -->
        <div class="grid grid-cols-3 gap-1.5 pt-2 border-t border-stone-100 text-xs">
          <button id="mode-btn-all" onclick="setPracticeMode('all')" class="mode-btn bg-amber-50 text-amber-800 border border-amber-300 font-bold py-1.5 px-2 rounded-xl text-center">
            全対話表示
          </button>
          <button id="mode-btn-roleA" onclick="setPracticeMode('roleA')" class="mode-btn bg-stone-50 text-stone-600 border border-stone-200 font-medium py-1.5 px-2 rounded-xl text-center">
            A担当 (B隠し)
          </button>
          <button id="mode-btn-roleB" onclick="setPracticeMode('roleB')" class="mode-btn bg-stone-50 text-stone-600 border border-stone-200 font-medium py-1.5 px-2 rounded-xl text-center">
            B担当 (A隠し)
          </button>
        </div>
      </div>

      <!-- Dialogue Bubbles Container -->
      <div id="dialogue-list" class="space-y-3">
        <!-- Dynamic content -->
      </div>

      <!-- Complete Scene Button -->
      <div class="pt-4 pb-6 text-center">
        <button id="btn-complete-scene" onclick="toggleSceneCompletion()" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white rounded-2xl font-bold shadow-md transition-all flex items-center justify-center gap-2">
          <span>✓ このシーンを完了にする</span>
        </button>
      </div>
    </section>

  </main>

  <!-- Word Popup Modal -->
  <div id="word-modal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeWordModal(event)">
    <div class="bg-white rounded-3xl max-w-xs w-full p-6 shadow-2xl text-center space-y-4 animate-fade-in border border-stone-100" onclick="event.stopPropagation()">
      <div class="flex justify-between items-start">
        <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full">単語解説</span>
        <button onclick="closeWordModal()" class="text-stone-400 hover:text-stone-600 text-lg leading-none p-1">✕</button>
      </div>

      <div>
        <div id="modal-heb" class="hebrew-font text-3xl font-bold text-amber-900 mb-1"></div>
        <div id="modal-kana" class="text-lg font-bold text-stone-800"></div>
        <div id="modal-meaning" class="text-sm font-medium text-stone-600 mt-2 bg-stone-50 p-2.5 rounded-xl border border-stone-100"></div>
      </div>

      <div class="flex gap-2">
        <button id="modal-audio-btn" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold text-xs shadow transition-colors flex items-center justify-center gap-1">
          <span>🔊 発音を聞く</span>
        </button>
        <button onclick="closeWordModal()" class="px-4 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl font-bold text-xs transition-colors">
          閉じる
        </button>
      </div>
    </div>
  </div>

    // Render 14 Scene Cards
    function renderSceneList() {
      const container = document.getElementById('scenes-grid');
      container.innerHTML = '';

      Object.keys(dialogueData).forEach(id => {
        const item = dialogueData[id];
        const isDone = completedScenes.includes(Number(id));

        const card = document.createElement('div');
        card.className = `p-3.5 bg-white rounded-2xl border transition-all cursor-pointer flex items-center justify-between shadow-sm hover:shadow-md hover:border-amber-400 active:scale-99 ${isDone ? 'border-emerald-300 bg-emerald-50/30' : 'border-stone-200'}`;
        card.onclick = () => openDialogueScene(Number(id));

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm ${isDone ? 'bg-emerald-500 text-white' : 'bg-amber-100 text-amber-900'}">
              ${isDone ? '✓' : id}
            </div>
            <div>
              <h3 class="font-bold text-sm text-stone-800">${item.title}</h3>
              <p class="text-xs text-stone-500">${item.desc}</p>
            </div>
          </div>
          <div class="text-amber-600 font-bold text-sm">→</div>
        `;
        container.appendChild(card);
      });
    }

    // View Navigation
    function openDialogueScene(sceneId) {
      currentSceneId = sceneId;
      const scene = dialogueData[sceneId];

      document.getElementById('current-scene-title').innerText = scene.title;
      document.getElementById('view-scenes').classList.add('hidden');
      document.getElementById('view-dialogue').classList.remove('hidden');

      updateCompletionButton();
      renderDialogueBubbles();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navToScenes() {
      currentSceneId = null;
      window.speechSynthesis.cancel();
      document.getElementById('view-dialogue').classList.add('hidden');
      document.getElementById('view-scenes').classList.remove('hidden');
      renderSceneList();
      updateProgressUI();
    }

    // Render Dialogue Cards
    function renderDialogueBubbles() {
      const container = document.getElementById('dialogue-list');
      container.innerHTML = '';

      const list = dialogueData[currentSceneId].dialogues;

      list.forEach((item, index) => {
        const isPartnerA = item.speaker === 'A';

        // Check visibility according to practice mode
        let isHidden = false;
        if (currentMode === 'roleA' && !isPartnerA) isHidden = true;
        if (currentMode === 'roleB' && isPartnerA) isHidden = true;

        const card = document.createElement('div');
        card.className = `p-4 rounded-2xl border transition-all relative ${isPartnerA ? 'bg-amber-50/60 border-amber-200' : 'bg-emerald-50/60 border-emerald-200'}`;

        // Format Interactive Words
        let formattedHebrew = item.heb;
        if (item.words && item.words.length > 0) {
          item.words.forEach(w => {
            const escaped = escapeRegExp(w.heb);
            const regex = new RegExp(escaped, 'g');
            formattedHebrew = formattedHebrew.replace(regex, `<span class="clickable-word" onclick="openWordModal('${w.heb}', '${w.kana}', '${w.meaning}')">${w.heb}</span>`);
          });
        }

        card.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${isPartnerA ? 'bg-amber-200/80 text-amber-900' : 'bg-emerald-200/80 text-emerald-900'}">
              パートナー ${item.speaker}
            </span>
            <button onclick="speakKatakanaWithPause('${escapeSingleQuotes(item.kana)}')" class="w-8 h-8 rounded-full bg-white shadow-sm border border-stone-200 flex items-center justify-center text-sm active:scale-95 transition-transform">
              🔊
            </button>
          </div>

          <div class="${isHidden ? 'blur-sm select-none opacity-40' : ''} transition-all">
            <!-- Hebrew text (RTL with Nikud) -->
            <div class="hebrew-font text-xl sm:text-2xl font-bold text-stone-900 leading-relaxed mb-1 text-right">
              ${formattedHebrew}
            </div>
            <!-- Katakana Pronunciation -->
            <div class="text-xs sm:text-sm font-bold text-amber-950 mb-1">
              ${item.kana}
            </div>
            <!-- Japanese Translation -->
            <div class="text-xs text-stone-600">
              ${item.jp}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Japanese Speech Synthesis with Automatic Pause Spacing ('ja-JP')
    function speakKatakanaWithPause(text) {
      window.speechSynthesis.cancel();

      // Insert pauses (,,) at spaces and punctuation for slow, clear reading
      const spacedText = text
        .replace(/ /g, '、、 ')
        .replace(/[！!？?、,。.]/g, '、、 ');

      const utterance = new SpeechSynthesisUtterance(spacedText);
      utterance.lang = 'ja-JP';
      utterance.rate = currentSpeechRate;
      utterance.pitch = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    // Speed Control Toggle
    function setSpeed(rate, btn) {
      currentSpeechRate = rate;
      document.querySelectorAll('.speed-btn').forEach(b => {
        b.className = 'speed-btn px-2.5 py-1 rounded-lg font-medium text-stone-600 transition-all';
      });
      btn.className = 'speed-btn active bg-amber-500 text-white font-bold px-2.5 py-1 rounded-lg transition-all shadow-sm';
    }

    // Practice Mode Switcher
    function setPracticeMode(mode) {
      currentMode = mode;
      ['all', 'roleA', 'roleB'].forEach(m => {
        const btn = document.getElementById(`mode-btn-${m}`);
        if (m === mode) {
          btn.className = 'mode-btn bg-amber-50 text-amber-800 border border-amber-300 font-bold py-1.5 px-2 rounded-xl text-center shadow-xs';
        } else {
          btn.className = 'mode-btn bg-stone-50 text-stone-600 border border-stone-200 font-medium py-1.5 px-2 rounded-xl text-center';
        }
      });
      renderDialogueBubbles();
    }

    // Word Lookup Modal
    function openWordModal(heb, kana, meaning) {
      document.getElementById('modal-heb').innerText = heb;
      document.getElementById('modal-kana').innerText = kana;
      document.getElementById('modal-meaning').innerText = meaning;

      const audioBtn = document.getElementById('modal-audio-btn');
      audioBtn.onclick = () => speakKatakanaWithPause(kana);

      document.getElementById('word-modal').classList.remove('hidden');
    }

    function closeWordModal(e) {
      document.getElementById('word-modal').classList.add('hidden');
    }

    // Progress Tracker
    function toggleSceneCompletion() {
      if (!currentSceneId) return;

      const index = completedScenes.indexOf(currentSceneId);
      if (index > -1) {
        completedScenes.splice(index, 1);
      } else {
        completedScenes.push(currentSceneId);
      }

      localStorage.setItem('hebrew_completed_scenes', JSON.stringify(completedScenes));
      updateCompletionButton();
      updateProgressUI();
    }

    function updateCompletionButton() {
      const btn = document.getElementById('btn-complete-scene');
      const isDone = completedScenes.includes(currentSceneId);

      if (isDone) {
        btn.className = 'w-full py-3 px-4 bg-stone-200 text-stone-700 hover:bg-stone-300 active:scale-98 rounded-2xl font-bold transition-all flex items-center justify-center gap-2';
        btn.innerHTML = '<span>✕ 完了を取り消す</span>';
      } else {
        btn.className = 'w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white rounded-2xl font-bold shadow-md transition-all flex items-center justify-center gap-2';
        btn.innerHTML = '<span>✓ このシーンを完了にする</span>';
      }
    }

    function updateProgressUI() {
      document.getElementById('progress-count').innerText = completedScenes.length;
    }

    // Utilities
    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    function escapeSingleQuotes(string) {
      return string.replace(/'/g, "\\'");
    }
  </script>
</body>
</html>
