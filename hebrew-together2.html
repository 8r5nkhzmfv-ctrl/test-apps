<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヘブル語対話パートナー - Daily Hebrew Practice</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fdfbf7;
        }

        /* ヘブル語RTLと句読点の文字化け・反転防止スタイル */
        .hebrew-text {
            font-family: 'Heebo', sans-serif;
            direction: rtl;
            unicode-bidi: isolate;
            line-height: 1.7;
        }

        /* 単語タップ領域 */
        .hebrew-word {
            display: inline-block;
            direction: rtl;
            unicode-bidi: isolate;
            cursor: pointer;
            padding: 2px 4px;
            margin: 1px 2px;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .hebrew-word:hover {
            background-color: #fef3c7;
            color: #92400e;
            transform: translateY(-1px);
        }

        .kana-word {
            display: inline-block;
            cursor: pointer;
            padding: 1px 3px;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .kana-word:hover {
            background-color: #fde68a;
            color: #78350f;
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between selection:bg-amber-100">

                </div>

                <!-- 読み上げ速度切替 -->

        /* --- 状態管理 --- */
        let currentSceneIndex = 0;
        let currentStep = 0; // 現在の発話ステップ (0~7)
        let mode = 'interactive'; // 'interactive', 'auto', 'quiz'
        let playbackSpeed = 0.88;
        let completedScenes = JSON.parse(localStorage.getItem('hebrew_completed_scenes_v2') || '[]');
        let isAutoPlaying = false;
        let synth = window.speechSynthesis;

        /* --- 初期ロード --- */
        window.onload = function() {
            renderSceneList();
            loadScene(0);
        };

        /* --- 左側シーン一覧のレンダリング --- */
        function renderSceneList() {
            const listEl = document.getElementById('sceneList');
            listEl.innerHTML = '';

            dialogueData.forEach((scene, index) => {
                const isCompleted = completedScenes.includes(scene.id);
                const isActive = index === currentSceneIndex;

                const item = document.createElement('div');
                item.className = `p-3 rounded-xl border cursor-pointer transition-all flex items-center justify-between ${
                    isActive 
                        ? 'bg-amber-100/80 border-amber-400 font-bold text-amber-950 shadow-sm' 
                        : 'bg-white border-amber-100 hover:bg-amber-50/60 text-slate-700'
                }`;
                item.onclick = () => selectScene(index);

                item.innerHTML = `
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <span class="w-6 h-6 rounded-lg flex items-center justify-center text-xs ${isActive ? 'bg-amber-700 text-white' : 'bg-amber-100 text-amber-800'} font-bold flex-shrink-0">
                            ${scene.id}
                        </span>
                        <div class="truncate text-xs md:text-sm">${scene.title.split('. ')[1]}</div>
                    </div>
                    ${isCompleted ? '<i class="fa-solid fa-circle-check text-emerald-600 text-sm flex-shrink-0"></i>' : ''}
                `;
                listEl.appendChild(item);
            });

            document.getElementById('overallProgress').innerText = `${completedScenes.length} / 14 シーン完了`;
        }

        /* --- シーン切り替え --- */
        function selectScene(index) {
            currentSceneIndex = index;
            currentStep = 0;
            isAutoPlaying = false;
            synth.cancel();
            renderSceneList();
            loadScene(index);
        }

        /* --- シーン詳細のロード --- */
        function loadScene(index) {
            const scene = dialogueData[index];
            document.getElementById('currentSceneTitle').innerText = scene.title;
            document.getElementById('currentSceneDesc').innerText = scene.desc;

            const isCompleted = completedScenes.includes(scene.id);
            const btnComplete = document.getElementById('btnComplete');
            if (isCompleted) {
                btnComplete.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-emerald-600 text-white shadow-sm";
                btnComplete.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> 完了済み';
            } else {
                btnComplete.className = "px-3 py-1.5 rounded-xl text-xs font-bold border transition-all border-emerald-600 text-emerald-700 hover:bg-emerald-50";
                btnComplete.innerHTML = '<i class="fa-regular fa-circle-check mr-1"></i> 完了にする';
            }

            renderChat();
            updateActionButton();
        }

        /* --- 会話吹き出しの生成 --- */
        function renderChat() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';

            const scene = dialogueData[currentSceneIndex];
            const limit = currentStep;

            for (let i = 0; i <= limit && i < scene.dialogue.length; i++) {
                const item = scene.dialogue[i];
                const isA = item.speaker === "A";
                const isMasked = (mode === 'quiz' && i === currentStep && !isA);

                // ヘブル語・カタカナ単語分解（単語辞書タップ対応）
                const hebrewWordsHTML = item.text.split(' ').map(w => `<span class="hebrew-word" onclick="lookupWord('${w}')" dir="rtl">${w}</span>`).join(' ');
                const kanaWordsHTML = item.kana.split(' ').map(k => `<span class="kana-word" onclick="lookupKana('${k}')">${k}</span>`).join(' ');

                const bubble = document.createElement('div');
                bubble.className = `flex flex-col ${isA ? 'items-start' : 'items-end'} mb-3`;

                bubble.innerHTML = `
                    <div class="text-[10px] font-bold text-amber-900/60 mb-1 px-1 flex items-center gap-1">
                        <i class="fa-solid ${isA ? 'fa-user text-amber-700' : 'fa-user-gear text-amber-900'}"></i> パートナー ${item.speaker}
                    </div>
                    <div class="max-w-[88%] md:max-w-[80%] rounded-2xl px-4 py-3 shadow-sm ${
                        isA 
                            ? 'bg-white border border-amber-200/80 text-slate-800 rounded-tl-none' 
                            : 'bg-amber-800 text-white rounded-tr-none'
                    }">
                        <!-- ヘブル語 (RTL表示) -->
                        <div class="hebrew-text text-xl md:text-2xl font-bold mb-1.5 tracking-wide ${isA ? 'text-amber-950' : 'text-amber-50'}" dir="rtl">
                            ${isMasked ? '<span class="text-amber-200 text-base font-normal italic">??? (カタカナを聞いて答えてみよう)</span>' : hebrewWordsHTML}
                        </div>

                        <!-- カタカナ -->
                        <div class="text-xs md:text-sm font-semibold mb-1 ${isA ? 'text-amber-700' : 'text-amber-200'}">
                            ${kanaWordsHTML}
                        </div>

                        <!-- 日本語訳 -->
                        <div class="text-xs ${isA ? 'text-slate-500' : 'text-amber-100/80'} border-t ${isA ? 'border-slate-100' : 'border-amber-700'} pt-1.5 mt-1.5">
                            ${item.jp}
                        </div>
                    </div>
                    <button onclick="playAudio('${item.kana}')" class="mt-1 text-amber-800/60 hover:text-amber-900 text-[11px] px-2 py-0.5 rounded-full hover:bg-amber-100/50 transition-colors">
                        <i class="fa-solid fa-volume-high mr-1"></i>再生
                    </button>
                `;

                container.appendChild(bubble);
            }

            container.scrollTop = container.scrollHeight;
        }

        /* --- 練習モード設定 --- */
        function setMode(newMode) {
            mode = newMode;
            document.getElementById('btnModeInteractive').className = mode === 'interactive' ? 'flex-1 sm:flex-none px-3 py-1.5 text-xs font-bold rounded-lg transition-all shadow-sm bg-amber-700 text-white' : 'flex-1 sm:flex-none px-3 py-1.5 text-xs font-bold rounded-lg transition-all text-amber-900 hover:text-amber-700';
            document.getElementById('btnModeAuto').className = mode === 'auto' ? 'flex-1 sm:flex-none px-3 py-1.5 text-xs font-bold rounded-lg transition-all shadow-sm bg-amber-700 text-white' : 'flex-1 sm:flex-none px-3 py-1.5 text-xs font-bold rounded-lg transition-all text-amber-900 hover:text-amber-700';
            document.getElementById('btnModeQuiz').className = mode === 'quiz' ? 'flex-1 sm:flex-none px-3 py-1.5 text-xs font-bold rounded-lg transition-all shadow-sm bg-amber-700 text-white' : 'flex-1 sm:flex-none px-3 py-1.5 text-xs font-bold rounded-lg transition-all text-amber-900 hover:text-amber-700';

            currentStep = 0;
            isAutoPlaying = false;
            synth.cancel();
            renderChat();
            updateActionButton();
        }

        /* --- 速度設定 --- */
        function setSpeed(speed) {
            playbackSpeed = speed;
            document.getElementById('speedSlow').className = speed === 0.75 ? 'px-2 py-1 rounded-lg bg-amber-700 font-bold text-white shadow-sm' : 'px-2 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-900';
            document.getElementById('speedNormal').className = speed === 0.88 ? 'px-2 py-1 rounded-lg bg-amber-700 font-bold text-white shadow-sm' : 'px-2 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-900';
            document.getElementById('speedFast').className = speed === 1.05 ? 'px-2 py-1 rounded-lg bg-amber-700 font-bold text-white shadow-sm' : 'px-2 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-900';
        }

        /* --- アクションボタン処理 --- */
        function handleMainAction() {
            const scene = dialogueData[currentSceneIndex];

            if (mode === 'interactive' || mode === 'quiz') {
                if (currentStep < scene.dialogue.length) {
                    const item = scene.dialogue[currentStep];
                    playAudio(item.kana, () => {
                        currentStep++;
                        renderChat();
                        updateActionButton();
                    });
                } else {
                    currentStep = 0;
                    renderChat();
                    updateActionButton();
                }
            } else if (mode === 'auto') {
                if (!isAutoPlaying) {
                    isAutoPlaying = true;
                    playAutoSequence();
                } else {
                    isAutoPlaying = false;
                    synth.cancel();
                    updateActionButton();
                }
            }
        }

        /* --- 自動再生ループ --- */
        function playAutoSequence() {
            const scene = dialogueData[currentSceneIndex];
            if (!isAutoPlaying) return;

            if (currentStep < scene.dialogue.length) {
                renderChat();
                const item = scene.dialogue[currentStep];
                updateActionButton();

                playAudio(item.kana, () => {
                    currentStep++;
                    setTimeout(() => {
                        if (isAutoPlaying) playAutoSequence();
                    }, 700);
                });
            } else {
                isAutoPlaying = false;
                currentStep = 0;
                updateActionButton();
            }
        }

        /* --- アクションボタン表示更新 --- */
        function updateActionButton() {
            const btn = document.getElementById('mainActionButton');
            const scene = dialogueData[currentSceneIndex];

            if (mode === 'auto') {
                if (isAutoPlaying) {
                    btn.innerHTML = '<i class="fa-solid fa-pause"></i> <span>一時停止</span>';
                    btn.className = "flex-1 bg-amber-600 hover:bg-amber-700 text-white py-3 px-4 rounded-xl font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2";
                } else {
                    btn.innerHTML = '<i class="fa-solid fa-play"></i> <span>自動再生をスタート</span>';
                    btn.className = "flex-1 bg-amber-700 hover:bg-amber-800 text-white py-3 px-4 rounded-xl font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2";
                }
            } else {
                if (currentStep === 0) {
                    btn.innerHTML = '<i class="fa-solid fa-comments"></i> <span>会話をスタート</span>';
                } else if (currentStep < scene.dialogue.length) {
                    btn.innerHTML = `<i class="fa-solid fa-forward"></i> <span>つぎの発話へ (${currentStep + 1}/${scene.dialogue.length})</span>`;
                } else {
                    btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> <span>もう一度練習する</span>';
                }
                btn.className = "flex-1 bg-amber-700 hover:bg-amber-800 text-white py-3 px-4 rounded-xl font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2";
            }
        }

        /* --- 音声読み上げ (ja-JP カタカナ・ポーズ挿入ロジック) --- */
        function playAudio(kanaText, onEndCallback) {
            synth.cancel();

            // 単語や記号の間にポーズ（、）を挟み一語ずつ聞きやすく整形
            const processedText = kanaText.split(' ').join('、、 ');

            const utterance = new SpeechSynthesisUtterance(processedText);
            utterance.lang = 'ja-JP';
            utterance.rate = playbackSpeed;
            utterance.pitch = 1.0;

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            synth.speak(utterance);
        }

        /* --- リセット --- */
        function resetDialogue() {
            synth.cancel();
            isAutoPlaying = false;
            currentStep = 0;
            renderChat();
            updateActionButton();
        }

        /* --- 単語辞書タップ（ヘブル語） --- */
        function lookupWord(word) {
            const cleanWord = word.replace(/[.,!?]/g, '');
            const entry = dictionary[word] || dictionary[cleanWord];

            if (entry) {
                showModal(word, entry.kana, entry.meaning);
            } else {
                showModal(word, word, "ヘブル語単語");
            }
        }

        /* --- 単語辞書タップ（カタカナ） --- */
        function lookupKana(kana) {
            const cleanKana = kana.replace(/[！？、。]/g, '');
            for (let k in dictionary) {
                if (dictionary[k].kana === cleanKana || dictionary[k].kana === kana) {
                    showModal(k, dictionary[k].kana, dictionary[k].meaning);
                    return;
                }
            }
            showModal(kana, kana, "対話表現");
        }

        /* --- 辞書ポップアップ制御 --- */
        function showModal(hebrew, kana, meaning) {
            document.getElementById('modalHebrew').innerText = hebrew;
            document.getElementById('modalKana').innerText = kana;
            document.getElementById('modalMeaning').innerText = meaning;
            document.getElementById('dictionaryModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('dictionaryModal').classList.add('hidden');
        }

        function playModalAudio() {
            const kana = document.getElementById('modalKana').innerText;
            playAudio(kana);
        }

        /* --- シーン完了記録（ローカルストレージ） --- */
        function toggleComplete() {
            const sceneId = dialogueData[currentSceneIndex].id;
            const index = completedScenes.indexOf(sceneId);

            if (index > -1) {
                completedScenes.splice(index, 1);
            } else {
                completedScenes.push(sceneId);
            }

            localStorage.setItem('hebrew_completed_scenes_v2', JSON.stringify(completedScenes));
            renderSceneList();
            loadScene(currentSceneIndex);
        }
    </script>
</body>
