<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>マクロファージの一日</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500;700&display=swap');

    * {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      font-family: 'Kiwi Maru', serif;
      background-color: #f6f0e6;
      color: #5a4a42;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: fixed;
    }

    /* Picture book paper texture */
    .paper-bg {
      background-color: #faf5ed;
      background-image: 
        radial-gradient(#ebdccb 15%, transparent 16%),
        radial-gradient(#ebdccb 15%, transparent 16%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    .hand-border {
      border: 3.5px solid #5a4a42;
      border-radius: 22px 12px 20px 14px / 14px 20px 12px 22px;
      box-shadow: 3px 4px 0px rgba(90, 74, 66, 0.18);
    }

    .hand-btn {
      border: 3.5px solid #5a4a42;
      border-radius: 50%;
      box-shadow: 2px 3.5px 0px #5a4a42;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .hand-btn:active {
      transform: translateY(3px) scale(0.93);
      box-shadow: 0px 1px 0px #5a4a42;
    }

    /* Virtual Joystick Styles */
    .joystick-base {
      width: 110px;
      height: 110px;
      background: rgba(255, 251, 244, 0.85);
      border: 3.5px solid #5a4a42;
      border-radius: 50%;
      position: absolute;
      bottom: 20px;
      left: 18px;
      touch-action: none;
      box-shadow: 2px 3px 0px rgba(90, 74, 66, 0.2);
    }

    .joystick-stick {
      width: 48px;
      height: 48px;
      background: #fbbf24;
      border: 3.5px solid #5a4a42;
      border-radius: 50%;
      position: absolute;
      top: 27px;
      left: 27px;
      pointer-events: none;
      box-shadow: 1px 2px 0px #5a4a42;
    }

    /* Keyframe pulse animations for icon alerts */
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(245,158,11,0.5)); }
      50% { transform: scale(1.12); filter: drop-shadow(0 0 8px rgba(245,158,11,0.9)); }
    }

    .glow-ready {
      animation: pulse-glow 1s infinite ease-in-out;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="w-full h-full flex flex-col justify-between items-center paper-bg p-2 select-none overflow-hidden">

  <!-- TOP MOBILE VISUAL HUD BAR -->
  <header class="w-full max-w-lg flex items-center justify-between bg-[#fffbf4] hand-border px-3 py-2 z-20">
    <!-- HP & ATP STARS -->
    <div class="flex items-center space-x-2">
      <!-- HP Heart Meter -->
      <div class="flex items-center bg-rose-50 px-2 py-1 rounded-full border-2 border-[#5a4a42]">
        <span class="text-sm mr-1">❤️</span>
        <div class="w-16 sm:w-20 h-3 bg-rose-100 rounded-full border border-[#5a4a42] overflow-hidden">
          <div id="hp-bar" class="h-full bg-rose-400 transition-all duration-200" style="width: 100%;"></div>
        </div>
      </div>

      <!-- Energy Star Count -->
      <div class="flex items-center bg-amber-100 px-2.5 py-1 rounded-full border-2 border-[#5a4a42]">
        <span class="text-sm mr-1">⭐</span>
        <span id="atp-count" class="text-sm font-bold text-amber-950">0</span>
      </div>
    </div>

    <!-- FULLNESS & MODE ICON BADGES -->
    <div class="flex items-center space-x-2">
      <!-- Fullness Belly Meter -->
      <div class="flex items-center bg-amber-50 px-2 py-1 rounded-full border-2 border-[#5a4a42]">
        <span id="belly-icon" class="text-sm mr-1">🥐</span>
        <div class="w-10 h-2.5 bg-amber-100 rounded-full border border-[#5a4a42] overflow-hidden">
          <div id="fullness-bar" class="h-full bg-amber-400 transition-all duration-200" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Current Form Indicator -->
      <div id="hud-mode-badge" class="w-9 h-9 rounded-full border-2 border-[#5a4a42] bg-amber-200 flex items-center justify-center text-lg shadow-sm">
        <span id="hud-mode-icon">🟡</span>
      </div>
    </div>
  </header>

  <!-- MAIN CANVAS CONTAINER -->
  <main class="relative w-full max-w-lg flex-1 my-1 overflow-hidden hand-border bg-[#fcf8f2]">
    <canvas id="gameCanvas"></canvas>

    <!-- START / VISUAL TUTORIAL OVERLAY -->
    <div id="overlay-screen" class="absolute inset-0 bg-[#faf5ed]/95 flex flex-col justify-center items-center p-3 text-center z-40 transition-opacity duration-300">
      <div class="bg-[#fffbf4] hand-border p-4 max-w-xs w-full flex flex-col items-center">
        <!-- Title with Emoji -->
        <div class="text-3xl mb-1">🧫 🩹 🦠</div>

        <!-- Visual Touch Tutorial Cards (MINIMAL TEXT, PURE VISUALS) -->
        <div class="grid grid-cols-2 gap-2 my-3 w-full">
          <div class="bg-amber-50 p-2 rounded-xl border-2 border-[#5a4a42] flex flex-col items-center">
            <span class="text-2xl">🕹️</span>
            <span class="text-[11px] font-bold mt-1 text-stone-700">🏃‍♂️ ──></span>
          </div>

          <div class="bg-rose-50 p-2 rounded-xl border-2 border-[#5a4a42] flex flex-col items-center">
            <span class="text-2xl">🖐️</span>
            <span class="text-[11px] font-bold mt-1 text-stone-700">👅 ──> 🦠</span>
          </div>

          <div class="bg-orange-50 p-2 rounded-xl border-2 border-[#5a4a42] flex flex-col items-center">
            <span class="text-2xl">🔥 / 🩹</span>
            <span class="text-[11px] font-bold mt-1 text-stone-700">⚔️ 💥 / 🌱 ✨</span>
          </div>

          <div class="bg-sky-50 p-2 rounded-xl border-2 border-[#5a4a42] flex flex-col items-center">
            <span class="text-2xl">🎺</span>
            <span class="text-[11px] font-bold mt-1 text-stone-700">🧫×5 ──> 🦺</span>
          </div>
        </div>

        <button onclick="startGame()" class="hand-btn bg-amber-400 hover:bg-amber-300 text-amber-950 font-bold w-16 h-16 text-2xl flex items-center justify-center cursor-pointer my-1">
          ▶️
        </button>
      </div>
    </div>

    <!-- PICTURE BOOK PATROL DIARY (RESULT SCREEN) -->
    <div id="journal-screen" class="hidden absolute inset-0 bg-[#faf5ed]/95 flex flex-col justify-center items-center p-4 z-50">
      <div class="bg-[#fffbf4] hand-border p-5 max-w-xs w-full text-center flex flex-col items-center">
        <div id="journal-stamp" class="text-5xl mb-2">💮</div>

        <div class="w-full h-1 bg-[#5a4a42] rounded-full my-2"></div>
        
        <!-- VISUAL RESULT STICKERS -->
        <div id="journal-content" class="text-base font-bold my-3 w-full bg-amber-50 p-3 rounded-xl border-2 border-[#5a4a42] space-y-2">
          <!-- Filled by JS with icons -->
        </div>

        <button onclick="restartGame()" class="hand-btn bg-amber-400 w-14 h-14 text-2xl flex items-center justify-center cursor-pointer mt-1">
          🔄
        </button>
      </div>
    </div>
  </main>

  <!-- TOUCH CONTROLS OVERLAY (PURE ICON CONTROLS) -->
  <div id="touch-controls" class="w-full max-w-lg h-36 relative z-30 select-none">
    <!-- Virtual Joystick Left -->
    <div id="joystick-base" class="joystick-base">
      <div id="joystick-stick" class="joystick-stick"></div>
    </div>

    <!-- Virtual Action Icon Buttons Right -->
    <div class="absolute bottom-2 right-3 flex flex-col items-end space-y-2">
      <!-- Top Row: Cytokine & Form Toggle -->
      <div class="flex items-center space-x-2">
        <!-- Cytokine Bugle Button -->
        <button id="cytokine-btn" onclick="triggerCytokine()" class="hand-btn w-13 h-13 bg-sky-200 text-xl flex flex-col items-center justify-center disabled:opacity-40" disabled>
          <span>🎺</span>
          <!-- Antigen Visual Stamp Bar -->
          <div id="antigen-stamps" class="flex space-x-0.5 mt-0.5">
            <span class="w-1.5 h-1.5 rounded-full bg-stone-300 border border-[#5a4a42]"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-stone-300 border border-[#5a4a42]"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-stone-300 border border-[#5a4a42]"></span>
          </div>
        </button>

        <!-- Form Toggle Button (⚔️ Attack / 🩹 Repair) -->
        <button id="mode-btn" onclick="toggleMode()" class="hand-btn w-13 h-13 bg-amber-300 text-2xl flex items-center justify-center">
          <span id="mode-icon">🟡</span>
        </button>
      </div>

      <!-- Bottom Row: Big Pseudopod Arm Button -->
      <button id="shoot-btn" onclick="shootPseudopodButton()" class="hand-btn w-16 h-16 bg-rose-400 active:bg-rose-500 text-3xl flex items-center justify-center shadow-md">
        🖐️
      </button>
    </div>
  </div>

  <script>
    /* --- AUDIO SYNTHESIS (Web Audio API for Touch) --- */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'eat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'shoot') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.18);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'repair') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'shockwave') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.25);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'hit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.12);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        }
      } catch (e) { console.error(e); }
    }

    /* --- GAME ENGINE & CANVAS SETUP --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameRunning = false;
    let animationFrameId = null;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    /* --- VIRTUAL TOUCH JOYSTICK --- */
    const joystickBase = document.getElementById('joystick-base');
    const joystickStick = document.getElementById('joystick-stick');

    let joystickActive = false;
    let joystickVector = { x: 0, y: 0 };
    let joystickTouchId = null;

    joystickBase.addEventListener('touchstart', (e) => {
      initAudio();
      e.preventDefault();
      const touch = e.changedTouches[0];
      joystickTouchId = touch.identifier;
      joystickActive = true;
      updateJoystick(touch);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!joystickActive) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) {
          updateJoystick(e.changedTouches[i]);
          break;
        }
      }
    }, { passive: false });

    const endJoystick = (e) => {
      if (!joystickActive) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) {
          joystickActive = false;
          joystickTouchId = null;
          joystickVector = { x: 0, y: 0 };
          joystickStick.style.transform = 'translate(0px, 0px)';
          break;
        }
      }
    };

    window.addEventListener('touchend', endJoystick);
    window.addEventListener('touchcancel', endJoystick);

    function updateJoystick(touch) {
      const rect = joystickBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = touch.clientX - centerX;
      let dy = touch.clientY - centerY;
      const dist = Math.hypot(dx, dy);
      const maxRadius = 38;

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }

      joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
      joystickVector = { x: dx / maxRadius, y: dy / maxRadius };
    }

    /* --- DIRECT CANVAS TAP TO EXTEND ARM --- */
    canvas.addEventListener('touchstart', (e) => {
      initAudio();
      if (!gameRunning) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const targetX = touch.clientX - rect.left;
      const targetY = touch.clientY - rect.top;

      shootPseudopodTowards(targetX, targetY);
    }, { passive: false });

    /* --- GAME STATE & ENTITIES --- */
    let player = {
      x: 180, y: 220,
      radius: 25,
      vx: 0, vy: 0,
      speed: 3.6,
      hp: 100, maxHp: 100,
      atp: 0,
      fullness: 0, maxFullness: 100,
      mode: 'NORMAL', // 'NORMAL', 'M1', 'M2'
      antigens: 0,
      maxAntigens: 3,
      wobbleAngle: 0,
      aimAngle: 0
    };

    let pseudopod = {
      active: false,
      x: 0, y: 0,
      targetX: 0, targetY: 0,
      length: 0,
      maxLength: 210,
      speed: 17,
      state: 'extending'
    };

    let bacteriaList = [];
    let inflammationList = [];
    let particleList = [];
    let visualPopups = []; // Floating emojis/icons instead of text
    let helperTCells = [];

    let stats = { eatenStaph: 0, eatenDust: 0, repairedInflammation: 0, cytokinesCalled: 0 };

    /* --- GAME CONTROLS & MODES --- */
    function startGame() {
      initAudio();
      document.getElementById('overlay-screen').classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        document.getElementById('overlay-screen').classList.add('hidden');
      }, 300);

      resetGameState();
      gameRunning = true;
      requestAnimationFrame(gameLoop);
    }

    function resetGameState() {
      resizeCanvas();
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.hp = 100;
      player.atp = 0;
      player.fullness = 0;
      player.antigens = 0;
      player.mode = 'NORMAL';

      stats = { eatenStaph: 0, eatenDust: 0, repairedInflammation: 0, cytokinesCalled: 0 };

      bacteriaList = [];
      inflammationList = [];
      particleList = [];
      visualPopups = [];
      helperTCells = [];

      for (let i = 0; i < 6; i++) spawnBacteria();
      for (let i = 0; i < 3; i++) spawnInflammation();

      updateHUD();
      setMode('NORMAL');
    }

    function toggleMode() {
      if (!gameRunning) return;
      if (player.mode === 'NORMAL') setMode('M1');
      else if (player.mode === 'M1') setMode('M2');
      else setMode('NORMAL');
    }

    function setMode(mode) {
      player.mode = mode;
      const modeIcon = document.getElementById('mode-icon');
      const modeBtn = document.getElementById('mode-btn');
      const hudBadge = document.getElementById('hud-mode-badge');
      const hudIcon = document.getElementById('hud-mode-icon');

      if (mode === 'M1') {
        modeIcon.innerText = '🔥';
        hudIcon.innerText = '🔥';
        modeBtn.className = 'hand-btn w-13 h-13 bg-rose-300 text-2xl flex items-center justify-center';
        hudBadge.className = 'w-9 h-9 rounded-full border-2 border-[#5a4a42] bg-rose-300 flex items-center justify-center text-lg shadow-sm';
        addVisualPopup(player.x, player.y - 25, '⚔️⚡');
        playSound('shockwave');
      } else if (mode === 'M2') {
        modeIcon.innerText = '🌱';
        hudIcon.innerText = '🌱';
        modeBtn.className = 'hand-btn w-13 h-13 bg-emerald-300 text-2xl flex items-center justify-center';
        hudBadge.className = 'w-9 h-9 rounded-full border-2 border-[#5a4a42] bg-emerald-300 flex items-center justify-center text-lg shadow-sm';
        addVisualPopup(player.x, player.y - 25, '🩹✨');
        playSound('repair');
      } else {
        modeIcon.innerText = '🟡';
        hudIcon.innerText = '🟡';
        modeBtn.className = 'hand-btn w-13 h-13 bg-amber-300 text-2xl flex items-center justify-center';
        hudBadge.className = 'w-9 h-9 rounded-full border-2 border-[#5a4a42] bg-amber-200 flex items-center justify-center text-lg shadow-sm';
      }
    }

    function triggerCytokine() {
      if (player.antigens >= player.maxAntigens) {
        player.antigens = 0;
        stats.cytokinesCalled++;
        playSound('shockwave');

        helperTCells.push({
          x: player.x,
          y: player.y - 80,
          life: 250
        });

        addVisualPopup(player.x, player.y - 35, '🎺🦺✨');
        
        bacteriaList.forEach(b => {
          if (Math.hypot(b.x - player.x, b.y - player.y) < 220) {
            b.hp -= 2;
            createParticles(b.x, b.y, '#f59e0b', 6);
          }
        });

        updateHUD();
      }
    }

    function shootPseudopodButton() {
      if (!gameRunning || pseudopod.active) return;
      
      let angle = player.aimAngle;
      if (joystickVector.x !== 0 || joystickVector.y !== 0) {
        angle = Math.atan2(joystickVector.y, joystickVector.x);
      }
      
      const targetX = player.x + Math.cos(angle) * pseudopod.maxLength;
      const targetY = player.y + Math.sin(angle) * pseudopod.maxLength;
      shootPseudopodTowards(targetX, targetY);
    }

    function shootPseudopodTowards(tx, ty) {
      if (pseudopod.active) return;

      const angle = Math.atan2(ty - player.y, tx - player.x);
      player.aimAngle = angle;

      pseudopod.active = true;
      pseudopod.x = player.x;
      pseudopod.y = player.y;
      pseudopod.targetX = player.x + Math.cos(angle) * pseudopod.maxLength;
      pseudopod.targetY = player.y + Math.sin(angle) * pseudopod.maxLength;
      pseudopod.length = 0;
      pseudopod.state = 'extending';

      playSound('shoot');
    }

    /* --- SPAWNERS --- */
    function spawnBacteria() {
      const margin = 30;
      const type = Math.random() < 0.7 ? 'staph' : 'dust';
      bacteriaList.push({
        x: margin + Math.random() * (canvas.width - margin * 2),
        y: margin + Math.random() * (canvas.height - margin * 2),
        type: type,
        radius: type === 'staph' ? 12 : 15,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        hp: type === 'staph' ? 1 : 2,
        wobble: Math.random() * Math.PI * 2
      });
    }

    function spawnInflammation() {
      const margin = 50;
      inflammationList.push({
        x: margin + Math.random() * (canvas.width - margin * 2),
        y: margin + Math.random() * (canvas.height - margin * 2),
        radius: 22 + Math.random() * 12,
        health: 100,
        pulse: 0
      });
    }

    function addVisualPopup(x, y, icon) {
      visualPopups.push({ x, y, icon, alpha: 1, life: 35, scale: 0.7 });
    }

    function createParticles(x, y, color, count = 6) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 2.5;
        particleList.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          radius: 2.5 + Math.random() * 2.5,
          life: 15 + Math.random() * 12
        });
      }
    }

    /* --- UPDATE LOOP --- */
    function update() {
      let moveSpeed = player.speed;
      if (player.mode === 'M1') moveSpeed *= 1.35;
      if (player.fullness > 80) moveSpeed *= 0.75;

      if (joystickActive && (joystickVector.x !== 0 || joystickVector.y !== 0)) {
        player.vx = player.vx * 0.6 + joystickVector.x * moveSpeed * 0.4;
        player.vy = player.vy * 0.6 + joystickVector.y * moveSpeed * 0.4;
        player.aimAngle = Math.atan2(joystickVector.y, joystickVector.x);
      } else {
        player.vx *= 0.7;
        player.vy *= 0.7;
      }

      player.x += player.vx;
      player.y += player.vy;

      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      player.wobbleAngle += 0.08;

      if (player.fullness > 0) player.fullness -= 0.06;

      // Pseudopod Action
      if (pseudopod.active) {
        const angle = Math.atan2(pseudopod.targetY - player.y, pseudopod.targetX - player.x);

        if (pseudopod.state === 'extending') {
          pseudopod.length += pseudopod.speed;
          pseudopod.x = player.x + Math.cos(angle) * pseudopod.length;
          pseudopod.y = player.y + Math.sin(angle) * pseudopod.length;

          bacteriaList.forEach(b => {
            if (Math.hypot(b.x - pseudopod.x, b.y - pseudopod.y) < b.radius + 10) {
              b.x = pseudopod.x;
              b.y = pseudopod.y;
              pseudopod.state = 'retracting';
            }
          });

          if (pseudopod.length >= pseudopod.maxLength) pseudopod.state = 'retracting';
        } else {
          pseudopod.length -= pseudopod.speed * 1.2;
          pseudopod.x = player.x + Math.cos(angle) * pseudopod.length;
          pseudopod.y = player.y + Math.sin(angle) * pseudopod.length;

          if (pseudopod.length <= 0) pseudopod.active = false;
        }
      }

      // Update Bacteria
      for (let i = bacteriaList.length - 1; i >= 0; i--) {
        const b = bacteriaList[i];
        b.x += b.vx;
        b.y += b.vy;
        b.wobble += 0.05;

        if (b.x < b.radius || b.x > canvas.width - b.radius) b.vx *= -1;
        if (b.y < b.radius || b.y > canvas.height - b.radius) b.vy *= -1;

        const dist = Math.hypot(player.x - b.x, player.y - b.y);
        const devourRange = player.radius + b.radius + (player.mode === 'M1' ? 8 : 0);

        if (dist < devourRange) {
          playSound('eat');
          createParticles(b.x, b.y, b.type === 'staph' ? '#fbbf24' : '#a8a29e', 8);

          if (b.type === 'staph') {
            player.atp += 15;
            player.hp = Math.min(player.maxHp, player.hp + 6);
            stats.eatenStaph++;
            addVisualPopup(b.x, b.y, '⭐✨');
          } else {
            player.atp += 25;
            player.hp = Math.min(player.maxHp, player.hp + 12);
            stats.eatenDust++;
            addVisualPopup(b.x, b.y, '🧹✨');
          }

          player.fullness = Math.min(player.maxFullness, player.fullness + 25);
          if (player.antigens < player.maxAntigens) player.antigens++;

          bacteriaList.splice(i, 1);
          spawnBacteria();
          updateHUD();
        }
      }

      // Update Inflammation & M2 Healing
      for (let i = inflammationList.length - 1; i >= 0; i--) {
        const inf = inflammationList[i];
        inf.pulse += 0.05;

        const dist = Math.hypot(player.x - inf.x, player.y - inf.y);

        if (player.mode === 'M2' && dist < player.radius + inf.radius) {
          inf.health -= 2.5;
          createParticles(inf.x, inf.y, '#34d399', 2);

          if (Math.random() < 0.1) playSound('repair');

          if (inf.health <= 0) {
            playSound('repair');
            addVisualPopup(inf.x, inf.y, '🩹❇️');
            createParticles(inf.x, inf.y, '#10b981', 16);
            player.atp += 35;
            stats.repairedInflammation++;
            inflammationList.splice(i, 1);
            spawnInflammation();
            updateHUD();
            continue;
          }
        }

        if (player.mode !== 'M2' && dist < inf.radius) {
          if (Math.random() < 0.03) {
            player.hp -= 3;
            playSound('hit');
            addVisualPopup(player.x, player.y, '😵⚡');
            updateHUD();

            if (player.hp <= 0) {
              endGame(false);
              return;
            }
          }
        }
      }

      // Update Helper T
      for (let i = helperTCells.length - 1; i >= 0; i--) {
        const ht = helperTCells[i];
        ht.life--;
        ht.x += (player.x + 30 - ht.x) * 0.05;
        ht.y += (player.y - 30 - ht.y) * 0.05;
        if (ht.life <= 0) helperTCells.splice(i, 1);
      }

      // Update Particles
      for (let i = particleList.length - 1; i >= 0; i--) {
        const p = particleList[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particleList.splice(i, 1);
      }

      // Update Visual Popups
      for (let i = visualPopups.length - 1; i >= 0; i--) {
        const vp = visualPopups[i];
        vp.y -= 0.9;
        vp.life--;
        vp.scale = Math.min(1.2, vp.scale + 0.03);
        vp.alpha = vp.life / 35;
        if (vp.life <= 0) visualPopups.splice(i, 1);
      }

      // Victory Condition (150 Stars)
      if (player.atp >= 150) {
        endGame(true);
      }
    }

    /* --- RENDERING --- */
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Tissue Background
      ctx.save();
      ctx.strokeStyle = '#f3e8d8';
      ctx.lineWidth = 1.5;
      for (let x = 30; x < canvas.width; x += 85) {
        for (let y = 30; y < canvas.height; y += 85) {
          ctx.beginPath();
          ctx.arc(x, y, 26, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.restore();

      // Inflamed Spots (🔥/🩹)
      inflammationList.forEach(inf => {
        ctx.save();
        ctx.translate(inf.x, inf.y);
        const r = inf.radius * (1 + Math.sin(inf.pulse) * 0.06);

        const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, r);
        grad.addColorStop(0, `rgba(244, 63, 94, ${0.45 * (inf.health / 100)})`);
        grad.addColorStop(1, 'rgba(244, 63, 94, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = `rgba(225, 29, 72, ${0.6 * (inf.health / 100)})`;
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 3]);
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
        ctx.stroke();

        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🩹', 0, 5);
        ctx.restore();
      });

      // Pseudopod Extension Line
      if (pseudopod.active) {
        ctx.save();
        ctx.strokeStyle = player.mode === 'M1' ? '#f87171' : (player.mode === 'M2' ? '#34d399' : '#fbbf24');
        ctx.lineWidth = 11;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(pseudopod.x, pseudopod.y);
        ctx.stroke();

        ctx.strokeStyle = '#fffbf4';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = player.mode === 'M1' ? '#ef4444' : '#f59e0b';
        ctx.beginPath();
        ctx.arc(pseudopod.x, pseudopod.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Bacteria
      bacteriaList.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);

        if (b.type === 'staph') {
          ctx.fillStyle = '#fef08a';
          ctx.strokeStyle = '#5a4a42';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#5a4a42';
          ctx.beginPath();
          ctx.arc(-3, -2, 2, 0, Math.PI * 2);
          ctx.arc(3, -2, 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#d6d3d1';
          ctx.strokeStyle = '#5a4a42';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 + b.wobble;
            const dist = b.radius + Math.sin(angle * 3) * 2.5;
            const px = Math.cos(angle) * dist;
            const py = Math.sin(angle) * dist;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      });

      // Helper T NPC
      helperTCells.forEach(ht => {
        ctx.save();
        ctx.translate(ht.x, ht.y);
        ctx.fillStyle = '#38bdf8';
        ctx.strokeStyle = '#5a4a42';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🦺', 0, 4);
        ctx.restore();
      });

      // Player Macrophage
      drawMacrophagePlayer();

      // Particles
      particleList.forEach(p => {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Visual Popups (Emojis)
      visualPopups.forEach(vp => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, vp.alpha);
        ctx.font = `${Math.round(20 * vp.scale)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(vp.icon, vp.x, vp.y);
        ctx.restore();
      });
    }

    function drawMacrophagePlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);

      let fillColor = '#fde047';
      let strokeColor = '#5a4a42';
      let auraColor = 'rgba(253, 224, 71, 0.35)';

      if (player.mode === 'M1') {
        fillColor = '#fb923c';
        auraColor = 'rgba(249, 115, 22, 0.45)';
      } else if (player.mode === 'M2') {
        fillColor = '#6ee7b7';
        auraColor = 'rgba(52, 211, 153, 0.45)';
      }

      ctx.fillStyle = auraColor;
      ctx.beginPath();
      ctx.arc(0, 0, player.radius + 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = fillColor;
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 3.5;

      ctx.beginPath();
      const points = 10;
      for (let i = 0; i < points; i++) {
        const angle = (i / points) * Math.PI * 2;
        let wobble = Math.sin(player.wobbleAngle + i * 1.5) * 3;
        if (player.mode === 'M1' && i % 2 === 0) wobble += 6;

        const r = player.radius + wobble;
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;

        if (i === 0) ctx.moveTo(px, py);
        else ctx.quadraticCurveTo(0, 0, px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Eye & Face Reactions
      const ex = Math.cos(player.aimAngle) * 5;
      const ey = Math.sin(player.aimAngle) * 5;

      ctx.fillStyle = '#5a4a42';
      
      if (player.hp < 30) {
        // Hurt Face (😵)
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('😵', 0, 5);
      } else if (player.mode === 'M1') {
        // Angry Attack Face (⚔️)
        ctx.beginPath();
        ctx.arc(-6 + ex, -3 + ey, 3, 0, Math.PI * 2);
        ctx.arc(6 + ex, -3 + ey, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ex, 5 + ey, 4, Math.PI, 0);
        ctx.stroke();
      } else {
        // Happy Face (😊)
        ctx.beginPath();
        ctx.arc(-6 + ex, -3 + ey, 3, 0, Math.PI * 2);
        ctx.arc(6 + ex, -3 + ey, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ex, 2 + ey, 4, 0, Math.PI);
        ctx.stroke();
      }

      ctx.restore();
    }

    function updateHUD() {
      document.getElementById('hp-bar').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
      document.getElementById('atp-count').innerText = player.atp;
      document.getElementById('fullness-bar').style.width = player.fullness + '%';

      // Belly Icon reaction
      const bellyIcon = document.getElementById('belly-icon');
      if (player.fullness > 80) bellyIcon.innerText = '🤰';
      else if (player.fullness > 40) bellyIcon.innerText = '🥐';
      else bellyIcon.innerText = '🫙';

      // Antigen Stamps (🧫)
      const stampsContainer = document.getElementById('antigen-stamps');
      stampsContainer.innerHTML = '';
      for (let i = 0; i < player.maxAntigens; i++) {
        const dot = document.createElement('span');
        if (i < player.antigens) {
          dot.className = 'w-2 h-2 rounded-full bg-amber-400 border border-[#5a4a42]';
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-stone-300 border border-[#5a4a42]';
        }
        stampsContainer.appendChild(dot);
      }

      const cytokineBtn = document.getElementById('cytokine-btn');
      if (player.antigens >= player.maxAntigens) {
        cytokineBtn.disabled = false;
        cytokineBtn.classList.add('glow-ready', 'bg-amber-300');
      } else {
        cytokineBtn.disabled = true;
        cytokineBtn.classList.remove('glow-ready', 'bg-amber-300');
      }
    }

    function gameLoop() {
      if (!gameRunning) return;
      update();
      render();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function endGame(isClear) {
      gameRunning = false;
      cancelAnimationFrame(animationFrameId);

      const journalScreen = document.getElementById('journal-screen');
      const journalStamp = document.getElementById('journal-stamp');
      const journalContent = document.getElementById('journal-content');

      journalScreen.classList.remove('hidden');

      if (isClear) {
        journalStamp.innerText = '💮';
        journalContent.innerHTML = `
          <div class="flex items-center justify-between"><span>🟡 🧫</span><span>× ${stats.eatenStaph}</span></div>
          <div class="flex items-center justify-between"><span>🧹 🩶</span><span>× ${stats.eatenDust}</span></div>
          <div class="flex items-center justify-between"><span>🩹 ❇️</span><span>× ${stats.repairedInflammation}</span></div>
          <div class="flex items-center justify-between text-amber-700 text-lg border-t border-amber-200 pt-1 mt-1"><span>⭐</span><span>${player.atp}</span></div>
        `;
      } else {
        journalStamp.innerText = '💔';
        journalContent.innerHTML = `
          <div class="flex items-center justify-between"><span>🟡 🧫</span><span>× ${stats.eatenStaph}</span></div>
          <div class="flex items-center justify-between"><span>🩹 ❇️</span><span>× ${stats.repairedInflammation}</span></div>
          <div class="text-xs text-rose-700 mt-2 border-t border-amber-200 pt-1">🩹 🌱 ──> ✨</div>
        `;
      }
    }

    function restartGame() {
      document.getElementById('journal-screen').classList.add('hidden');
      startGame();
    }
  </script>
