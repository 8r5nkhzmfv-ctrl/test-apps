<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コイネー語彙300</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--mut:#6b6b6b;--card:#fff;--line:#ddd6c8;--acc:#7a4b1e;--ok:#2e7d32;--ng:#c62828;--okbg:#e6f4e7;--ngbg:#fdeaea;--soft:#f1ece2}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#ece8e1;--mut:#a09a90;--card:#272521;--line:#3d3a34;--acc:#e0a96d;--ok:#7ccf80;--ng:#ef8a8a;--okbg:#1f3322;--ngbg:#3a2020;--soft:#322f2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,'Hiragino Sans','Noto Sans JP',sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:1.35rem;margin:.2em 0}h1 small{font-size:.8rem;color:var(--mut);font-weight:400}
h2{font-size:1.05rem;margin:1.6em 0 .5em;color:var(--acc)}
.gr{font-family:'Gentium Plus','Cardo','Palatino Linotype','Times New Roman','Noto Serif',serif}
.he{font-family:'Ezra SIL','SBL Hebrew','Noto Serif Hebrew','Times New Roman',serif;font-size:1.2em}
.big{font-size:2.4rem;line-height:1.25;text-align:center;margin:.3em 0 .5em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%;margin:6px 0}
.btn.sub{background:var(--soft);color:var(--fg);border:1px solid var(--line)}
.btn.inl{width:auto;padding:8px 14px;margin:4px 4px 4px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ng{background:var(--ngbg);border-color:var(--ng)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.3rem;color:var(--acc)}.stat span{font-size:.72rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.st{border:1px solid var(--line);border-radius:8px;padding:6px 0;text-align:center;font-size:.78rem;background:var(--card)}
.st.l1{background:#f3e3cf}.st.l2{background:#e8c99f}.st.l3{background:#d9a964}.st.l4{background:#b97a2e;color:#fff}
@media(prefers-color-scheme:dark){.st.l1{background:#3b3226}.st.l2{background:#52412a}.st.l3{background:#7a5a2c}.st.l4{background:#a8742f;color:#fff}}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--acc)}
.det{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.row{margin:4px 0;font-size:.95rem}.row>span:first-child{display:inline-block;min-width:6.5em;color:var(--mut);font-size:.8rem}
.pos{display:inline-block;background:var(--soft);border-radius:6px;padding:0 8px;font-size:.8rem;margin-right:6px}
.fb{padding:8px 12px;border-radius:8px;font-weight:700;margin-top:8px}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.ng{background:var(--ngbg);color:var(--ng)}
.small{font-size:.8rem;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
select,input[type=text]{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0}summary{cursor:pointer;font-weight:600}
.hide{filter:blur(6px);cursor:pointer}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.wrap.s{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:0}
.sbody{flex:1}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.sh .btn{width:auto;margin:0;padding:5px 12px;font-size:.85rem}
.compact .card{margin:6px 0;padding:12px}
.compact .opt{padding:9px 12px;margin:6px 0}
.compact .big{margin:.1em 0 .3em}
.dock{position:sticky;bottom:0;margin:8px -16px 0;padding:8px 16px 12px;background:var(--bg);border-top:1px solid var(--line);min-height:70px}
.dock .dd{max-height:26vh;overflow:auto;cursor:pointer;margin-bottom:4px}
.dock .det{margin-top:2px;padding-top:4px;border:0}
.dock .exp{margin-top:4px;padding-top:4px;border:0}
.dock .fb{margin:0 0 4px}
.dock .btn{margin:4px 0 0}
.dock .two{display:flex;gap:8px}.dock .two .btn{flex:1}
/* ===== クイズ画面：ビューポート固定（ページ自体はスクロールしない）===== */
html.lock,html.lock body{height:100%;overflow:hidden;overscroll-behavior:none}
.wrap.s{height:100vh;height:100dvh;max-width:720px;display:flex;flex-direction:column;padding:6px 12px calc(6px + env(safe-area-inset-bottom));overflow:hidden}
.wrap.s .sbody{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column}
.wrap.s .sbody .card{flex:0 1 auto}
.wrap.s .sh{flex:0 0 auto;margin-bottom:0}
.wrap.s .bar{margin:4px 0 6px;flex:0 0 auto}
.wrap.s .compact .card{margin:4px 0;padding:10px 12px}
.wrap.s .compact .opt{padding:clamp(6px,1.6dvh,10px) 12px;margin:clamp(4px,.9dvh,6px) 0;font-size:clamp(.9rem,2.4dvh,1.05rem);line-height:1.35}
.wrap.s .compact .opt.gr{font-size:clamp(1.05rem,3dvh,1.3rem)!important}
.wrap.s .compact .big{font-size:clamp(1.5rem,6dvh,2.3rem);margin:0 0 .15em;line-height:1.2}
.wrap.s .compact .q{font-size:clamp(.95rem,2.5dvh,1.1rem);margin:.1em 0 .3em;line-height:1.5}
.wrap.s .compact .q .gr{font-size:1.2em}
.wrap.s .dock{flex:0 0 auto;position:static;margin:6px 0 0;padding:6px 0 0;background:var(--bg);border-top:1px solid var(--line);min-height:0;max-height:46dvh;display:flex;flex-direction:column}
.wrap.s .dock .dd{flex:1 1 auto;min-height:0;overflow:auto;margin:0 0 4px}
.wrap.s .dock .fb,.wrap.s .dock .btn,.wrap.s .dock .two{flex:0 0 auto}
.wrap.s .dock .btn{padding:clamp(8px,1.8dvh,12px) 16px;margin:2px 0 0}
.wrap.s .dock .det>.gr{font-size:1.2rem!important}
.wrap.s .dock .det{line-height:1.45}
.wrap.s .dock .row{margin:1px 0;font-size:.84rem}
.wrap.s .dock .row>span:first-child{min-width:5.5em}
.wrap.s .dock .exp{font-size:.84rem;line-height:1.45}
.wrap.s .dock table.pt{margin:2px 0}
.wrap.s .dock table.pt td,.wrap.s .dock table.pt th{font-size:.9rem;padding:2px 5px}
.wrap.s .dock .small{font-size:.74rem}
.wrap.s .dock{max-height:58dvh}
.wrap.s .dock .det>.gr{display:none!important}
.wrap.s .dock .row>span:first-child{min-width:6.4em}
.wrap.s .dock .det .pos{font-size:.75rem}
.wrap.s .dock table.pt td,.wrap.s .dock table.pt th{font-size:.85rem;padding:1px 4px;line-height:1.35}
.wrap.s .compact .card>div[style*="text-align:center"] .btn.inl{padding:2px 12px;font-size:.82rem;margin:0 0 2px}
.wrap.s .compact .card .small{line-height:1.3}
@media (max-height:700px){
.wrap.s .dock .exp>.small{display:none}
.wrap.s .dock table.pt td,.wrap.s .dock table.pt th{padding:0 4px;font-size:.8rem;line-height:1.3}
.wrap.s .dock .fb{padding:4px 10px;margin-bottom:2px}
.wrap.s .compact .card{padding:8px 10px}
.wrap.s .bar{margin:3px 0 4px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// [ギリシャ語, 品詞, 意味, 語根・覚え方, ヘブル語|読み, 予備]
const W=[
["ὁ, ἡ, τό","冠","その（定冠詞）","性・数・格で形が変わる。名詞の格のヒントになる最重要語。名詞は冠詞つきで覚える（性が分かる）","",""],
["καί","接","そして／〜も／さえ","ヘブル語の ו と同様に、文を数珠つなぎにする。文頭にも多い","וְ|ヴェ-",""],
["αὐτός, -ή, -ό","代","彼・彼女・それ／同じ／〜自身","英:autograph（自筆）。冠詞+αὐτός＝「同じ」、αὐτός+冠詞+名詞＝「〜自身」","",""],
["σύ","代","あなた（単数）","複数は ὑμεῖς","אַתָּה|アッター",""],
["δέ","接","しかし／そして（弱い接続・後置）","文の2番目に置かれる（後置詞）。ἀλλά より弱い対比","",""],
["ἐν","前","〜の中に・〜で（与格支配）","英:energy（ἐν+ἔργον）。ヘブル語 בְּ と対応しやすい","בְּ|ベ-",""],
["εἰμί","動","〜である／いる・ある","不規則。補語は主格。「ἐγώ εἰμι」は出3:14のLXXとの関連がしばしば指摘される","",""],
["λέγω","動","言う","英:-logy（語る学）。過去形は εἶπον など別語幹（不規則）","אָמַר|アーマル",""],
["οὐ, οὐκ, οὐχ","小","〜ない（直説法の否定）","母音の前で οὐκ、気息記号つき母音の前で οὐχ","לֹא|ロー",""],
["ὅς, ἥ, ὅ","代","〜するところの（関係代名詞）","性・数は先行詞に一致、格は関係節内の役割で決まる","",""],

["ἐγώ","代","私","複数は ἡμεῖς。ヨハネ福音書では強調の「ἐγώ εἰμι」が頻出","אֲנִי|アニー",""],
["εἰς","前","〜の中へ（対格支配）","ἐν（中に・静止）と対。動き＝εἰς+対格","לְ／אֶל|レ-／エル",""],
["ὅτι","接","〜ということ／なぜなら／「」（引用）","3用法：内容・理由・引用符","כִּי|キー",""],
["οὗτος, αὕτη, τοῦτο","代","これ・この","近称。遠称は ἐκεῖνος","זֶה|ゼー",""],
["μή","小","〜ない（非直説法の否定）","命令・接続法・分詞・不定詞の否定。οὐ μή＝決して〜ない","אַל|アル",""],
["θεός","名","神","英:theology。LXXで אֱלֹהִים の訳語","אֱלֹהִים|エローヒーム",""],
["πᾶς, πᾶσα, πᾶν","形","すべての／あらゆる","英:pan-（汎）。語幹 παντ-（属格 παντός）","כֹּל|コル",""],
["ἐκ, ἐξ","前","〜から外へ（属格支配）","母音の前で ἐξ。複合動詞の接頭辞 ἐκ-（外へ）","מִן|ミン",""],
["ἔχω","動","持つ","未完了 εἶχον、未来 ἕξω","",""],
["Ἰησοῦς","固","イエス","ヘブル語 יהושע／ישוע「主は救い」のギリシャ語形","יֵשׁוּעַ|イェシュア",""],

["γίνομαι","動","なる／生じる／起こる","英:genesis。デポネント。ἐγένετο（アオリスト）は頻出。同根:γένος, γεννάω","הָיָה|ハーヤー",""],
["ἐπί","前","〜の上に（属・与・対で意味が変わる）","対格＝〜の上へ／与格＝〜の上に／属格＝〜の上で","עַל|アル",""],
["πρός","前","〜へ・〜のもとに（対格）","ヨハネ1:1「πρὸς τὸν θεόν」＝神に向かって（関係・交わりのニュアンスと解される）","אֶל|エル",""],
["ἀπό","前","〜から（属格支配）","接頭辞 ἀπό-（離れて）。英:apostle（ἀπό+στέλλω）","מִן|ミン",""],
["ἀλλά","接","しかし（強い対比）","δέ より強い。ἀλλ' と省略","",""],
["διά","前","〔属〕〜を通して／〔対〕〜のゆえに","英:dia-（貫く）。属格＝経由、対格＝理由","",""],
["κύριος","名","主","LXXで יהוה／אֲדֹנָי の訳語。呼格 κύριε","יְהוָה／אֲדֹנָי|ヤハウェ／アドナイ",""],
["ἔρχομαι","動","来る／行く","デポネント。複合: εἰσ-, ἐξ-, ἀπ-, προσ-ἔρχομαι。アオリスト ἦλθον","בָּא|バー",""],
["κατά","前","〔属〕〜に反して／〔対〕〜に従って・〜ごとに","接頭辞 κατά-（下へ）。英:catastrophe","",""],
["ἵνα","接","〜するために／〜ように（+接続法）","目的・内容を導く。接続法とセット","לְמַעַן|レマアン",""],

["ἄνθρωπος","名","人・人間","英:anthropology。第2変化（-ος）","אָדָם|アーダーム",""],
["τις, τι","代","ある人・あるもの","アクセントなし＝不定。直前の語に寄りかかる","",""],
["τίς, τί","代","だれ？何？（疑問）","アクセントあり（鋭アクセント）＝疑問。τίς εἶ;「あなたはだれか」","",""],
["ἤ","接","または／〜より","比較：「AよりB」","אוֹ|オー",""],
["οὖν","接","それで／だから（後置）","ヨハネ福音書で非常に多い物語の接続語。第2位置","",""],
["ἐάν","接","もし〜なら（+接続法）","ἐάν＝εἰ+ἄν。接続法とセット","אִם|イム",""],
["ποιέω","動","する／作る","英:poem・poetry（作られたもの）","עָשָׂה|アーサー",""],
["ἐκεῖνος","代","あれ・あの・その人","遠称。οὗτος（近称）と対","הַהוּא|ハフー",""],
["περί","前","〔属〕〜について／〔対〕〜の周りに","英:perimeter（周囲）・period。接頭辞 περι-（周り）","עַל|アル",""],
["μετά","前","〔属〕〜と共に／〔対〕〜の後に","英:meta-・method（μετά+ὁδός＝道に沿って）","עִם|イム",""],

["υἱός","名","息子","ヨハネ文書で「子」＝キリストと父の関係を表す語","בֵּן|ベーン",""],
["ὑπό","前","〔属〕〜によって（動作主）／〔対〕〜の下に","英:hypo-（下）・hypothesis。受動態の動作主","",""],
["πατήρ","名","父","英:paternal・patriarch。第3変化（語幹 πατρ-）","אָב|アーヴ",""],
["χριστός","名","油注がれた者・キリスト","χρίω（油を塗る）+-τος（〜された）。ヘブル語 מָשִׁיחַ（メシア）の訳","מָשִׁיחַ|マーシーアハ",""],
["πνεῦμα","名","霊／風／息","英:pneumatic・pneumonia。ヘブル語 רוּחַ と同じく「風・息・霊」を兼ねる","רוּחַ|ルーアハ",""],
["ἀδελφός","名","兄弟","ἀ-（共に）+δελφύς（胎）＝同じ胎の者。英:Philadelphia（兄弟愛）","אָח|アーハ",""],
["ὁράω","動","見る","英:panorama。不規則:未完了 ἑώρων、アオリスト εἶδον、完了 ἑώρακα","רָאָה|ラーア",""],
["οὐδείς, οὐδεμία, οὐδέν","形","だれも〜ない／何も〜ない","οὐδέ（〜さえ〜ない）+εἷς（一つ）＝一つもない","",""],
["λαλέω","動","話す","λέγω が内容を言う、λαλέω は話す行為そのもの（傾向）","דִּבֵּר|ディッベル",""],
["ἀκούω","動","聞く","英:acoustic。対象：音源＝属格／内容＝対格（傾向）。申6:4 שְׁמַע＝ἄκουε","שָׁמַע|シャーマ",""],

["ἡμεῖς","代","私たち","属格 ἡμῶν・与格 ἡμῖν・対格 ἡμᾶς","אֲנַחְנוּ|アナフヌー",""],
["ὑμεῖς","代","あなたがた","単数 σύ に対する複数","אַתֶּם|アテム",""],
["λαμβάνω","動","受け取る／つかむ","アオリスト ἔλαβον。複合: παρα-／κατα-λαμβάνω","לָקַח|ラーカハ",""],
["εἰ","接","もし〜なら（直説法）／〜かどうか","ἐάν（接続法）との違いは文法アプリで","אִם|イム",""],
["ἀποκρίνομαι","動","答える","ἀπό（返して）+κρίνω（判断する）＝判断を返す。ヨハネで頻出","עָנָה|アーナー",""],
["οἶδα","動","知っている","完了形の形で現在の意味。ὁράω（見る）と同根＝「見て知っている」。英:idea","יָדַע|ヤーダ",""],
["ἡμέρα","名","日","第1変化（-α型）。対格 ἡμέραν","יוֹם|ヨーム",""],
["λόγος","名","ことば／道理","英:logic・-logy。λέγω と同根","דָּבָר|ダーヴァール",""],
["ὄνομα","名","名","第3変化（-μα型）。属格 ὀνόματος。英:onomatopoeia","שֵׁם|シェーム",""],
["ἀγαπάω","動","愛する","ἀγάπη（愛）の動詞。ヨハネでは φιλέω と近い意味で併用される","אָהַב|アーハヴ",""],

["πιστεύω","動","信じる","πίστις（信）+-εύω（動詞化）。ヘブル語は אמן 語根（אָמֵן・אֱמוּנָה・הֶאֱמִין）","הֶאֱמִין|ヘエミーン",""],
["δίδωμι","動","与える","英:dose。アオリスト ἔδωκα。複合: παρα-・ἀπο-δίδωμι","נָתַן|ナータン",""],
["γυνή","名","女／妻","英:gynecology。属格 γυναικός（語幹 γυναικ-）","אִשָּׁה|イッシャー",""],
["ἀνήρ","名","男／夫","英:android。属格 ἀνδρός（語幹 ἀνδρ-）","אִישׁ|イーシュ",""],
["τέκνον","名","子","τίκτω（産む）に由来。「生まれた子」の面が強い","",""],
["ἀρχή","名","初め／支配","英:monarch・architect。創1:1 LXX ἐν ἀρχῇ＝ヨハネ1:1と同じ句","רֵאשִׁית|レーシート",""],
["ζωή","名","いのち","ζάω（生きる）と同根。ヨハネ福音書の中心語。英:zoo","חַיִּים|ハイイーム",""],
["κόσμος","名","世・世界／秩序","英:cosmos・cosmetic（整える）。ヨハネでは「神に背く世」の意味も","",""],
["φῶς","名","光","英:photo。属格 φωτός（語幹 φωτ-）。φαίνω（輝く）と同根","אוֹר|オール",""],
["ἔργον","名","業・働き","英:energy・ergonomics。第2変化中性","מַעֲשֶׂה|マアセー",""],

["βασιλεία","名","王国・支配","βασιλεύς（王）の抽象名詞（-εία）","מַלְכוּת|マルフート",""],
["βασιλεύς","名","王","第3変化。属格 βασιλέως","מֶלֶךְ|メレフ",""],
["ἐξουσία","名","権威・権能","ヨハネ1:12「神の子となる権威」","",""],
["ἁμαρτία","名","罪","ἁμαρτάνω（的を外す）。ヘブル語 חַטָּאת も「的を外す」が原義","חַטָּאת|ハッタート",""],
["ἀλήθεια","名","真理・真実","ἀ-（否定）+λήθη（忘却）＝覆われていないもの（語源的説明）。ヘブル語 אֱמֶת の訳語として機能","אֱמֶת|エメト",""],

function setPM(v){PM=v;try{localStorage.setItem('koine_pm',v)}catch(e){}}
const VW={'α':'a','ε':'e','η':'e','ι':'i','ο':'o','υ':'u','ω':'o'};
const CS={'β':'b','δ':'d','θ':'t','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'ks','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','φ':'f','χ':'j','ψ':'ps'};
const ACU={a:'á',e:'é',i:'í',o:'ó',u:'ú'};
function phon(t,mode){
 const kn=mode==='koine';
 const s=String(t).split(/[,，、／（(]/)[0].toLowerCase().normalize('NFD');
 const tk=[];
 for(const ch of s){const cp=ch.codePointAt(0);
  if(cp>=0x300&&cp<=0x36f){const l=tk[tk.length-1];if(!l||!l.g)continue;if(cp===0x301||cp===0x300||cp===0x342)l.acc=true;else if(cp===0x308)l.dia=true;continue}
  if(cp>=0x3b1&&cp<=0x3c9)tk.push({c:ch,g:1,acc:false,dia:false});else tk.push({c:' ',g:0})}
 const voiced=n=>!n||!n.g?false:('αεηιουωβγδζλμνρ'.includes(n.c));
 const out=[];
 const acc=(str,on)=>on?ACU[str[0]]?ACU[str[0]]+str.slice(1):str:str;
 for(let i=0;i<tk.length;i++){
  const x=tk[i],n=tk[i+1],a=x.c;
  if(!x.g){out.push(' ');continue}
  if(n&&n.g&&!n.dia&&'αεηουω'.includes(a)||n&&n.g&&!n.dia&&a==='υ'){
   const pr=a+n.c;let r=null;
   if(pr==='αι')r=kn?'e':'ai';else if(pr==='ει')r=kn?'i':'ei';else if(pr==='οι')r=kn?'i':'oi';else if(pr==='υι')r=kn?'i':'ui';else if(pr==='ου')r='u';
   else if(pr==='αυ')r=kn?('a'+(voiced(tk[i+2])?'v':'f')):'au';
   else if(pr==='ευ')r=kn?('e'+(voiced(tk[i+2])?'v':'f')):'eu';
   else if(pr==='ηυ')r=kn?('i'+(voiced(tk[i+2])?'v':'f')):'eu';
   if(r!==null){out.push(acc(r,x.acc||n.acc));i++;continue}}
  if(VW[a]){let v=VW[a];if(kn){if(a==='η'||a==='υ')v='i'}
   v=acc(v,x.acc);out.push((x.dia?'h':'')+v);continue}
  if(a==='γ'){out.push(n&&n.g&&'γκξχ'.includes(n.c)?'n':'g');continue}
  if(a==='ζ'){out.push(kn?'s':'ds');continue}
  if(a==='λ'&&n&&n.c==='λ'){out.push('l');i++;continue}
  out.push(CS[a]||'')}
 return out.join('').replace(/g(?=[eiéí])/g,'gu').replace(/\s+/g,' ').trim()}
function ttsText(t){t=String(t).split(/[,，、／（(]/)[0].normalize('NFD').replace(/[̓̔ͅ]/g,'').replace(/[̀͂]/g,'́').normalize('NFC');return t.replace(/[^Ͱ-Ͽἀ-῿\s]/g,'').trim()}
function pickVoice(pref){try{const vs=speechSynthesis.getVoices();for(const p of pref){const v=vs.find(v=>v.lang.replace('_','-').toLowerCase().startsWith(p));if(v)return v}}catch(e){}return null}
function say(t){if(!TTS)return false;try{
 let text,lang,pref;
 if(PM==='modern'){text=ttsText(t);lang='el-GR';pref=['el']}
 else{text=phon(t,PM);lang='es-ES';pref=['es-es','es-mx','es-us','es']}
 if(!text)return false;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.8;const v=pickVoice(pref);if(v)u.voice=v;speechSynthesis.speak(u);return true}catch(e){return false}}

function sv(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(CK,JSON.stringify(C))}catch(e){canSave=false}}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const get=i=>S[i]||{b:-1,d:0,c:0,w:0};
const NST=Math.ceil(W.length/10);
const stIds=n=>{const r=[];for(let i=n*10;i<Math.min(W.length,n*10+10);i++)r.push(i);return r};
const ALL=W.map((_,i)=>i);
function grade(i,ok){const s=S[i]||(S[i]={b:-1,d:0,c:0,w:0});if(s.b<0)s.b=0;if(ok){s.c++;s.b=Math.min(5,s.b+1)}else{s.w++;s.b=0}s.d=Date.now()+INT[s.b]*864e5;sv()}
function dueIds(){const n=Date.now();return ALL.filter(i=>{const s=get(i);return s.b>=0&&s.d<=n}).sort((a,b)=>get(a).d-get(b).d)}
function newIds(){return ALL.filter(i=>get(i).b<0)}
function hebH(h){if(!h)return'';const p=h.split('|');return `<bdi class="he" dir="rtl" lang="he">${p[0]}</bdi>${p[1]?'（'+p[1]+'）':''}`}
function detail(i){const w=W[i];return `<div class="det"><div class="gr" style="font-size:1.6rem">${w[0]}</div><div><span class="pos">${w[1]}</span><b>${esc(w[2])}</b></div>${w[3]?`<div class="row"><span>語根・覚え方</span>${esc(w[3])}</div>`:''}${w[4]?`<div class="row"><span>ヘブル語</span>${hebH(w[4])}</div>`:''}</div>`}
function bar(p){return `<div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>`}
function nav(){return `<div class="nav"><button class="btn sub inl" data-a="home">ホーム</button><button class="btn sub inl" data-a="list">一覧</button><button class="btn sub inl" data-a="px">接頭辞・語根</button></div>`}

function home(){
 const n=Date.now(),seen=ALL.filter(i=>get(i).b>=0).length,mast=ALL.filter(i=>get(i).b>=3).length,due=dueIds().length;
 const nn=Math.min(C.nw,newIds().length);
 let g='';for(let k=0;k<NST;k++){const ids=stIds(k),m=ids.filter(i=>get(i).b>=3).length,s=ids.filter(i=>get(i).b>=0).length,f=m/ids.length;
  const cl=f>=1?'l4':f>=.67?'l3':f>=.34?'l2':s>0?'l1':'';
  g+=`<button class="st ${cl}" data-a="stage" data-n="${k}">${k+1}<br><span class="small" style="color:inherit">${m}/${ids.length}</span></button>`}
 const weak=ALL.filter(i=>{const s=get(i);return s.b>=0&&(s.b<=1&&s.w>0)}).length;
 return `<h1>コイネー語彙${W.length}<small> 新約ギリシャ語・ヨハネ福音書への道</small></h1>
 ${canSave?'':'<div class="card small">この環境では進捗が保存されない。ファイルをブラウザで直接開くと保存される。</div>'}
 <div class="stats"><div class="stat"><b>${seen}</b><span>学習済</span></div><div class="stat"><b>${mast}</b><span>定着</span></div><div class="stat"><b>${due}</b><span>復習期限</span></div><div class="stat"><b>${W.length-seen}</b><span>未学習</span></div></div>
 ${bar(mast/W.length)}
 <button class="btn" data-a="today">今日の学習：復習 ${Math.min(due,20)}語 ＋ 新規 ${nn}語</button>
 <h2>ステージ（10語ずつ）</h2><div class="grid">${g}</div>
 <h2>練習セット</h2>
 <button class="btn sub" data-a="setweak">苦手語（${weak}語）</button>
 <button class="btn sub" data-a="setall">全語から20語ランダム</button>
 <h2>設定</h2>
 <div class="card"><div class="row"><span>出題形式</span><select data-c="fmt"><option value="mix"${C.fmt==='mix'?' selected':''}>混合（習熟で変化）</option><option value="g2j"${C.fmt==='g2j'?' selected':''}>ギ→日 4択</option><option value="j2g"${C.fmt==='j2g'?' selected':''}>日→ギ 4択</option><option value="flip"${C.fmt==='flip'?' selected':''}>思い出しカード</option></select></div>
 <div class="row"><span>新規語/日</span><select data-c="nw">${[3,5,10,15].map(v=>`<option${C.nw==v?' selected':''}>${v}</option>`).join('')}</select></div>
 <div class="row"><span>音声</span><label><input type="checkbox" data-c="snd"${C.snd?' checked':''}> 単語表示時に自動再生</label> <button class="btn sub inl" data-a="saytest">🔊 テスト</button><div class="row"><span>発音方式</span>${pmSelect()}</div><div class="small">${esc(voiceNote())}教育式・復元式は、音訳をスペイン語音声で読む近似。母音の長短・気息は再現しない。</div></div>
 </div>
 <details><summary>定着のしくみ・使い方</summary>
 <p><b>1) 想起が記憶を作る。</b>「答えを見る前に口に出す」。見て分かるだけでは定着しない。</p>
 <p><b>2) 間隔反復（ライトナー式）。</b>正解で箱が上がる（1→3→7→14→30日後に再出題）。間違えると最初に戻り、同じ回の中で正解するまで再出題する。</p>
 <p><b>3) 難度が上がる（混合）。</b>初見＝ギ→日、次＝日→ギ、慣れたら思い出しカード（自己採点）。</p>
 <p><b>4) 分解して覚える。</b>ἐκ-βάλλω＝外へ＋投げる。接頭辞は約16個。「接頭辞・語根」タブで訓練。</p>
 <p><b>5) 目安。</b>新規5語＋復習。毎日10分。語彙が定着してきたら、逐語でヨハネ1:1から読み始める。</p>
 <p class="small">語の選定は頻出語を中心にした推定。順位・頻度は厳密ではない。ヘブル語は代表的な対応で、文脈で異なる。</p></details>
 <button class="btn sub" data-a="reset">${rs?'もう一度押すと進捗を消去':'進捗をリセット'}</button>`}

function startSession(ids,label){
 if(!ids.length){alert('対象の語がありません');return}
 ids=shuffle(ids.slice());
 const un=ids.filter(i=>get(i).b<0);
 sess={label,ids,queue:ids.slice(),first:{},ok:0,ng:0,intro:un,ii:0,phase:un.length?'intro':'quiz',cur:null,ans:false,miss:[],pick:-1};
 if(sess.phase==='quiz')nextQ();
 V={n:'sess'};draw();
}
function fmtFor(i){const f=C.fmt;if(f!=='mix')return f;const b=get(i).b;if(b<=0)return'g2j';if(b<=2)return Math.random()<.5?'g2j':'j2g';return'flip'}
function opts(i){const pool=ALL.filter(j=>j!==i&&W[j][1]===W[i][1]&&W[j][2]!==W[i][2]);let p=shuffle(pool).slice(0,3);if(p.length<3)p=p.concat(shuffle(ALL.filter(j=>j!==i&&!p.includes(j))).slice(0,3-p.length));return shuffle([i].concat(p))}
function nextQ(){if(!sess.queue.length){sess.phase='done';sess.cur=null;return}
 const i=sess.queue.shift(),f=fmtFor(i);sess.cur={i,f,o:f==='flip'?[]:opts(i),shown:false};sess.ans=false;sess.pick=-1}
function result(i,ok){if(!(i in sess.first)){sess.first[i]=ok;grade(i,ok);if(ok)sess.ok++;else{sess.ng++;sess.miss.push(i)}}
 if(!ok)sess.queue.splice(Math.min(sess.queue.length,3),0,i)}
function sessH(){
 if(sess.phase==='intro'){const i=sess.intro[sess.ii];return `<div class="sbody compact"><div class="sh"><button class="btn sub" data-a="home">ホーム</button><span class="small">新出語 ${sess.ii+1}/${sess.intro.length}（${esc(sess.label)}）</span></div>${bar(sess.ii/sess.intro.length)}<div class="card"><div class="big gr">${W[i][0]}</div><div style="text-align:center"><button class="btn sub inl" data-a="say" data-i="${i}">🔊 発音</button></div>${detail(i).replace('class="det"','class="det" style="border:0;margin:0;padding:0"').replace(/<div class="gr"[^>]*>.*?<\/div>/,'')}<p class="small">声に出す → 意味 → 語根を分解 → 次へ。この後テストで想起する。</p></div></div><div class="dock"><button class="btn" data-a="intronext">次へ（Enter）</button></div>`}
 if(sess.phase==='done'){const t=sess.ok+sess.ng,r=t?Math.round(100*sess.ok/t):0;
  return `${nav()}<h2>結果（${esc(sess.label)}）</h2><div class="card"><div class="big">${sess.ok}/${t}　${r}%</div><div class="small" style="text-align:center">初回正解の割合。間違いは正解するまで再出題済み。</div></div>${sess.miss.length?`<h2>間違えた語</h2>${sess.miss.map(i=>`<div class="card">${detail(i)}</div>`).join('')}`:''}<button class="btn" data-a="home">ホームへ</button>`}
 const q=sess.cur,w=W[q.i],rem=new Set(sess.queue.concat([q.i])).size,done=sess.ids.length-rem;
 const head=`<div class="sh"><button class="btn sub" data-a="home">ホーム</button><span class="small">${esc(sess.label)}　残り${rem}語　○${sess.ok} ×${sess.ng}</span></div>${bar(done/sess.ids.length)}`;
 let body='',dock='';
 if(q.f==='flip'){body=`<div class="big gr">${w[0]}</div><div style="text-align:center"><button class="btn sub inl" data-a="say" data-i="${q.i}">🔊 発音</button></div><div class="small" style="text-align:center">意味を口に出してから答えを見る</div>`;
  dock=q.shown?`<div class="dd">${detail(q.i)}</div><div class="two"><button class="btn" style="background:var(--ok)" data-a="flipok">言えた（1）</button><button class="btn" style="background:var(--ng)" data-a="flipng">言えなかった（2）</button></div>`:`<button class="btn" data-a="flipshow">答えを見る（Space）</button>`}
 else{const g2j=q.f==='g2j';body=(g2j?`<div class="big gr">${w[0]}</div><div style="text-align:center"><button class="btn sub inl" data-a="say" data-i="${q.i}">🔊 発音</button></div><div class="small" style="text-align:center">${w[1]}・意味は？</div>`:`<div class="big" style="font-size:1.5rem">${esc(w[2])}<div class="small">${w[1]}・ギリシャ語は？</div></div>`)+
  q.o.map((j,k)=>{let c='opt';if(sess.ans){if(j===q.i)c+=' ok';else if(k===sess.pick)c+=' ng'}return `<button class="${c} ${g2j?'':'gr'}" ${g2j?'':'style="font-size:1.3rem"'} data-a="pick" data-k="${k}">${k+1}. ${g2j?esc(W[j][2]):W[j][0]}</button>`}).join('');
  if(sess.ans){const ok=q.o[sess.pick]===q.i;dock=`<div class="fb ${ok?'ok':'ng'}">${ok?'正解':'不正解'}<button class="btn sub inl" style="float:right;margin:0;padding:3px 10px" data-a="say" data-i="${q.i}">🔊</button></div><div class="dd">${detail(q.i)}</div><button class="btn" data-a="next">次へ（Enter）</button>`}
  else dock='<div class="small" style="text-align:center">1〜4キーで回答／Sキーで発音</div>'}
 return `<div class="sbody compact">${head}<div class="card">${body}</div></div><div class="dock">${dock}</div>`}

function listH(){
 const f=V.f==null?-1:V.f;const ids=f<0?ALL:stIds(f);const q=(V.q||'').trim();
 const rows=ids.filter(i=>!q||W[i].slice(0,4).join(' ').includes(q)).map(i=>{const w=W[i],h=hideMean&&!reveal[i];return `<tr><td class="gr" style="font-size:1.15rem"><button class="btn sub inl" style="padding:2px 8px;margin:0 6px 0 0" data-a="say" data-i="${i}">🔊</button>${w[0]}</td><td>${w[1]}</td><td class="${h?'hide':''}" data-a="rev" data-i="${i}">${esc(w[2])}<div class="small">${esc(w[3])}</div></td><td>${hebH(w[4])}</td></tr>`}).join('');
 return `${nav()}<h2>語彙一覧（自己テスト）</h2><div class="card"><select data-c="lf"><option value="-1">全体</option>${Array.from({length:NST},(_,k)=>`<option value="${k}"${f===k?' selected':''}>ステージ${k+1}</option>`).join('')}</select> <input type="text" placeholder="検索" value="${esc(q)}" data-c="lq"> <label><input type="checkbox" data-c="hm"${hideMean?' checked':''}> 意味を隠す（タップで表示）</label></div><table><tr><th>ギリシャ語</th><th>品</th><th>意味・語根</th><th>ヘブル語</th></tr>${rows}</table>`}

function pxH(){
 if(PT){if(PT.done){return `${nav()}<h2>結果</h2><div class="card"><div class="big">${PT.ok}/${PT.n}</div></div><button class="btn" data-a="ptstart">もう一度</button>`}
  const q=PT.cur,ok=PT.ans&&q.o[PT.pick]===q.a;
  const ex=q.t==='c'?`<span class="gr" style="font-size:1.2rem">${q.x[0]}</span>＝${esc(q.x[1])}＋${esc(q.x[2])}＝<b>${esc(q.x[3])}</b>`:`${q.x[0]}＝<b>${q.x[1]}</b>　例: ${q.x[2]}`;
  return `<div class="sbody compact"><div class="sh"><button class="btn sub" data-a="home">ホーム</button><span class="small">${PT.i+1}/${PT.n}　接頭辞トレーニング</span></div>${bar(PT.i/PT.n)}<div class="card"><div class="small">${q.t==='c'?'分解から意味を推測':'接頭辞の意味'}</div>${q.t==='c'?`<div class="big gr" style="font-size:1.8rem">${q.x[1]} ＋ ${q.x[2]}</div>`:`<div class="big gr">${q.x[0]}</div>`}${q.o.map((o,k)=>{let c='opt';if(PT.ans){if(o===q.a)c+=' ok';else if(k===PT.pick)c+=' ng'}return `<button class="${c}" data-a="ptpick" data-k="${k}">${k+1}. ${esc(o)}</button>`}).join('')}</div></div><div class="dock">${PT.ans?`<div class="fb ${ok?'ok':'ng'}">${ok?'正解':'不正解'}</div><div class="dd"><div class="row">${ex}</div></div><button class="btn" data-a="ptnext">次へ（Enter）</button>`:'<div class="small" style="text-align:center">1〜4キーで回答／Sキーで発音</div>'}</div>`}
 return `${nav()}<h2>接頭辞（前置詞由来）</h2><table><tr><th>接頭辞</th><th>基本義</th><th>例</th></tr>${PF.map(r=>`<tr><td class="gr">${r[0]}</td><td>${r[1]}</td><td class="gr">${r[2]}</td></tr>`).join('')}</table>
 <div class="card"><b>音の変化（規則）</b><br>・母音の前で語末母音が落ちる：ἀπό＋ἔρχομαι→ἀπέρχομαι<br>・ἐκ→ἐξ（母音の前）：ἐξέρχομαι<br>・ν→μ（唇音の前）：σύν＋φέρω→συμφέρω<br>・過去形の augment は接頭辞の後ろ（語幹の前）：ἐκ＋ἔβαλον→ἐξέβαλον</div>
 <h2>語根ファミリー</h2><div class="card">βαίνω（歩む）：ἀνα-/κατα-/μετα-βαίνω<br>ἔρχομαι（来る）：εἰσ-/ἐξ-/προσ-/συν-/δι-έρχομαι<br>βάλλω（投げる）：ἐκ-/περι-βάλλω<br>λαμβάνω（受け取る）：κατα-/παρα-λαμβάνω<br>καλέω（呼ぶ）：παρα-/ἐκ-καλέω<br>γίνομαι／γένος：γεννάω, μονογενής, γενεά<br>φῶς／φαίνω／φανερόω：光・現れる<br>ζάω／ζωή：生きる・いのち<br>κρίνω／κρίσις／ἀποκρίνομαι：判断・裁き・答え</div>
 <button class="btn" data-a="ptstart">接頭辞トレーニング（10問）</button>`}
function ptq(){const t=Math.random()<.7?'c':'p';if(t==='c'){const x=PX[Math.floor(Math.random()*PX.length)];const o=shuffle([x[3]].concat(shuffle(PX.filter(y=>y[3]!==x[3])).slice(0,3).map(y=>y[3])));return{t,x,a:x[3],o}}
 const x=PF[Math.floor(Math.random()*PF.length)];const o=shuffle([x[1]].concat(shuffle(PF.filter(y=>y[1]!==x[1])).slice(0,3).map(y=>y[1])));return{t,x,a:x[1],o}}

function draw(){let h='';if(V.n==='home')h=home();else if(V.n==='sess')h=sessH();else if(V.n==='list')h=listH();else if(V.n==='px')h=pxH();
 const lk=((V.n==='sess'&&sess&&sess.phase!=='done')||(V.n==='px'&&PT&&!PT.done));$app.className='wrap'+(lk?' s':'');if(document.documentElement)document.documentElement.classList.toggle('lock',lk);
 const y=window.scrollY;$app.innerHTML=h;if(V.n==='list')window.scrollTo(0,y);autoSay()}
function autoSay(){if(!C.snd||V.n!=='sess'||!sess)return;let key=null,i=null;
 if(sess.phase==='intro'){key='i'+sess.ii+'|'+sess.intro[sess.ii];i=sess.intro[sess.ii]}
 else if(sess.phase==='quiz'&&sess.cur){const q=sess.cur;if(q.f==='j2g'){if(sess.ans){key=q;i=q.i}}else{key=q;i=q.i}}
 if(key===null||key===lastSay)return;lastSay=key;say(W[i][0])}
function pick(k){if(sess.ans)return;const q=sess.cur;sess.pick=k;sess.ans=true;const ok=q.o[k]===q.i;result(q.i,ok);draw()}
function nxt(){if(sess.phase==='intro'){sess.ii++;if(sess.ii>=sess.intro.length){sess.phase='quiz';nextQ()}draw();return}
 nextQ();draw();window.scrollTo(0,0)}
function ptpick(k){if(PT.ans)return;PT.pick=k;PT.ans=true;const ok=PT.cur.o[k]===PT.cur.a;if(ok)PT.ok++;draw()}
function ptn(){PT.i++;if(PT.i>=PT.n)PT.done=true;else{PT.cur=ptq();PT.ans=false;PT.pick=-1}draw();window.scrollTo(0,0)}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a!=='reset')rs=false;
 switch(a){
 case'home':V={n:'home'};sess=null;PT=null;draw();break;
 case'list':V={n:'list'};draw();break;
 case'px':V={n:'px'};PT=null;draw();break;
 case'today':{const d=dueIds().slice(0,20),n=newIds().slice(0,C.nw);startSession(d.concat(n),'今日の学習');break}
 case'stage':startSession(stIds(+t.dataset.n),'ステージ'+(+t.dataset.n+1));break;
 case'setweak':startSession(ALL.filter(i=>{const s=get(i);return s.b>=0&&s.b<=1&&s.w>0}).slice(0,20),'苦手語');break;
 case'setall':startSession(shuffle(ALL.slice()).slice(0,20),'ランダム20語');break;
 case'intronext':nxt();break;
 case'pick':pick(+t.dataset.k);break;
 case'next':nxt();break;
 case'say':say(W[+t.dataset.i][0]);break;
 case'saytest':say('ἐν ἀρχῇ ἦν ὁ λόγος');break;
 case'flipshow':sess.cur.shown=true;draw();break;
 case'flipok':result(sess.cur.i,true);nxt();break;
 case'flipng':result(sess.cur.i,false);nxt();break;
 case'rev':reveal[t.dataset.i]=!reveal[t.dataset.i];draw();break;
 case'reset':if(rs){S={};sv();rs=false}else rs=true;draw();break;
 case'ptstart':PT={n:10,i:0,ok:0,done:false,ans:false,pick:-1,cur:ptq()};draw();break;
 case'ptpick':ptpick(+t.dataset.k);break;
 case'ptnext':ptn();break;
 }});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;
 if(c==='fmt'){C.fmt=e.target.value;sv()}else if(c==='nw'){C.nw=+e.target.value;sv();draw()}else if(c==='snd'){C.snd=e.target.checked;sv()}else if(c==='pm'){setPM(e.target.value)}
 else if(c==='lf'){V.f=+e.target.value;draw()}else if(c==='lq'){V.q=e.target.value;draw()}else if(c==='hm'){hideMean=e.target.checked;draw()}});
document.addEventListener('keydown',e=>{if((e.key==='s'||e.key==='S')&&V.n==='sess'&&sess&&e.target.tagName!=='INPUT'){const i=sess.phase==='intro'?sess.intro[sess.ii]:(sess.cur&&sess.cur.i);if(i!=null)say(W[i][0])}
 if(V.n==='px'&&PT&&!PT.done){if(!PT.ans&&'1234'.includes(e.key)&&e.key){const k=+e.key-1;if(k<PT.cur.o.length)ptpick(k)}else if(PT.ans&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ptn()}return}
 if(V.n!=='sess'||!sess||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 if(sess.phase==='intro'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nxt();return}
 if(sess.phase!=='quiz'||!sess.cur)return;const q=sess.cur;
 if(q.f==='flip'){if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!q.shown){q.shown=true;draw()}}else if(q.shown&&e.key==='1'){result(q.i,true);nxt()}else if(q.shown&&e.key==='2'){result(q.i,false);nxt()}return}
 if(!sess.ans&&'1234'.includes(e.key)&&e.key){const k=+e.key-1;if(k<q.o.length)pick(k)}else if(sess.ans&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nxt()}});
draw();
</script>
</body>
</html>
