<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コイネー文法クイズ</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--mut:#6b6b6b;--card:#fff;--line:#ddd6c8;--acc:#7a4b1e;--ok:#2e7d32;--ng:#c62828;--okbg:#e6f4e7;--ngbg:#fdeaea;--soft:#f1ece2;--hl:#ffe9a8}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#ece8e1;--mut:#a09a90;--card:#272521;--line:#3d3a34;--acc:#e0a96d;--ok:#7ccf80;--ng:#ef8a8a;--okbg:#1f3322;--ngbg:#3a2020;--soft:#322f2a;--hl:#5a4a1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,'Hiragino Sans','Noto Sans JP',sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:1.35rem;margin:.2em 0}h1 small{font-size:.8rem;color:var(--mut);font-weight:400}
h2{font-size:1.05rem;margin:1.4em 0 .5em;color:var(--acc)}
.gr{font-family:'Gentium Plus','Cardo','Palatino Linotype','Times New Roman','Noto Serif',serif}
.he{font-family:'Ezra SIL','SBL Hebrew','Noto Serif Hebrew','Times New Roman',serif}
.q{font-size:1.1rem;margin:.2em 0 .6em}.q .gr{font-size:1.35rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%;margin:6px 0}
.btn.sub{background:var(--soft);color:var(--fg);border:1px solid var(--line)}
.btn.inl{width:auto;padding:8px 14px;margin:4px 4px 4px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt.gr{font-size:1.3rem}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ng{background:var(--ngbg);border-color:var(--ng)}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--acc)}
.fb{padding:8px 12px;border-radius:8px;font-weight:700;margin-top:8px}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.ng{background:var(--ngbg);color:var(--ng)}
.small{font-size:.8rem;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:.95rem;margin:8px 0}td,th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}th{background:var(--soft);font-weight:600}
table.pt td{font-size:1.15rem}td.hl{background:var(--hl);font-weight:700}
.unit{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0;flex-wrap:wrap}
.unit b{display:block}.unit .small{display:block}
.pill{font-size:.75rem;background:var(--soft);border-radius:8px;padding:0 8px;color:var(--mut)}
.exp{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:.95rem}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.wrap.s{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:0}
.sbody{flex:1}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.sh .btn{width:auto;margin:0;padding:5px 12px;font-size:.85rem}
.compact .card{margin:6px 0;padding:12px}
.compact .opt{padding:9px 12px;margin:6px 0}
.compact .big{margin:.1em 0 .3em}
.dock{position:sticky;bottom:0;margin:8px -16px 0;padding:8px 16px 12px;background:var(--bg);border-top:1px solid var(--line);min-height:70px}
.dock .dd{max-height:26vh;overflow:auto;cursor:pointer;margin-bottom:4px}
.dock .det{margin-top:2px;padding-top:4px;border:0}
.dock .exp{margin-top:4px;padding-top:4px;border:0}
.dock .fb{margin:0 0 4px}
.dock .btn{margin:4px 0 0}
.dock .two{display:flex;gap:8px}.dock .two .btn{flex:1}
/* ===== クイズ画面：ビューポート固定（ページ自体はスクロールしない）===== */
html.lock,html.lock body{height:100%;overflow:hidden;overscroll-behavior:none}
.wrap.s{height:100vh;height:100dvh;max-width:720px;display:flex;flex-direction:column;padding:6px 12px calc(6px + env(safe-area-inset-bottom));overflow:hidden}
.wrap.s .sbody{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column}
.wrap.s .sbody .card{flex:0 1 auto}
.wrap.s .sh{flex:0 0 auto;margin-bottom:0}
.wrap.s .bar{margin:4px 0 6px;flex:0 0 auto}
.wrap.s .compact .card{margin:4px 0;padding:10px 12px}
.wrap.s .compact .opt{padding:clamp(6px,1.6dvh,10px) 12px;margin:clamp(4px,.9dvh,6px) 0;font-size:clamp(.9rem,2.4dvh,1.05rem);line-height:1.35}
.wrap.s .compact .opt.gr{font-size:clamp(1.05rem,3dvh,1.3rem)!important}
.wrap.s .compact .big{font-size:clamp(1.5rem,6dvh,2.3rem);margin:0 0 .15em;line-height:1.2}
.wrap.s .compact .q{font-size:clamp(.95rem,2.5dvh,1.1rem);margin:.1em 0 .3em;line-height:1.5}
.wrap.s .compact .q .gr{font-size:1.2em}
.wrap.s .dock{flex:0 0 auto;position:static;margin:6px 0 0;padding:6px 0 0;background:var(--bg);border-top:1px solid var(--line);min-height:0;max-height:46dvh;display:flex;flex-direction:column}
.wrap.s .dock .dd{flex:1 1 auto;min-height:0;overflow:auto;margin:0 0 4px}
.wrap.s .dock .fb,.wrap.s .dock .btn,.wrap.s .dock .two{flex:0 0 auto}
.wrap.s .dock .btn{padding:clamp(8px,1.8dvh,12px) 16px;margin:2px 0 0}
.wrap.s .dock .det>.gr{font-size:1.2rem!important}
.wrap.s .dock .det{line-height:1.45}
.wrap.s .dock .row{margin:1px 0;font-size:.84rem}
.wrap.s .dock .row>span:first-child{min-width:5.5em}
.wrap.s .dock .exp{font-size:.84rem;line-height:1.45}
.wrap.s .dock table.pt{margin:2px 0}
.wrap.s .dock table.pt td,.wrap.s .dock table.pt th{font-size:.9rem;padding:2px 5px}
.wrap.s .dock .small{font-size:.74rem}
.wrap.s .dock{max-height:58dvh}
.wrap.s .dock .det>.gr{display:none!important}
.wrap.s .dock .row>span:first-child{min-width:6.4em}
.wrap.s .dock .det .pos{font-size:.75rem}
.wrap.s .dock table.pt td,.wrap.s .dock table.pt th{font-size:.85rem;padding:1px 4px;line-height:1.35}
.wrap.s .compact .card>div[style*="text-align:center"] .btn.inl{padding:2px 12px;font-size:.82rem;margin:0 0 2px}
.wrap.s .compact .card .small{line-height:1.3}
@media (max-height:700px){
.wrap.s .dock .exp>.small{display:none}
.wrap.s .dock table.pt td,.wrap.s .dock table.pt th{padding:0 4px;font-size:.8rem;line-height:1.3}
.wrap.s .dock .fb{padding:4px 10px;margin-bottom:2px}
.wrap.s .compact .card{padding:8px 10px}
.wrap.s .bar{margin:3px 0 4px}
}
.les p{margin:.5em 0}.les .gr{font-size:1.1em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const g=s=>`<span class="gr">${s}</span>`;
const CASES=['主格','属格','与格','対格'];
// ===== 変化表（自動で問題を生成）=====
const P=[
{k:'art',u:3,t:'定冠詞',cols:CASES,rows:[
['男性・単数',['ὁ','τοῦ','τῷ','τόν']],['女性・単数',['ἡ','τῆς','τῇ','τήν']],['中性・単数',['τό','τοῦ','τῷ','τό']],
['男性・複数',['οἱ','τῶν','τοῖς','τούς']],['女性・複数',['αἱ','τῶν','ταῖς','τάς']],['中性・複数',['τά','τῶν','τοῖς','τά']]]},
{k:'logos',u:4,t:'λόγος（第2変化・男性）',cols:CASES,rows:[['単数',['λόγος','λόγου','λόγῳ','λόγον']],['複数',['λόγοι','λόγων','λόγοις','λόγους']]]},
{k:'ergon',u:4,t:'ἔργον（第2変化・中性）',cols:CASES,rows:[['単数',['ἔργον','ἔργου','ἔργῳ','ἔργον']],['複数',['ἔργα','ἔργων','ἔργοις','ἔργα']]]},
{k:'agape',u:5,t:'ἀγάπη（第1変化・-η型）',cols:CASES,rows:[['単数',['ἀγάπη','ἀγάπης','ἀγάπῃ','ἀγάπην']],['複数',['ἀγάπαι','ἀγαπῶν','ἀγάπαις','ἀγάπας']]]},
{k:'hemera',u:5,t:'ἡμέρα（第1変化・-α型）',cols:CASES,rows:[['単数',['ἡμέρα','ἡμέρας','ἡμέρᾳ','ἡμέραν']],['複数',['ἡμέραι','ἡμερῶν','ἡμέραις','ἡμέρας']]]},
{k:'prophetes',u:5,t:'προφήτης（第1変化・男性）',cols:CASES,rows:[['単数',['προφήτης','προφήτου','προφήτῃ','προφήτην']],['複数',['προφῆται','προφητῶν','προφήταις','προφήτας']]]},
{k:'sarx',u:6,t:'σάρξ（第3変化・語幹 σαρκ-）',cols:CASES,rows:[['単数',['σάρξ','σαρκός','σαρκί','σάρκα']],['複数',['σάρκες','σαρκῶν','σαρξί(ν)','σάρκας']]]},
{k:'onoma',u:6,t:'ὄνομα（第3変化・-μα中性）',cols:CASES,rows:[['単数',['ὄνομα','ὀνόματος','ὀνόματι','ὄνομα']],['複数',['ὀνόματα','ὀνομάτων','ὀνόμασι(ν)','ὀνόματα']]]},
{k:'pater',u:6,t:'πατήρ（第3変化・語幹 πατρ-／πατερ-）',cols:CASES,rows:[['単数',['πατήρ','πατρός','πατρί','πατέρα']],['複数',['πατέρες','πατέρων','πατράσι(ν)','πατέρας']]]},
{k:'charis',u:6,t:'χάρις（第3変化・語幹 χαριτ-）',cols:CASES,rows:[['単数',['χάρις','χάριτος','χάριτι','χάριν']]]},
{k:'ego',u:7,t:'ἐγώ（私）',cols:CASES,rows:[['単数',['ἐγώ','ἐμοῦ（μου）','ἐμοί（μοι）','ἐμέ（με）']]]},
{k:'su',u:7,t:'σύ（あなた）',cols:CASES,rows:[['単数',['σύ','σοῦ','σοί','σέ']]]},
{k:'hemeis',u:7,t:'ἡμεῖς（私たち）',cols:CASES,rows:[['複数',['ἡμεῖς','ἡμῶν','ἡμῖν','ἡμᾶς']]]},
{k:'humeis',u:7,t:'ὑμεῖς（あなたがた）',cols:CASES,rows:[['複数',['ὑμεῖς','ὑμῶν','ὑμῖν','ὑμᾶς']]]},
{k:'autos',u:7,t:'αὐτός（彼・それ・男性）',cols:CASES,rows:[['単数',['αὐτός','αὐτοῦ','αὐτῷ','αὐτόν']],['複数',['αὐτοί','αὐτῶν','αὐτοῖς','αὐτούς']]]},
{k:'luo',u:8,t:'λύω 現在能動 直説法',cols:[''],rows:[['1人称・単数',['λύω']],['2人称・単数',['λύεις']],['3人称・単数',['λύει']],['1人称・複数',['λύομεν']],['2人称・複数',['λύετε']],['3人称・複数',['λύουσι(ν)']]]},
{k:'luomai',u:8,t:'λύομαι 現在 中動・受動 直説法',cols:[''],rows:[['1人称・単数',['λύομαι']],['2人称・単数',['λύῃ']],['3人称・単数',['λύεται']],['1人称・複数',['λυόμεθα']],['2人称・複数',['λύεσθε']],['3人称・複数',['λύονται']]]},
{k:'tense',u:9,t:'λύω の時制の形（直説法能動）',cols:['1人称単数','3人称単数'],rows:[['現在',['λύω','λύει']],['未完了',['ἔλυον','ἔλυεν']],['未来',['λύσω','λύσει']],['アオリスト',['ἔλυσα','ἔλυσεν']],['完了',['λέλυκα','λέλυκεν']]]},
{k:'eimi',u:10,t:'εἰμί（〜である）現在',cols:[''],rows:[['1人称・単数',['εἰμί']],['2人称・単数',['εἶ']],['3人称・単数',['ἐστί(ν)']],['1人称・複数',['ἐσμέν']],['2人称・複数',['ἐστέ']],['3人称・複数',['εἰσί(ν)']]]},
{k:'eimi2',u:10,t:'εἰμί（〜であった）未完了',cols:[''],rows:[['1人称・単数',['ἤμην']],['2人称・単数',['ἦς']],['3人称・単数',['ἦν']],['1人称・複数',['ἦμεν']],['2人称・複数',['ἦτε']],['3人称・複数',['ἦσαν']]]},
{k:'ptc',u:11,t:'λύω の能動分詞（単数主格）',cols:['男性','女性','中性'],rows:[['現在能動分詞',['λύων','λύουσα','λῦον']],['アオリスト能動分詞',['λύσας','λύσασα','λῦσαν']]]},
{k:'inf',u:12,t:'λύω の不定詞',cols:[''],rows:[['現在能動',['λύειν']],['アオリスト能動',['λῦσαι']],['完了能動',['λελυκέναι']],['現在中動・受動',['λύεσθαι']],['アオリスト中動',['λύσασθαι']]]},
{k:'subj',u:12,t:'λύω 現在能動 接続法',cols:[''],rows:[['1人称・単数',['λύω']],['2人称・単数',['λύῃς']],['3人称・単数',['λύῃ']],['1人称・複数',['λύωμεν']],['2人称・複数',['λύητε']],['3人称・複数',['λύωσι(ν)']]]},
{k:'imp',u:12,t:'λύω の命令法（能動）',cols:[''],rows:[['現在・2単',['λῦε']],['現在・2複',['λύετε']],['現在・3単',['λυέτω']],['アオリスト・2単',['λῦσον']],['アオリスト・2複',['λύσατε']]]}
];
// ===== 概念問題 =====
const Q=(q,a,w,e)=>({q,a,w,e});
const U=[
{id:1,t:'格の働き（語尾で役割が決まる）',les:`<p><b>核心</b>：ギリシャ語は語順ではなく<b>語尾（格）</b>で役割が決まる。日本語の助詞（が・の・に・を）に近い。</p>
<table><tr><th>格</th><th>基本の働き</th><th>日本語の目安</th></tr><tr><td>主格</td><td>主語・述語名詞</td><td>〜が／〜は</td></tr><tr><td>属格</td><td>所属・所有・由来・対象</td><td>〜の</td></tr><tr><td>与格</td><td>間接目的語・手段・場所・時</td><td>〜に／〜で</td></tr><tr><td>対格</td><td>直接目的語・方向・範囲</td><td>〜を</td></tr><tr><td>呼格</td><td>呼びかけ</td><td>〜よ</td></tr></table>
<p>助詞と1対1ではない。前置詞が格を支配する（次の単元）。</p>
<p><b>ヘブル的視点</b>：ヘブル語に格変化はなく、連語形（סְמִיכוּת）や前置詞（לְ, בְּ, מִן, אֶת）で関係を示す。ギリシャ語の属格は連語形（<span class="he">דְּבַר־יְהוָה</span>「主のことば」）に、与格の「〜に」は לְ に対応することが多い。</p>
<p><b>コツ</b>：名詞は冠詞つきで覚える（${g('ὁ λόγος')}）。冠詞が性・数・格を教えてくれる。</p>`,
c:[
Q('ギリシャ語で名詞の役割（主語・目的語など）を示す主な手段は？','語尾の変化（格）',['語順','助詞','語頭の変化'],'語順は自由度が高い。役割は格語尾で決まる。'),
Q('属格の基本的な働きは？','〜の（所属・所有・由来）',['〜を（直接目的）','〜に（間接目的）','〜よ（呼びかけ）'],''),
Q('対格の基本的な働きは？','〜を（直接目的語）・方向',['〜の（所有）','〜が（主語）','〜よ（呼びかけ）'],''),
Q('与格の働きとして最も典型的でないものは？','直接目的語',['間接目的語（〜に）','手段（〜で）','場所・時（〜に）'],'直接目的語は対格が典型。ただし一部の動詞は与格を取る。'),
Q(`${g('ὁ θεὸς ἀγάπη ἐστίν')}（Ⅰヨハネ4:8）で ${g('ἀγάπη')} の格は？`,'主格',['属格','与格','対格'],'εἰμί の補語（述語名詞）は主格。「AはBである」はA・Bとも主格。'),
Q(`${g('ὁ λόγος τοῦ θεοῦ')} の ${g('τοῦ θεοῦ')} の格と訳は？`,'属格「神の」',['与格「神に」','対格「神を」','主格「神が」'],'τοῦ θεοῦ＝属格・単数。「神のことば」。'),
Q(`${g('κύριε')}（主よ）の格は？`,'呼格',['主格','属格','対格'],'κύριος の呼格が κύριε。呼びかけ専用の格。'),
Q('名詞を冠詞つきで覚える最大の利点は？','性（男・女・中）が同時に分かる',['発音が分かる','格が分かる','語根が分かる'],'性は形容詞・代名詞の一致で必要になる。'),
Q('ヘブル語の連語形（例：דְּבַר־יְהוָה「主のことば」）に対応しやすいギリシャ語の格は？','属格',['与格','対格','呼格'],'連語形の後ろの名詞は「〜の」関係。常に1対1ではない。')]},
{id:2,t:'前置詞と格（空間イメージで覚える）',les:`<p><b>核心</b>：前置詞は<b>後ろの名詞の格を決める</b>。格には空間イメージがある。<br>属格＝<b>起点・分離</b>（から）／与格＝<b>位置・関与</b>（で・と）／対格＝<b>方向・到達</b>（へ）</p>
<table><tr><th>前置詞</th><th>格：意味</th></tr>
<tr><td>${g('ἐν')}</td><td>与：〜の中に・〜で</td></tr><tr><td>${g('εἰς')}</td><td>対：〜の中へ</td></tr><tr><td>${g('ἐκ / ἀπό')}</td><td>属：〜から（外へ／離れて）</td></tr><tr><td>${g('πρός')}</td><td>対：〜へ・〜のもとに</td></tr><tr><td>${g('σύν')}</td><td>与：〜と共に</td></tr>
<tr><td>${g('διά')}</td><td>属：〜を通して／対：〜のゆえに</td></tr><tr><td>${g('μετά')}</td><td>属：〜と共に／対：〜の後に</td></tr><tr><td>${g('κατά')}</td><td>属：〜に反して／対：〜に従って</td></tr><tr><td>${g('περί')}</td><td>属：〜について／対：〜の周りに</td></tr><tr><td>${g('ὑπό')}</td><td>属：〜によって（動作主）／対：〜の下に</td></tr><tr><td>${g('ὑπέρ')}</td><td>属：〜のために／対：〜を超えて</td></tr><tr><td>${g('παρά')}</td><td>属：〜のもとから／与：〜のもとで／対：〜のそばに</td></tr><tr><td>${g('ἐπί')}</td><td>属：〜の上で／与：〜の上に／対：〜の上へ</td></tr></table>
<p><b>接頭辞との関係</b>：複合動詞の接頭辞はこの前置詞そのもの（ἐκ-βάλλω＝外へ＋投げる）。語彙アプリの「接頭辞・語根」で訓練。</p>`,
c:[
Q(`${g('ἐν')} が支配する格は？`,'与格',['属格','対格','主格'],'ἐν＋与格「〜の中に・〜で」。位置＝与格。'),
Q(`${g('εἰς')} が支配する格は？`,'対格',['属格','与格','主格'],'到達点＝対格。'),
Q(`${g('ἐκ')}・${g('ἀπό')} が支配する格は？`,'属格',['与格','対格','呼格'],'起点・分離＝属格。'),
Q('「家の中にいる」と「家の中へ入る」の正しい使い分けは？','ἐν＋与格／εἰς＋対格',['ἐν＋対格／εἰς＋与格','どちらも ἐν＋与格','ἐκ＋属格／ἐν＋対格'],'静止＝ἐν、移動＝εἰς。'),
Q(`${g('διά')}＋属格の意味は？`,'〜を通して',['〜のゆえに','〜の後に','〜のために'],'経由。例：ヨハネ1:3 δι᾽ αὐτοῦ「彼を通して」。'),

Q(`${g('μετὰ ταῦτα')}（μετά＋対格）の意味は？`,'これらの後に',['これらと共に','これらを通して','これらのために'],''),
Q(`${g('ὑπό')}＋属格が受動態で表すものは？`,'動作主（〜によって）',['場所（〜の下で）','手段（〜で）','理由（〜のゆえに）'],''),
Q(`${g('πρὸς τὸν θεόν')}（ヨハネ1:1）の ${g('τὸν θεόν')} の格は？`,'対格',['属格','与格','主格'],'πρός＋対格＝「〜に向かって・〜のもとに」。'),
Q(`${g('παρὰ θεοῦ')}（ヨハネ1:6）の意味は？`,'神のもとから',['神のもとで','神のそばに','神の代わりに'],'παρά＋属格＝「〜のもとから」。'),
Q(`${g('ἐν τῇ σκοτίᾳ')}（ヨハネ1:5）の ${g('σκοτίᾳ')} の格は？`,'与格',['属格','対格','主格'],'ἐν＋与格。'),
Q('格のイメージの正しい対応は？','属格＝起点・分離／与格＝位置・関与／対格＝方向・到達',['属格＝方向／与格＝起点／対格＝位置','属格＝位置／与格＝方向／対格＝起点','属格＝到達／与格＝分離／対格＝関与'],''),
Q(`${g('ὑπέρ')}＋属格の意味は？`,'〜のために',['〜を超えて','〜の下に','〜の代わりに'],'ὑπέρ＋対格は「〜を超えて」。')]},
{id:3,t:'定冠詞の変化（全格変化の鍵）',les:`<p><b>核心</b>：冠詞の表を覚えると、名詞の格語尾が見通せる。冠詞は<b>τ-＋母音</b>が基本。</p>
<p><b>観察</b>：①τ- で始まらないのは男女の主格（ὁ ἡ οἱ αἱ）だけ。②中性は主格＝対格（全変化共通）。③属格複数 τῶν は全性共通。④与格複数は男中 τοῖς／女 ταῖς。</p>`,
c:[
Q('τ- で始まらない冠詞形は？','ὁ, ἡ, οἱ, αἱ（男女の主格）',['τό, τά（中性）','τοῦ, τῷ（単数属・与）','τῶν, τοῖς（複数属・与）'],'例外は男女の主格だけ。それ以外はすべて τ-。'),
Q('中性名詞の主格と常に同形なのは？','対格',['属格','与格','呼格'],'中性は主格＝対格（全変化共通）。'),
Q(`${g('τῶν')} は何性？`,'全性共通（属格複数）',['男性のみ','女性のみ','中性のみ'],''),
Q('英語の the と比べた冠詞の特徴で正しいのは？','固有名詞にも付くことがある（ὁ Ἰησοῦς）',['固有名詞には付かない','必ず付く','不定を表す'],'ヨハネ福音書でも ὁ Ἰησοῦς が頻出。'),
Q(`${g('τὸν λόγον')} の格・性・数は？`,'対格・男性・単数',['対格・中性・単数','属格・男性・複数','主格・男性・単数'],''),
Q(`${g('τοῖς λόγοις')} の格・数は？`,'与格・複数',['属格・複数','与格・単数','対格・複数'],''),
Q('εἰμί 文で冠詞つき名詞と冠詞なし名詞が並ぶとき、主語になりやすいのは？','冠詞つき名詞',['冠詞なし名詞','語順が先のもの','属格の名詞'],'傾向。主語は冠詞つき、述語は冠詞なし（述語主格）。ヨハネ1:1c で確認。'),
Q('冠詞が教えてくれるのは？','後続名詞の性・数・格',['動詞の時制','名詞の語根','前置詞の種類'],'冠詞の形＝名詞の格の手がかり。')]},
{id:4,t:'第2変化名詞（-ος／-ον）',les:`<p><b>核心</b>：男性 -ος、中性 -ον。冠詞の語尾と見比べる（τοῦ λόγου, τῷ λόγῳ）。</p>
<p>・中性は<b>主格＝対格</b>、複数は <b>-α</b>。<br>・<b>ι下書き</b>（ῳ）：発音しないが与格の印。<br>・ἡ ὁδός（道）・ἡ ἔρημος（荒れ野）のように -ος でも<b>女性</b>の例外がある。</p>`,
c:[
Q('第2変化の主格単数語尾（男性／中性）は？','-ος／-ον',['-η／-α','-ς／-μα','-ης／-ας'],''),
Q('第2変化の中性名詞の特徴で正しいのは？','主格＝対格、複数は -α',['主格複数は -οι','属格単数は -ος','対格単数は -ν のみ'],'ἔργον→ἔργα。'),
Q(`${g('λόγῳ')} の下の小さな ι（ι下書き）は？`,'発音しない印で、与格を示す',['発音する','属格の印','複数の印'],''),
Q(`${g('ἡ ὁδός')}（道）は -ος だが？`,'女性名詞（例外）',['男性名詞','中性名詞','第3変化'],'-ος＝男性とは限らない。冠詞で性を確認。'),
Q('第1・第2変化で男女単数の対格に共通する特徴は？','語尾に -ν が付く（λόγον, ἀγάπην）',['語尾に -ς が付く','語尾が -ι になる','語尾が -ων になる'],''),
Q('属格複数の語尾は？','第1〜第3変化すべて -ων',['第2変化のみ -ων','第1変化は -αις','中性は -α'],'τῶν ... -ων と冠詞も同形。'),
Q(`${g('τοῦ λόγου')} の格・性・数は？`,'属格・男性・単数',['与格・男性・単数','属格・男性・複数','属格・中性・複数'],''),
Q(`${g('ἔργα')} の可能な格・数は？`,'主格または対格・複数（中性）',['属格・複数','与格・複数','主格・単数'],''),
Q(`${g('ἄνθρωπος')} の属格単数は？`,'ἀνθρώπου',['ἀνθρώπος','ἀνθρώπῳ','ἀνθρώπων'],'第2変化。')]},
{id:5,t:'第1変化名詞（-η／-α／-ης）',les:`<p><b>核心</b>：主に女性。-η型と -α型がある。<b>ε・ι・ρ の直後は -α</b>（ἡμέρα, καρδία）。それ以外は -η が基本。ただし δόξα→δόξης のような例外もある。</p>
<p>男性（προφήτης）は属格単数が <b>-ου</b>（第2変化男性と同形）。複数属格は全変化共通で -ῶν。</p>`,
c:[
Q('ἡμέρα が -α 型になる規則に最も近いのは？','ε・ι・ρ の直後は -α',['常に -η','必ず -ς で終わる','中性名詞は -α'],'例外あり（δόξα→δόξης）。'),
Q(`${g('προφήτης')} の属格単数は？`,'προφήτου',['προφήτης','προφήτῃ','προφήτα'],'男性第1変化の属格は -ου。'),
Q(`${g('τῆς ἀγάπης')} の格・性・数は？`,'属格・女性・単数',['属格・女性・複数','与格・女性・単数','属格・男性・単数'],''),
Q(`${g('ἀγάπῃ')} の格は？`,'与格・単数',['属格・単数','対格・単数','主格・複数'],'ῃ の ι下書きは与格の印。'),
Q(`${g('ἀγαπῶν')}（名詞 ἀγάπη の語形）の格は？`,'属格・複数',['属格・単数','与格・複数','主格・複数'],''),
Q(`${g('τὴν ἡμέραν')} の格は？`,'対格・単数',['属格・単数','与格・単数','対格・複数'],''),
Q(`${g('ἡμέραις')} の格・数は？`,'与格・複数',['与格・単数','属格・複数','対格・複数'],''),
Q('第1変化名詞の性は？','大半が女性（-ης／-ας の男性もある）',['すべて男性','すべて中性','すべて女性'],'冠詞で確認する。')]},
{id:6,t:'第3変化名詞（語幹＋語尾）',les:`<p><b>核心</b>：主格は不規則。<b>属格単数（-ος）から -ος を取って語幹</b>を出し、語尾を付ける。</p>
<table><tr><th></th><th>単数</th><th>複数</th></tr><tr><td>主</td><td>-ς／（なし）</td><td>-ες</td></tr><tr><td>属</td><td>-ος</td><td>-ων</td></tr><tr><td>与</td><td>-ι</td><td>-σι(ν)</td></tr><tr><td>対</td><td>-α（または -ν）</td><td>-ας</td></tr></table>
<p>・-μα の中性（ὄνομα, πνεῦμα, σῶμα, αἷμα）は属格 <b>-ματος</b>、主格＝対格。<br>・語幹の末尾子音は -σι の前で変化：κ+σι→ξι（σαρξί）、τ は脱落（ὀνόμασι）。</p>`,
c:[
Q('第3変化の語幹の見つけ方は？','属格単数から -ος を除く（σαρκός→σαρκ-）',['主格から -ς を除く','対格から -ν を除く','複数主格から -ες を除く'],'主格は不規則なので当てにならない。'),
Q('第3変化の属格単数語尾は？','-ος',['-ου','-ης','-ων'],'λόγου（-ου）と区別して第2変化と見分ける。'),
Q(`${g('σαρξί(ν)')} の格・数は？`,'与格・複数',['与格・単数','属格・複数','対格・複数'],'κ+σι→ξι。'),
Q(`${g('φῶς')} の属格単数は？`,'φωτός',['φῶτος','φωτοῦ','φωτῶν'],'語幹 φωτ-。'),
Q(`${g('πνεῦμα')} の属格単数は？`,'πνεύματος',['πνεῦματος','πνεύματου','πνεύμας'],'-μα 中性は -ματος。アクセント位置が移る。'),
Q('-μα 中性名詞の主格と対格の関係は？','同形',['対格のみ -ν が付く','対格は -α','主格は -ς'],''),
Q('第3変化の男女名詞の対格単数の典型語尾は？','-α（σάρκα, πατέρα）',['-ν のみ','-ου','-ες'],'語幹が -τ- の -ις 名詞（χάρις）は -ν（χάριν）になる。'),
Q(`${g('χάριτος')}（ヨハネ1:14）の格は？`,'属格・単数',['与格・単数','属格・複数','対格・単数'],'πλήρης χάριτος「恵みに満ちた」。'),
Q(`${g('ὀνόματι')} の格・数は？`,'与格・単数',['属格・単数','与格・複数','対格・単数'],'')]},
{id:7,t:'形容詞と代名詞',les:`<p><b>核心</b>：形容詞は名詞と<b>性・数・格の3つが一致</b>する。</p>
<p>・限定用法：${g('ὁ ἀγαθὸς ἄνθρωπος')}「その良い人」（冠詞＋形容詞＋名詞）。<br>・述語用法：${g('ὁ ἄνθρωπος ἀγαθός')}「その人は良い」（冠詞の外・ἐστίν 省略）。</p>
<p>・所有は属格：${g('ὁ λόγος μου')}＝私のことば（μου は名詞の後ろ）。<br>・${g('αὐτός')}：「彼／それ」（3人称）、冠詞の前なら「〜自身」、冠詞の後なら「同じ」。<br>・${g('οὗτος')}＝近称（これ）、${g('ἐκεῖνος')}＝遠称（あれ）。</p>`,
c:[
Q('形容詞が名詞と一致するものは？','性・数・格',['時制・人称・数','語根・接頭辞','アクセントのみ'],''),
Q(`${g('ὁ ἀγαθὸς ἄνθρωπος')} の用法は？`,'限定用法「その良い人」',['述語用法「その人は良い」','比較','呼びかけ'],'冠詞＋形容詞＋名詞＝限定。'),
Q(`${g('ὁ ἄνθρωπος ἀγαθός')} の意味は？`,'その人は良い（述語用法）',['その良い人（限定）','良い人々','その人の善'],'形容詞が冠詞の外＝述語（ἐστίν 省略）。'),
Q(`${g('ὁ λόγος μου')} の μου の格・意味は？`,'属格「私の」',['与格「私に」','対格「私を」','主格「私が」'],''),
Q(`${g('ἡμῖν')} の格・意味は？`,'与格複数「私たちに」',['属格複数「私たちの」','対格複数「私たちを」','主格複数「私たちが」'],'ἐσκήνωσεν ἐν ἡμῖν（ヨハネ1:14）。'),
Q(`${g('ὑμᾶς')} の格・意味は？`,'対格複数「あなたがたを」',['属格複数「あなたがたの」','与格複数「あなたがたに」','主格複数「あなたがたが」'],''),
Q(`${g('αὐτοῦ')} の可能な意味は？`,'彼の／それの（属格）',['彼に','彼を','彼が'],'ヨハネ1:14 τὴν δόξαν αὐτοῦ「彼の栄光」。'),
Q(`${g('αὐτὸς ὁ Ἰησοῦς')} の意味は？`,'イエス自身',['同じイエス','彼のイエス','イエスの彼'],'αὐτός＋冠詞＋名詞＝〜自身。'),
Q(`${g('ὁ αὐτός')} の意味は？`,'同じ（人・もの）',['〜自身','彼の','その他の'],'冠詞＋αὐτός＝同じ。'),
Q('οὗτος と ἐκεῖνος の違いは？','近称（これ）と遠称（あれ）',['男性と女性','単数と複数','主格と属格'],'')]},
{id:8,t:'動詞の基礎：現在形・人称語尾',les:`<p><b>核心</b>：動詞 ＝（augment など）＋語幹＋時制標識＋<b>人称語尾</b>。語尾が人称・数を示すので主語代名詞は省略できる。</p>
<p>・能動：-ω -εις -ει -ομεν -ετε -ουσι(ν)<br>・中動・受動：-ομαι -ῃ -εται -όμεθα -εσθε -ονται（現在・未完了・完了は形が同じ）。<br>・<b>デポネント</b>：形は中動・受動だが意味は能動（ἔρχομαι 来る、γίνομαι なる、ἀποκρίνομαι 答える）。辞書形が -ομαι のものが多い。<br>・辞書は動詞を<b>現在・1人称単数</b>で載せる。</p>`,
c:[
Q(`${g('λύω')} の人称・数は？`,'1人称・単数「私は解く」',['3人称・単数','1人称・複数','2人称・単数'],''),
Q(`${g('λύουσιν')} の人称・数は？`,'3人称・複数「彼らは解く」',['3人称・単数','2人称・複数','1人称・複数'],'-ν は可動のν。'),
Q(`${g('λέγει')} の意味は？`,'彼は言う（3人称・単数）',['あなたは言う','私は言う','彼らは言う'],'主語代名詞なしで「彼は」が分かる。'),
Q(`${g('λύετε')}（現在）の可能な解釈は？`,'2人称複数の直説法「あなたがたは解く」または命令「解け」',['3人称複数','1人称複数','2人称単数'],'直説法と命令法が同形。文脈で判断。'),
Q('ἐγὼ λύω のように主語 ἐγώ を明示すると？','主語を強調する',['時制が変わる','受動になる','否定になる'],'ヨハネの ἐγώ εἰμι も強調。'),
Q(`${g('λύεται')} の可能な訳は？`,'解かれる（受動）／自分のために解く（中動）',['彼は解く（能動）','彼らは解く','解け（命令）'],'中動・受動は形が同じ。'),
Q(`${g('ἔρχομαι')} が -ομαι で終わるのに「来る」（能動の意味）なのはなぜ？`,'デポネント（形は中動・受動、意味は能動）',['受動態だから','未来形だから','接続法だから'],''),
Q('辞書に載る動詞の形は？','現在・1人称・単数',['不定詞','アオリスト3単','命令法2単'],'λέγω＝「私は言う」。'),
Q(`${g('λύουσι(ν)')} の (ν) は？`,'可動のν（母音の前・文末で付く）',['複数の印','過去の印','否定の印'],'')]},
{id:9,t:'時制とアスペクト（読解の質を決める）',les:`<p><b>核心</b>：コイネーの時制は<b>時間より「動作の見え方（アスペクト）」</b>を表す。時間を示すのは主に直説法。分詞・不定詞・接続法・命令法では、主に継続か完結かの違いになる。</p>
<table><tr><th>時制</th><th>核心</th><th>形の手がかり</th></tr>
<tr><td>現在</td><td>継続・反復「〜している」</td><td>語幹＋語尾（λύω）</td></tr>
<tr><td>未完了</td><td>過去の継続・反復「〜していた」</td><td><b>augment ἐ-</b>＋現在語幹（ἔλυον）</td></tr>
<tr><td>アオリスト</td><td>完結・一括「〜した」</td><td>augment＋<b>-σα</b>（第1）／語幹変化（第2：ἔβαλον）</td></tr>
<tr><td>完了</td><td>過去の行為の<b>結果が現在に残る</b></td><td><b>語頭重複</b>（λέ-λυ-κα）</td></tr>
<tr><td>未来</td><td>〜するだろう</td><td>-σω（λύσω）</td></tr></table>
<p><b>augment</b>：過去の標識 ε-。母音で始まる語は語頭母音が長くなる。複合動詞では<b>接頭辞と語幹の間</b>に入る（ἐκ-βάλλω→ἐξ-έ-βαλον）。</p>
<p><b>ヘブル的視点</b>：ヘブル語の動詞（完了形・未完了形）も、時間よりアスペクトで説明されることが多い（学説に議論あり）。</p>`,
c:[
Q('現在形とアオリストの核心的な違いは？','継続・反復 と 完結・一括',['現在と過去','能動と受動','直説法と接続法'],''),
Q('完了形の核心は？','過去の行為の結果が現在に残る',['過去の継続','未来の完了','単なる過去の一回'],''),
Q(`${g('ἔλυσα')} の時制・人称は？`,'アオリスト・1人称単数',['未完了・1人称単数','完了・1人称単数','未来・1人称単数'],''),
Q(`${g('ἔλυεν')} の時制・人称は？`,'未完了・3人称単数',['アオリスト・3人称単数','現在・3人称単数','完了・3人称単数'],'augment＋現在語幹＋-εν。'),
Q(`${g('λέλυκα')} の時制は？`,'完了',['未完了','アオリスト','未来'],'語頭重複 λε-＋-κα。'),
Q(`${g('λύσω')} の時制は？`,'未来（1人称単数）',['アオリスト','完了','未完了'],''),
Q(`${g('λέλυκα')} の語頭の λε- は？`,'語頭重複（完了の標識）',['augment（過去の標識）','未来の標識','受動の標識'],''),

 cells.forEach(ce=>{
  ALLQ.push({id:p.k+'|'+ce.l+'|A',u:p.u,build:()=>{const wr=shuffle([...new Set(cells.filter(x=>x.f!==ce.f).map(x=>x.f))]).slice(0,3);
   return{text:`【${p.t}】「${ce.l}」の形は？`,a:ce.f,o:shuffle([ce.f].concat(wr)),exp:'',p,hl:ce.l,say:ce.f}}});
  if(cells.filter(x=>x.f===ce.f).length===1)ALLQ.push({id:p.k+'|'+ce.l+'|B',u:p.u,build:()=>{const wr=shuffle(cells.filter(x=>x.f!==ce.f).map(x=>x.l)).slice(0,3);
   return{text:`【${p.t}】${g(ce.f)} は？`,a:ce.l,o:shuffle([ce.l].concat(wr)),exp:'',p,hl:ce.l,say:ce.f}}});
 })});
U.forEach(u=>u.c.forEach((c,i)=>ALLQ.push({id:'c'+u.id+'_'+i,u:u.id,build:()=>({text:c.q,a:c.a,o:shuffle([c.a].concat(c.w)),exp:c.e})})));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// 単元に属さない変化表の単元は P.u で既に紐づけ（U にない単元IDは無い）

// ===== 状態 =====
const $app=document.getElementById('app');
const KEY='koinegram_v1',INT=[0,1,3,7,14,30];
let S={},canSave=true,V={n:'home'},sess=null,rs=false;
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){canSave=false}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// ===== 音声：ギリシャ語→音訳→スペイン語音声（綴りが規則的）=====
const TTS='speechSynthesis' in window;
let PM='edu';try{PM=localStorage.getItem('koine_pm')||'edu'}catch(e){}
function setPM(v){PM=v;try{localStorage.setItem('koine_pm',v)}catch(e){}}
const VW={'α':'a','ε':'e','η':'e','ι':'i','ο':'o','υ':'u','ω':'o'};
const CS={'β':'b','δ':'d','θ':'t','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'ks','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','φ':'f','χ':'j','ψ':'ps'};
const ACU={a:'á',e:'é',i:'í',o:'ó',u:'ú'};
function phon(t,mode){
 const kn=mode==='koine';
 const s=String(t).split(/[,，、／（(]/)[0].toLowerCase().normalize('NFD');
 const tk=[];
 for(const ch of s){const cp=ch.codePointAt(0);
  if(cp>=0x300&&cp<=0x36f){const l=tk[tk.length-1];if(!l||!l.g)continue;if(cp===0x301||cp===0x300||cp===0x342)l.acc=true;else if(cp===0x308)l.dia=true;continue}
  if(cp>=0x3b1&&cp<=0x3c9)tk.push({c:ch,g:1,acc:false,dia:false});else tk.push({c:' ',g:0})}
 const voiced=n=>!n||!n.g?false:('αεηιουωβγδζλμνρ'.includes(n.c));
 const out=[];
 const acc=(str,on)=>on?ACU[str[0]]?ACU[str[0]]+str.slice(1):str:str;
 for(let i=0;i<tk.length;i++){
  const x=tk[i],n=tk[i+1],a=x.c;
  if(!x.g){out.push(' ');continue}
  if(n&&n.g&&!n.dia&&'αεηουω'.includes(a)||n&&n.g&&!n.dia&&a==='υ'){
   const pr=a+n.c;let r=null;
   if(pr==='αι')r=kn?'e':'ai';else if(pr==='ει')r=kn?'i':'ei';else if(pr==='οι')r=kn?'i':'oi';else if(pr==='υι')r=kn?'i':'ui';else if(pr==='ου')r='u';
   else if(pr==='αυ')r=kn?('a'+(voiced(tk[i+2])?'v':'f')):'au';
   else if(pr==='ευ')r=kn?('e'+(voiced(tk[i+2])?'v':'f')):'eu';
   else if(pr==='ηυ')r=kn?('i'+(voiced(tk[i+2])?'v':'f')):'eu';
   if(r!==null){out.push(acc(r,x.acc||n.acc));i++;continue}}
  if(VW[a]){let v=VW[a];if(kn){if(a==='η'||a==='υ')v='i'}
   v=acc(v,x.acc);out.push((x.dia?'h':'')+v);continue}
  if(a==='γ'){out.push(n&&n.g&&'γκξχ'.includes(n.c)?'n':'g');continue}
  if(a==='ζ'){out.push(kn?'s':'ds');continue}
  if(a==='λ'&&n&&n.c==='λ'){out.push('l');i++;continue}
  out.push(CS[a]||'')}
 return out.join('').replace(/g(?=[eiéí])/g,'gu').replace(/\s+/g,' ').trim()}
function ttsText(t){t=String(t).split(/[,，、／（(]/)[0].normalize('NFD').replace(/[̓̔ͅ]/g,'').replace(/[̀͂]/g,'́').normalize('NFC');return t.replace(/[^Ͱ-Ͽἀ-῿\s]/g,'').trim()}
function pickVoice(pref){try{const vs=speechSynthesis.getVoices();for(const p of pref){const v=vs.find(v=>v.lang.replace('_','-').toLowerCase().startsWith(p));if(v)return v}}catch(e){}return null}
function say(t){if(!TTS)return false;try{
 let text,lang,pref;
 if(PM==='modern'){text=ttsText(t);lang='el-GR';pref=['el']}
 else{text=phon(t,PM);lang='es-ES';pref=['es-es','es-mx','es-us','es']}
 if(!text)return false;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.8;const v=pickVoice(pref);if(v)u.voice=v;speechSynthesis.speak(u);return true}catch(e){return false}}
if(TTS){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
function voiceNote(){if(!TTS)return'この環境は音声合成に未対応。';const need=PM==='modern'?['el']:['es'];return pickVoice(need)?'':(PM==='modern'?'ギリシャ語':'スペイン語')+'の音声が端末に見つからない。OSの音声設定で追加すると聞ける。'}
function pmSelect(){return `<select data-c="pm"><option value="edu"${PM==='edu'?' selected':''}>教育式（αι＝アイ・学習用の標準）</option><option value="koine"${PM==='koine'?' selected':''}>復元式（1世紀コイネー・推定）</option><option value="modern"${PM==='modern'?' selected':''}>現代ギリシャ語（端末音声）</option></select>`}
function sv(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canSave=false}}
const get=id=>S[id]||{b:-1,d:0,c:0,w:0};
function grade(id,ok){const s=S[id]||(S[id]={b:-1,d:0,c:0,w:0});if(s.b<0)s.b=0;if(ok){s.c++;s.b=Math.min(5,s.b+1)}else{s.w++;s.b=0}s.d=Date.now()+INT[s.b]*864e5;sv()}
const byU=u=>ALLQ.filter(q=>q.u===u);
function tbl(p,hl){let h=`<div class="small">${p.t}</div><table class="pt"><tr><th></th>${p.cols.map(c=>`<th>${c||'形'}</th>`).join('')}</tr>`;
 p.rows.forEach(r=>{h+=`<tr><th>${r[0]}</th>`+p.cols.map((c,ci)=>{const l=r[0]+(c?'・'+c:'');return `<td class="gr${l===hl?' hl':''}" data-a="saytxt" data-t="${r[1][ci].replace(/"/g,'')}" style="cursor:pointer">${r[1][ci]}</td>`}).join('')+'</tr>'});return h+'</table>'}
const bar=p=>`<div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>`;
const nav=()=>`<div class="nav"><button class="btn sub inl" data-a="home">ホーム</button></div>`;

function pool(ids,n){const now=Date.now();const due=[],un=[],rest=[];ids.forEach(q=>{const s=get(q.id);if(s.b<0)un.push(q);else if(s.d<=now)due.push(q);else rest.push(q)});
 due.sort((a,b)=>get(a.id).d-get(b.id).d);return due.concat(shuffle(un),shuffle(rest)).slice(0,n)}

function homeH(){
 const now=Date.now(),all=ALLQ,seen=all.filter(q=>get(q.id).b>=0).length,mast=all.filter(q=>get(q.id).b>=3).length,due=all.filter(q=>{const s=get(q.id);return s.b>=0&&s.d<=now}).length;
 const rows=U.map(u=>{const qs=byU(u.id),m=qs.filter(q=>get(q.id).b>=3).length;const ps=P.filter(p=>p.u===u.id);
  return `<div class="unit"><div><b>${u.id}. ${u.t}</b><span class="small">定着 ${m}/${qs.length}問${ps.length?'・変化表'+ps.length+'種':''}</span></div><div><button class="btn sub inl" data-a="les" data-u="${u.id}">レッスン</button><button class="btn inl" data-a="uq" data-u="${u.id}">クイズ</button></div></div>`}).join('');
 return `<h1>コイネー文法クイズ<small> 新約ギリシャ語・読解のための最小文法</small></h1>
 ${canSave?'':'<div class="card small">この環境では進捗が保存されない。ファイルをブラウザで直接開くと保存される。</div>'}
 <div class="card"><b>進捗</b>　出題済 ${seen}/${all.length}　定着 ${mast}　復習期限 ${due}${bar(mast/all.length)}</div>
 <button class="btn" data-a="today">今日の学習（復習優先・12問）</button>
 <h2>単元（1→14の順に進める）</h2>${rows}
 <details class="card"><summary><b>使い方・定着のしくみ</b></summary>
 <p><b>1) 1単元ずつ：</b>レッスン（2〜3分）→ クイズ。変化表の問題は毎回出題形が変わる（表の「形→格」「格→形」）。</p>
 <p><b>2) 間違いは同じ回で再出題</b>（正解するまで）。正解でボックスが上がり、1→3→7→14→30日後に再出題。間違えると最初に戻る。</p>
 <p><b>3) 表は暗記より観察：</b>冠詞の形が名詞語尾のヒント。単元3（冠詞）→4・5・6（名詞）の順。</p>
 <p><b>4) 最短ルート：</b>単元1・2・3・4・8・9・10・11 を先に。ヨハネ1:1-18 の実戦（単元14）で確認しながら逐語を読む。</p>
 <p class="small">問題内の解釈（ヨハネ1:1 の ἦν など）は、文法上の事実と解釈を区別して注記している。</p></details>
 <div class="card small">音声：変化表のセルをタップ／クイズ回答後の🔊で発音。<button class="btn sub inl" data-a="saytest">🔊 テスト</button><br>発音方式：${pmSelect()}<br>${esc(voiceNote())}教育式・復元式は、音訳をスペイン語音声で読む近似。母音の長短・気息は再現しない。</div>
 <button class="btn sub" data-a="reset">${rs?'もう一度押すと進捗を消去':'進捗をリセット'}</button>`}

function lesH(){const u=U.find(x=>x.id===V.u),ps=P.filter(p=>p.u===u.id);
 return `${nav()}<h2>${u.id}. ${u.t}</h2><div class="card les">${u.les}${ps.map(p=>tbl(p)).join('')}</div><button class="btn" data-a="uq" data-u="${u.id}">この単元のクイズへ</button>`}

function start(list,label){if(!list.length)return;sess={label,list:list.slice(),queue:list.slice(),first:{},ok:0,ng:0,miss:[],cur:null,ans:false,pick:-1,phase:'quiz'};nextQ();V={n:'sess'};draw()}
function nextQ(){if(!sess.queue.length){sess.phase='done';sess.cur=null;return}const q=sess.queue.shift();sess.cur={q,b:q.build()};sess.ans=false;sess.pick=-1}
function answer(k){if(sess.ans)return;const c=sess.cur,ok=c.b.o[k]===c.b.a;sess.pick=k;sess.ans=true;const id=c.q.id;
 if(!(id in sess.first)){sess.first[id]=ok;grade(id,ok);if(ok)sess.ok++;else{sess.ng++;sess.miss.push(c.b)}}
 if(!ok)sess.queue.splice(Math.min(sess.queue.length,3),0,c.q);draw()}
function go(){nextQ();draw();window.scrollTo(0,0)}
function sessH(){
 if(sess.phase==='done'){const t=sess.ok+sess.ng;return `${nav()}<h2>結果（${sess.label}）</h2><div class="card"><div style="font-size:2rem;text-align:center">${sess.ok}/${t}　${t?Math.round(100*sess.ok/t):0}%</div><div class="small" style="text-align:center">初回正解の割合。間違いは正解するまで再出題済み。</div></div>
 ${sess.miss.length?`<h2>間違えた問題</h2>${sess.miss.map(b=>`<div class="card"><div class="q">${b.text}</div><div class="fb ok">正解：${isGr(b.a)?g(b.a):b.a}</div>${b.exp?`<div class="exp">${b.exp}</div>`:''}${b.p?`<div class="exp">${tbl(b.p,b.hl)}</div>`:''}</div>`).join('')}`:''}
 <button class="btn" data-a="home">ホームへ</button>`}
 const c=sess.cur,b=c.b,rem=new Set(sess.queue.map(q=>q.id).concat([c.q.id])).size,done=sess.list.length-rem;
 let dock='<div class="small" style="text-align:center">1〜4キーで回答／Sキーで発音</div>';
 if(sess.ans){const ok=b.o[sess.pick]===b.a;
  dock=`<div class="fb ${ok?'ok':'ng'}">${ok?'正解':'不正解　正解：'+(isGr(b.a)?g(b.a):b.a)}${b.say?'<button class="btn sub inl" style="float:right;margin:0;padding:3px 10px" data-a="say">🔊 '+g(b.say)+'</button>':''}</div><div class="dd">${b.exp?`<div class="exp">${b.exp}</div>`:''}${b.p?`<div class="exp">${tbl(b.p,b.hl)}</div>`:''}</div><button class="btn" data-a="next">次へ（Enter）</button>`}
 return `<div class="sbody compact"><div class="sh"><button class="btn sub" data-a="home">ホーム</button><span class="small">${sess.label}　残り${rem}問　○${sess.ok} ×${sess.ng}</span></div>${bar(done/sess.list.length)}
 <div class="card"><div class="q">${b.text}</div>${b.o.map((o,k)=>{let cl='opt'+(isGr(o)?' gr':'');if(sess.ans){if(o===b.a)cl+=' ok';else if(k===sess.pick)cl+=' ng'}return `<button class="${cl}" data-a="pick" data-k="${k}">${k+1}. ${o}</button>`}).join('')}</div></div><div class="dock">${dock}</div>`}

function draw(){const lk=V.n==='sess'&&sess&&sess.phase!=='done';$app.className='wrap'+(lk?' s':'');if(document.documentElement)document.documentElement.classList.toggle('lock',lk);$app.innerHTML=V.n==='home'?homeH():V.n==='les'?lesH():sessH()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(a!=='reset')rs=false;
 switch(a){
 case'home':V={n:'home'};sess=null;draw();window.scrollTo(0,0);break;
 case'les':V={n:'les',u:+t.dataset.u};draw();window.scrollTo(0,0);break;
 case'uq':{const u=+t.dataset.u;start(pool(byU(u),12),'単元'+u);break}
 case'today':start(pool(ALLQ.slice().sort((a,b)=>a.u-b.u),12).slice(0,12),'今日の学習');break;
 case'pick':answer(+t.dataset.k);break;
 case'next':go();break;
 case'saytxt':say(t.dataset.t);break;
 case'say':if(sess&&sess.cur&&sess.cur.b.say)say(sess.cur.b.say);break;
 case'saytest':say('ἐν ἀρχῇ ἦν ὁ λόγος');break;
 case'reset':if(rs){S={};sv();rs=false}else rs=true;draw();break;
 }});
document.addEventListener('change',e=>{if(e.target.dataset.c==='pm')setPM(e.target.value)});
document.addEventListener('keydown',e=>{if(V.n!=='sess'||!sess||sess.phase!=='quiz'||!sess.cur)return;
 if(!sess.ans&&'1234'.includes(e.key)&&e.key){const k=+e.key-1;if(k<sess.cur.b.o.length)answer(k)}
 else if(sess.ans&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go()}
 if((e.key==='s'||e.key==='S')&&sess.cur.b.say)say(sess.cur.b.say)});
draw();
</script>
</body>
