<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Index</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;line-height:1.7}
  li{margin:.3rem 0}
  small{color:#888}
  #msg{color:#c00}
</style>
</head>
<body>
<h1>Index</h1>
<p id="msg"></p>
<ul id="list"></ul>
<script>
// https://<owner>.github.io/<repo>/ から自動判定。ローカル確認用に手動値へフォールバック。
const owner = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "8r5nkhzmfv-ctrl";
const repo  = location.hostname.endsWith(".github.io") ? location.pathname.split("/")[1] : "eng-life1";

const list = document.getElementById("list");
const msg  = document.getElementById("msg");

fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1`)
  .then(r => {
    if (!r.ok) throw new Error(r.status === 403 ? "APIの回数制限（60回/時）。時間をおいて再読込" : "取得失敗: " + r.status);
    return r.json();
  })
  .then(d => {
    const files = d.tree
      .filter(f => f.type === "blob" && /\.html$/i.test(f.path) && f.path !== "index.html")
      .map(f => f.path)
      .sort((a, b) => a.localeCompare(b, "ja"));
    if (!files.length) { msg.textContent = "htmlファイルなし"; return; }
    files.forEach(p => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = encodeURI(p);
      a.textContent = p;
      li.appendChild(a);
      list.appendChild(li);
      // <title>があれば表示名に置換（同一オリジン取得のためAPI制限なし）
      fetch(encodeURI(p)).then(r => r.text()).then(t => {
        const m = t.match(/<title>([\s\S]*?)<\/title>/i);
        if (m && m[1].trim()) {
          a.textContent = m[1].trim();
          const s = document.createElement("small");
          s.textContent = " (" + p + ")";
          li.appendChild(s);
        }
      }).catch(() => {});
    });
  })
  .catch(e => { msg.textContent = e.message; });
</script>
</body>
</html>
