<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ヘブル語 文字・母音・単語クイズ（創世記1〜2:3）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17140f; --card:#211d16; --card2:#282318;
    --parchment:#eae0c6; --parchment-dim:#a89b7c;
    --thread:#a1442f; --thread-dim:#5c2a20;
    --gold:#b8935f; --gold-dim:#7a6440;
    --line:#3a3326; --good:#7a8f5c; --bad:#a1442f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at 20% -10%, #241f16 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, #1c1810 0%, transparent 55%), var(--ink);
    color:var(--parchment); font-family:'Noto Sans JP',sans-serif;
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
    padding:24px 14px 64px;
  }
  .app{width:100%;max-width:680px;}
  .heb{font-family:'Noto Sans Hebrew',sans-serif;direction:rtl;unicode-bidi:isolate;}

  .banner{border:1px solid var(--gold-dim);border-radius:6px;padding:14px 16px;margin-bottom:20px;font-size:12px;line-height:1.85;color:var(--parchment-dim);background:rgba(184,147,95,.06);}
  .banner b{color:var(--gold);}
  .banner a{color:var(--gold);}
  .banner ul{margin:8px 0 0;padding-left:18px;}
  .banner .note{margin-top:8px;opacity:.85;}

  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .title{font-family:'Noto Serif JP',serif;font-weight:700;font-size:14px;letter-spacing:.12em;color:var(--gold);}
  .counter{font-size:12px;color:var(--parchment-dim);font-variant-numeric:tabular-nums;}
  .stitches{display:flex;gap:3px;margin:10px 0 24px;}
  .stitch{flex:1;height:3px;background:var(--line);border-radius:1px;}
  .stitch.done{background:var(--thread);}
  .stitch.current{background:var(--gold);}

  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:6px;padding:32px 26px 24px;position:relative;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);}
  .card::before{content:"";position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
  .cat{font-size:11px;letter-spacing:.14em;color:var(--parchment-dim);text-align:center;margin-bottom:16px;text-transform:uppercase;}

  .prompt-ja{font-family:'Noto Serif JP',serif;font-size:17px;font-weight:500;color:var(--parchment);text-align:center;margin-bottom:8px;line-height:1.7;}
  .prompt-sub{font-size:12px;color:var(--parchment-dim);text-align:center;margin-bottom:20px;}
  .prompt-heb{font-family:'Noto Sans Hebrew',sans-serif;direction:rtl;font-weight:500;font-size:32px;color:var(--gold);text-align:center;margin-bottom:6px;line-height:1.5;}
  .prompt-read{font-size:12.5px;color:var(--parchment-dim);text-align:center;margin-bottom:8px;letter-spacing:.02em;}
  .prompt-note{font-size:10.5px;color:var(--parchment-dim);text-align:center;margin-bottom:8px;opacity:.75;}

  .hero{text-align:center;margin-bottom:12px;min-height:60px;display:flex;align-items:center;justify-content:center;}
  .audio-btn{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #c79a5f, #7a5a33 70%);border:1px solid var(--gold-dim);color:var(--ink);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -4px rgba(0,0,0,.6), inset 0 0 0 3px rgba(23,20,15,.25);}
  .audio-btn:active{transform:scale(.94);}
  .audio-btn-slow{width:48px;height:48px;font-size:18px;}
  .audio-btn-sm{width:30px;height:30px;font-size:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #c79a5f, #7a5a33 70%);border:1px solid var(--gold-dim);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .audio-hint{font-size:11px;color:var(--parchment-dim);margin-top:6px;}

  .options{display:grid;gap:9px;}
  .opt{text-align:left;background:transparent;border:1px solid var(--line);color:var(--parchment);padding:12px 14px;border-radius:4px;font-family:'Noto Sans JP',sans-serif;font-size:14.5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;}
  .opt .opt-heb{font-family:'Noto Sans Hebrew',sans-serif;direction:rtl;font-weight:500;font-size:19px;color:var(--gold);text-align:center;}
  .opt .opt-read{font-size:11px;color:var(--parchment-dim);text-align:center;}
  .opt .opt-jp{font-size:14.5px;color:var(--parchment);text-align:center;}
  .opt:hover:not(:disabled){border-color:var(--gold-dim);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good);background:rgba(122,143,92,.14);}
  .opt.wrong{border-color:var(--bad);background:rgba(161,68,47,.14);}
  .opt.reveal{border-color:var(--good);}

  .feedback{margin-top:14px;min-height:20px;font-size:12.5px;text-align:center;color:var(--parchment-dim);}
  .feedback b{color:var(--gold);font-weight:700;}
  .feedback .fb-heb{font-family:'Noto Sans Hebrew',sans-serif;direction:rtl;color:var(--gold);font-size:16px;}
  .feedback .fb-note{display:block;margin-top:6px;font-size:10.5px;opacity:.8;}

  .nextrow{display:flex;justify-content:flex-end;margin-top:16px;}
  .next-btn{background:var(--thread);color:var(--parchment);border:none;padding:10px 22px;border-radius:4px;font-size:13.5px;letter-spacing:.03em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .next-btn.show{opacity:1;pointer-events:auto;}
  .next-btn:hover{background:#b64f37;}

  .center-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:6px;padding:36px 26px;text-align:center;}
  .mark{font-family:'Noto Serif JP',serif;font-style:italic;font-size:30px;color:var(--gold);margin-bottom:8px;}
  h1.headline{font-family:'Noto Serif JP',serif;font-size:20px;margin:0 0 10px;font-weight:700;}
  p.sub{color:var(--parchment-dim);font-size:13px;line-height:1.8;margin:0 0 22px;}

  .primary-btn{background:var(--thread);color:var(--parchment);border:none;padding:13px 30px;border-radius:4px;font-size:14.5px;letter-spacing:.04em;cursor:pointer;}
  .primary-btn:hover{background:#b64f37;}
  .ghost-btn{background:transparent;border:1px solid var(--line);color:var(--parchment-dim);padding:13px 22px;border-radius:4px;font-size:13.5px;cursor:pointer;margin-left:8px;}
  .ghost-btn:hover{border-color:var(--gold-dim);color:var(--parchment);}

  .crumbs{font-size:11px;color:var(--parchment-dim);letter-spacing:.05em;margin-bottom:14px;}
  .choice-row{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;text-align:left;}
  .choice-btn{background:transparent;border:1px solid var(--line);color:var(--parchment);padding:13px 16px;border-radius:4px;font-size:14px;cursor:pointer;text-align:left;}
  .choice-btn:hover{border-color:var(--gold-dim);background:rgba(184,147,95,.08);}
  .choice-btn .cb-sub{display:block;font-size:11px;color:var(--parchment-dim);margin-top:3px;}
  .back-link{background:none;border:none;color:var(--parchment-dim);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;margin-bottom:14px;}

  .score-big{font-family:'Noto Serif JP',serif;font-size:48px;font-weight:700;color:var(--gold);margin:6px 0 2px;}
  .score-label{font-size:12px;color:var(--parchment-dim);letter-spacing:.08em;margin-bottom:22px;}
  .breakdown{text-align:left;border-top:1px solid var(--line);padding-top:16px;}
  .bd-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--parchment-dim);}
  .bd-row b{color:var(--parchment);font-weight:500;}
  .review-list{text-align:left;margin-top:20px;max-height:260px;overflow-y:auto;border-top:1px solid var(--line);padding-top:12px;}
  .review-item{font-size:12px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--parchment-dim);}
  .review-item .rmark{margin-right:6px;}
  .review-item .rprompt{color:var(--parchment);font-family:'Noto Sans Hebrew',sans-serif;}
  .review-item .ra{color:var(--good);}
  .review-item .rw{color:var(--bad);text-decoration:line-through;margin-right:4px;}

  .note-box{font-size:11.5px;color:var(--parchment-dim);line-height:1.75;border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-top:20px;text-align:left;}
  .voice-footer{margin-top:22px;font-size:11.5px;color:var(--parchment-dim);text-align:center;}
  .voice-footer a{color:var(--gold);}

  .menu-grid{display:grid;gap:10px;}
  .menu-card{border:1px solid var(--line);border-radius:6px;padding:16px 18px;text-align:left;background:rgba(255,255,255,.01);cursor:pointer;}
  .menu-card:hover{border-color:var(--gold-dim);}
  .menu-card .mc-title{font-family:'Noto Serif JP',serif;font-size:15px;color:var(--gold);margin-bottom:4px;}
  .menu-card .mc-sub{font-size:12px;color:var(--parchment-dim);}

  table.reftable{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.reftable th{font-size:11px;color:var(--parchment-dim);text-align:left;border-bottom:1px solid var(--line);padding:6px 6px;letter-spacing:.03em;}
  table.reftable td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:middle;}
  table.reftable td.heb{font-family:'Noto Sans Hebrew',sans-serif;direction:rtl;font-size:18px;color:var(--gold);}
  table.reftable td.note{font-size:10.5px;color:var(--parchment-dim);opacity:.85;}
  .tbl-wrap{overflow-x:auto;margin-top:10px;}
  .tbl-title{font-family:'Noto Serif JP',serif;font-size:15px;color:var(--gold);margin:18px 0 4px;}

  .hidden{display:none !important;}
  @media (max-width:480px){ .card,.center-card{padding:24px 16px 20px;} }
</style>
</head>
<body>
<div class="app">

  <!-- START SCREEN -->
  <div id="screen-start" class="center-card">
    <div class="mark heb" style="font-size:24px;">בראשית</div>

<script>
/* ============ 発話 ============ */
function speakHebrew(text, rate){
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      const u = new SpeechSynthesisUtterance(text);
      const voices = speechSynthesis.getVoices();
      const heVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('he'));
      if(heVoice) u.voice = heVoice;
      u.lang = 'he-IL';
      u.rate = rate || 0.9;
      speechSynthesis.speak(u);
    }, 80);
  }catch(e){ /* 非対応環境：無音のまま表記のみで学習継続 */ }
}

/* ============ データ：1️⃣ 文字 ============ */
const LETTERS22 = [
 {heb:'א',roman:'alef',kana:'アレフ'},{heb:'ב',roman:'bet',kana:'ベート'},
 {heb:'ג',roman:'gimel',kana:'ギメル'},{heb:'ד',roman:'dalet',kana:'ダレット'},
 {heb:'ה',roman:'he',kana:'ヘー'},{heb:'ו',roman:'vav',kana:'ヴァヴ'},
 {heb:'ז',roman:'zayin',kana:'ザイン'},{heb:'ח',roman:'het',kana:'ヘット'},
 {heb:'ט',roman:'tet',kana:'テット'},{heb:'י',roman:'yod',kana:'ヨッド'},
 {heb:'כ',roman:'kaf',kana:'カフ'},{heb:'ל',roman:'lamed',kana:'ラメッド'},
 {heb:'מ',roman:'mem',kana:'メム'},{heb:'נ',roman:'nun',kana:'ヌン'},
 {heb:'ס',roman:'samekh',kana:'サメフ'},{heb:'ע',roman:'ayin',kana:'アイン'},
 {heb:'פ',roman:'pe',kana:'ペー'},{heb:'צ',roman:'tsadi',kana:'ツァディ'},
 {heb:'ק',roman:'qof',kana:'コフ'},{heb:'ר',roman:'resh',kana:'レーシュ'},
 {heb:'ש',roman:'shin',kana:'シン'},{heb:'ת',roman:'tav',kana:'タヴ'}
].map(x=>({...x, mean:x.kana, group:'letters22'}));

const SOFIT = [
 {heb:'ך',roman:'khaf sofit',kana:'カフ・ソフィート',mean:'כ（カフ）の語末形'},
 {heb:'ם',roman:'mem sofit',kana:'メム・ソフィート',mean:'מ（メム）の語末形'},
 {heb:'ן',roman:'nun sofit',kana:'ヌン・ソフィート',mean:'נ（ヌン）の語末形'},
 {heb:'ף',roman:'fe sofit',kana:'ペー・ソフィート',mean:'פ（ペー）の語末形'},
 {heb:'ץ',roman:'tsadi sofit',kana:'ツァディ・ソフィート',mean:'צ（ツァディ）の語末形'}
].map(x=>({...x, group:'sofit'}));

const BEGADKEFAT = [
 {heb:'בּ',roman:'b',kana:'ベー（ダゲシュ有）',mean:'ב＋ダゲシュ＝b音',group:'bet'},
 {heb:'ב',roman:'v',kana:'ヴェー（ダゲシュ無）',mean:'ב（ダゲシュ無）＝v音',group:'bet'},
 {heb:'כּ',roman:'k',kana:'カフ（ダゲシュ有）',mean:'כ＋ダゲシュ＝k音',group:'kaf'},
 {heb:'כ',roman:'kh',kana:'ハフ（ダゲシュ無）',mean:'כ（ダゲシュ無）＝kh音',group:'kaf'},
 {heb:'פּ',roman:'p',kana:'ペー（ダゲシュ有）',mean:'פ＋ダゲシュ＝p音',group:'pe'},
 {heb:'פ',roman:'f',kana:'フェー（ダゲシュ無）',mean:'פ（ダゲシュ無）＝f音',group:'pe'},
 {heb:'שׁ',roman:'sh',kana:'シン（右点）',mean:'שׁ＝sh音（右上の点）',group:'shin'},
 {heb:'שׂ',roman:'s',kana:'シン（左点）',mean:'שׂ＝s音（左上の点）',group:'shin'},
 {heb:'גּ',roman:'g',kana:'ギメル（ダゲシュ有）',mean:'ג＋ダゲシュ　※現代ヘブライ語では無ダゲシュ時と同音',group:'gdt',note:'現代ヘブライ語では同音'},
 {heb:'דּ',roman:'d',kana:'ダレット（ダゲシュ有）',mean:'ד＋ダゲシュ　※現代ヘブライ語では無ダゲシュ時と同音',group:'gdt',note:'現代ヘブライ語では同音'},
 {heb:'תּ',roman:'t',kana:'タヴ（ダゲシュ有）',mean:'ת＋ダゲシュ　※現代ヘブライ語では無ダゲシュ時と同音',group:'gdt',note:'現代ヘブライ語では同音'}
];

const SIMILAR = [
 {heb:'ב',roman:'bet/vet',kana:'ベート',group:'bk'},{heb:'כ',roman:'kaf',kana:'カフ',group:'bk'},
 {heb:'ד',roman:'dalet',kana:'ダレット',group:'dr'},{heb:'ר',roman:'resh',kana:'レーシュ',group:'dr'},
 {heb:'ה',roman:'he',kana:'ヘー',group:'hh'},{heb:'ח',roman:'het',kana:'ヘット',group:'hh',note:'現代ヘブライ語ではכ（無点）と同音になる場合あり（推定：地域・話者差あり）'},
 {heb:'ו',roman:'vav',kana:'ヴァヴ',group:'vzn'},{heb:'ז',roman:'zayin',kana:'ザイン',group:'vzn'},{heb:'ן',roman:'nun sofit',kana:'ヌン・ソフィート',group:'vzn'},
 {heb:'מ',roman:'mem',kana:'メム',group:'mm'},{heb:'ם',roman:'mem sofit',kana:'メム・ソフィート',group:'mm'},
 {heb:'נ',roman:'nun',kana:'ヌン',group:'nn'},{heb:'ן',roman:'nun sofit',kana:'ヌン・ソフィート',group:'nn'},
 {heb:'ע',roman:'ayin',kana:'アイン',group:'ac'},{heb:'צ',roman:'tsadi',kana:'ツァディ',group:'ac'},
 {heb:'פ',roman:'pe',kana:'ペー',group:'pf'},{heb:'ף',roman:'fe sofit',kana:'ペー・ソフィート',group:'pf'},
 {heb:'צ',roman:'tsadi',kana:'ツァディ',group:'tz'},{heb:'ץ',roman:'tsadi sofit',kana:'ツァディ・ソフィート',group:'tz'}
].map(x=>({...x, mean:x.kana}));

const SYMBOL = [
 {heb:'א',mean:'牛（推定・伝統的解釈、諸説あり）'},{heb:'ב',mean:'家（伝統的解釈）'},
 {heb:'ג',mean:'ラクダ（伝統的解釈）'},{heb:'ד',mean:'扉（伝統的解釈）'},
 {heb:'ה',mean:'窓／見よ（諸説あり）'},{heb:'ו',mean:'釘・フック（伝統的解釈）'},
 {heb:'ז',mean:'武器（諸説あり）'},{heb:'ח',mean:'柵・壁（伝統的解釈）'},
 {heb:'ט',mean:'蛇（諸説あり・不確か）'},{heb:'י',mean:'手・腕（伝統的解釈）'},
 {heb:'כ',mean:'手のひら（伝統的解釈）'},{heb:'ל',mean:'牛追い棒（伝統的解釈）'},
 {heb:'מ',mean:'水（伝統的解釈）'},{heb:'נ',mean:'魚（伝統的解釈）'},
 {heb:'ס',mean:'支え（諸説あり）'},{heb:'ע',mean:'目（伝統的解釈）'},
 {heb:'פ',mean:'口（伝統的解釈）'},{heb:'צ',mean:'釣針（諸説あり）'},
 {heb:'ק',mean:'後頭部／地平線（諸説あり・不確か）'},{heb:'ר',mean:'頭（伝統的解釈）'},
 {heb:'ש',mean:'歯（伝統的解釈）'},{heb:'ת',mean:'印・しるし（伝統的解釈）'}
].map((x,i)=>({...x, roman:LETTERS22[i].roman, kana:LETTERS22[i].kana, group:'symbol'}));

/* ============ データ：2️⃣ 母音 ============ */
const VOWELPTS = [
 {heb:'בָ',roman:'a (kamatz)',kana:'カメツ',mean:'長母音a　※現代ヘブライ語では短aと同音',group:'a',note:'現代ヘブライ語では同音'},
 {heb:'בַ',roman:'a (patach)',kana:'パタハ',mean:'短母音a',group:'a'},
 {heb:'בֵ',roman:'e (tsere)',kana:'ツェレー',mean:'長母音e',group:'e'},

/* ============ ユーティリティ ============ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function readStr(item){ return item.roman+'／'+item.kana; }
function pickDistractors(pool, correct, n){
  const sameGroup = pool.filter(x=>x!==correct && correct.group && x.group===correct.group);
  const rest = pool.filter(x=>x!==correct && !sameGroup.includes(x));
  const chosen = shuffle(sameGroup).slice(0,n);
  if(chosen.length<n){ chosen.push(...shuffle(rest).slice(0, n-chosen.length)); }
  return chosen;
}

/* ============ クイズエンジン ============ */
let quizState = {};
function startQuiz(catKey,direction,format,count){
  const cat = CATS[catKey];
  const pool = cat.items;
  const order = shuffle(pool.map((_,i)=>i)).slice(0,count);
  quizState = {catKey, pool, order, current:0, score:0, results:[], direction, format, answered:false};
  hideAll(); document.getElementById('screen-quiz').classList.remove('hidden');
  document.getElementById('quiz-title').textContent = cat.label;
  document.getElementById('qtotal').textContent = order.length;
  const st = document.getElementById('stitches'); st.innerHTML='';
  order.forEach(()=>{ const s=document.createElement('div'); s.className='stitch'; st.appendChild(s); });
  renderQuestion();
}
function renderQuestion(){
  quizState.answered = false;
  const {pool, order, current, direction, format} = quizState;
  const q = pool[order[current]];
  document.getElementById('qnum').textContent = current+1;
  document.querySelectorAll('.stitch').forEach((s,i)=>{
    s.classList.toggle('done', i<current);
    s.classList.toggle('current', i===current);
  });
  document.getElementById('q-cat').textContent = CATS[quizState.catKey].label + '（' + (direction==='h2j'?'ヘブル語→日本語':'日本語→ヘブル語') + (format==='listening'?'・リスニング':'・リーディング') + '）';

  const promptWrap = document.getElementById('q-prompt-wrap');
  const hero = document.getElementById('q-hero');
  promptWrap.innerHTML=''; hero.innerHTML='';

  const isH2J = direction==='h2j';
  const isListening = format==='listening';
  const isWordCat = quizState.catKey==='3ab';

  if(isH2J){
    if(isListening){
      const col = document.createElement('div');
      const row = document.createElement('div'); row.style.cssText='display:flex;gap:12px;align-items:center;justify-content:center;';
      const btn=document.createElement('button'); btn.className='audio-btn'; btn.textContent='🔊';
      btn.onclick=()=>speakHebrew(q.heb,0.9);
      const slow=document.createElement('button'); slow.className='audio-btn audio-btn-slow'; slow.textContent='🐢'; slow.title='ゆっくり再生';
      slow.onclick=()=>speakHebrew(q.heb,0.45);
      row.appendChild(btn); row.appendChild(slow);
      const hint=document.createElement('div'); hint.className='audio-hint'; hint.textContent='タップして発音を聞く（🐢=ゆっくり）';
      col.appendChild(row); col.appendChild(hint);
      hero.appendChild(col);
      setTimeout(()=>speakHebrew(q.heb,0.9),300);
      const sub=document.createElement('div'); sub.className='prompt-sub'; sub.textContent = isWordCat ? '聞こえた発音はどれ？' : '聞こえたものの意味はどれ？';
      promptWrap.appendChild(sub);
    } else {
      const hebEl=document.createElement('div'); hebEl.className='prompt-heb'; hebEl.textContent=q.heb;
      const sub=document.createElement('div'); sub.className='prompt-sub'; sub.textContent = isWordCat ? 'この発音はどれ？' : 'この意味はどれ？';
      promptWrap.appendChild(hebEl);
      promptWrap.appendChild(sub);
    }
  } else {
    const jaEl=document.createElement('div'); jaEl.className='prompt-ja'; jaEl.textContent=q.mean;
    const sub=document.createElement('div'); sub.className='prompt-sub';
    sub.textContent = 'これに合うヘブル語はどれ？';
    promptWrap.appendChild(jaEl); promptWrap.appendChild(sub);
  }

  const distractors = pickDistractors(pool, q, 3);
  const currentOptions = shuffle([
    {item:q, correct:true},
    ...distractors.map(d=>({item:d, correct:false}))
  ]);

  const optWrap = document.getElementById('q-options'); optWrap.innerHTML='';
  currentOptions.forEach(opt=>{
    const b=document.createElement('button'); b.className='opt';
    if(isH2J){
      if(isWordCat){
        const rd=document.createElement('span'); rd.className='opt-jp'; rd.textContent=readStr(opt.item);
        b.appendChild(rd);
      } else {
        const jp=document.createElement('span'); jp.className='opt-jp'; jp.textContent=opt.item.mean;
        b.appendChild(jp);
      }
    } else {
      const heb=document.createElement('span'); heb.className='opt-heb'; heb.textContent=opt.item.heb;
      const read=document.createElement('span'); read.className='opt-read'; read.textContent=readStr(opt.item);
      b.appendChild(heb); b.appendChild(read);
    }
    b.onclick=()=>selectOption(b,opt,q);
    optWrap.appendChild(b);
  });

  document.getElementById('q-feedback').innerHTML='';
  document.getElementById('next-btn').classList.remove('show');
}
function selectOption(btn,opt,q){
  if(quizState.answered) return;
  quizState.answered = true;
  const isH2J = quizState.direction==='h2j';
  const isWordCat = quizState.catKey==='3ab';
  document.querySelectorAll('#q-options .opt').forEach(b=>b.disabled=true);
  const fb = document.getElementById('q-feedback');
  if(opt.correct){
    btn.classList.add('correct'); quizState.score++;
    fb.innerHTML='<b>正解。</b>';
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('#q-options .opt').forEach(b=>{
      const isCorrectBtn = isH2J
        ? (b.querySelector('.opt-jp') && b.querySelector('.opt-jp').textContent===(isWordCat?readStr(q):q.mean))
        : (b.querySelector('.opt-heb') && b.querySelector('.opt-heb').textContent===q.heb);
      if(isCorrectBtn) b.classList.add('reveal');
    });
    if(isH2J){
      fb.innerHTML = isWordCat ? ('不正解。正解: <b>'+readStr(q)+'</b>') : ('不正解。正解: <b>'+q.mean+'</b>');
    } else {
      fb.innerHTML = '不正解。正解: <b class="fb-heb">'+q.heb+'</b>　'+readStr(q);
    }
  }
  if(!isH2J || quizState.format!=='listening'){
    fb.innerHTML += '<div style="margin-top:8px;" class="fb-heb">'+q.heb+'　<span style="color:var(--parchment-dim);font-size:11px;">'+readStr(q)+'</span></div>';
  }
  if(isWordCat){ fb.innerHTML += '<div style="margin-top:4px;font-size:12px;color:var(--parchment-dim);">意味: '+q.mean+'</div>'; }
  if(q.note){ fb.innerHTML += '<span class="fb-note">※'+q.note+'</span>'; }
  if(q.ref){ fb.innerHTML += '<div style="margin-top:4px;font-size:11px;color:var(--parchment-dim);">'+q.ref+'</div>'; }

  quizState.results.push({heb:q.heb, mean:q.mean, chosenMean:opt.item.mean, chosenHeb:opt.item.heb, correct:opt.correct});
  document.getElementById('next-btn').classList.add('show');
}
function nextQuestion(){
  quizState.current++;
  if(quizState.current>=quizState.order.length) showResult();
  else renderQuestion();
}
function showResult(){
  hideAll(); document.getElementById('screen-result').classList.remove('hidden');
  document.getElementById('score-num').textContent = quizState.score;
  document.getElementById('score-total').textContent = quizState.order.length;
  const pct = Math.round((quizState.score/quizState.order.length)*100);
  document.getElementById('score-pct').textContent = '正答率 '+pct+'%';
  const bd = document.getElementById('breakdown'); bd.innerHTML='';
  const row=document.createElement('div'); row.className='bd-row';
  row.innerHTML = '<span>'+CATS[quizState.catKey].label+'</span><b>'+quizState.score+' / '+quizState.order.length+'</b>';
  bd.appendChild(row);
  const rl = document.getElementById('review-list'); rl.innerHTML='';
  quizState.results.forEach(r=>{
    const item=document.createElement('div'); item.className='review-item';
    if(r.correct){
      item.innerHTML = '<span class="rmark">✅</span><span class="rprompt">'+r.heb+'</span>　<span class="ra">'+r.mean+'</span>';
    } else {
      item.innerHTML = '<span class="rmark">❌</span><span class="rprompt">'+r.heb+'</span>　'+
        '<span class="rw">'+(r.chosenMean||r.chosenHeb)+'</span><span class="ra">→ '+r.mean+'</span>';
    }
    rl.appendChild(item);
  });
}

/* ============ 4️⃣ 参照表 ============ */
function showRefMenu(){
  hideAll(); document.getElementById('screen-ref').classList.remove('hidden');
  const panel = document.getElementById('ref-panel');
  panel.innerHTML = '<div class="crumbs">メニュー ＞ 4️⃣文字表</div><h1 class="headline" style="text-align:left;">参照用の表（出題なし）</h1>';
  const row = document.createElement('div'); row.className='choice-row';
  [
    {v:'a',label:'a. 文字表',sub:'22文字・ソフィート・ダゲシュ・שׁ/שׂ・象徴'},
    {v:'b',label:'b. 母音表',sub:'長短母音・半母音・シュワー・ハテフ・ユッド/ヴァヴ'},
    {v:'c',label:'c. 単語表',sub:'3️⃣で使用した全21語'}
  ].forEach(o=>{
    const b=document.createElement('button'); b.className='choice-btn';
    b.innerHTML = o.label+'<span class="cb-sub">'+o.sub+'</span>';
    b.onclick=()=>renderRefTable(o.v);
    row.appendChild(b);
  });
  panel.appendChild(row);
}
function audioCell(text){
  return '<button class="audio-btn-sm" onclick="speakHebrew(\''+text.replace(/'/g,"\\'")+'\')">🔊</button>';
}
function renderRefTable(which){
  const panel = document.getElementById('ref-panel');
  panel.innerHTML = '<button class="back-link" onclick="showRefMenu()">← 表選択に戻る</button>';
  if(which==='a'){
    panel.innerHTML += '<h1 class="headline" style="text-align:left;">a. 文字表</h1><div class="note-box">※現代ヘブライ語ではח／כ（無点）、ת／ט、ע／א が同音になる場合がある（推定：地域・話者差あり）。象徴は伝統的解釈で諸説あり。</div>';
    const wrap=document.createElement('div'); wrap.className='tbl-wrap';
    let html='<table class="reftable"><tr><th>文字</th><th>ソフィート</th><th>読み</th><th>象徴</th><th>音声</th></tr>';
    LETTERS22.forEach((l,i)=>{
      const sof = SOFIT.find(s=>s.mean.includes(l.kana)) ;
      html += '<tr><td class="heb">'+l.heb+'</td><td class="heb">'+(sof?sof.heb:'—')+'</td><td>'+readStr(l)+'</td><td class="note">'+SYMBOL[i].mean+'</td><td>'+audioCell(l.heb)+'</td></tr>';
    });
    html += '</table>';
    wrap.innerHTML = html; panel.appendChild(wrap);
    const wrap2=document.createElement('div'); wrap2.className='tbl-wrap';
    let html2 = '<div class="tbl-title">発音の変わる子音（בכפ・שׁ/שׂ）</div><table class="reftable"><tr><th>文字</th><th>読み</th><th>説明</th><th>音声</th></tr>';
    BEGADKEFAT.forEach(b=>{ html2 += '<tr><td class="heb">'+b.heb+'</td><td>'+readStr(b)+'</td><td class="note">'+b.mean+'</td><td>'+audioCell(b.heb)+'</td></tr>'; });
    html2 += '</table>';
    wrap2.innerHTML = html2; panel.appendChild(wrap2);
  }
  if(which==='b'){
    panel.innerHTML += '<h1 class="headline" style="text-align:left;">b. 母音表</h1><div class="note-box">※カメツとパタハは現代ヘブライ語では同音（正書法上のみ区別）。</div>';
    const wrap=document.createElement('div'); wrap.className='tbl-wrap';
    let html='<div class="tbl-title">母音記号</div><table class="reftable"><tr><th>記号</th><th>読み</th><th>説明</th><th>音声</th></tr>';
    VOWELPTS.forEach(v=>{ html += '<tr><td class="heb">'+v.heb+'</td><td>'+readStr(v)+'</td><td class="note">'+v.mean+'</td><td>'+audioCell(v.heb)+'</td></tr>'; });
    html += '</table>';
    wrap.innerHTML=html; panel.appendChild(wrap);
    const wrap2=document.createElement('div'); wrap2.className='tbl-wrap';
    let html2='<div class="tbl-title">シュワー／合成シュワー</div><table class="reftable"><tr><th>語</th><th>読み</th><th>説明</th><th>音声</th></tr>';
    [...SHVA,...CHATEPH].forEach(v=>{ html2 += '<tr><td class="heb">'+v.heb+'</td><td>'+readStr(v)+'</td><td class="note">'+v.mean+'</td><td>'+audioCell(v.heb)+'</td></tr>'; });
    html2 += '</table>';
    wrap2.innerHTML=html2; panel.appendChild(wrap2);
    const wrap3=document.createElement('div'); wrap3.className='tbl-wrap';
    let html3='<div class="tbl-title">アクセント（強勢位置）</div><table class="reftable"><tr><th>語</th><th>読み</th><th>説明</th><th>音声</th></tr>';
    ACCENT.forEach(v=>{ html3 += '<tr><td class="heb">'+v.heb+'</td><td>'+readStr(v)+'</td><td class="note">'+v.mean+'</td><td>'+audioCell(v.heb)+'</td></tr>'; });
    html3 += '</table>';
    wrap3.innerHTML=html3; panel.appendChild(wrap3);
  }
  if(which==='c'){
    panel.innerHTML += '<h1 class="headline" style="text-align:left;">c. 単語表</h1><div class="note-box">創世記1:1〜2:3本文の語（14）＋本文外の著名語（7）、計21語。</div>';
    const wrap=document.createElement('div'); wrap.className='tbl-wrap';
    let html='<table class="reftable"><tr><th>単語</th><th>読み</th><th>意味</th><th>出典</th><th>音声</th></tr>';
    WORDS21.forEach(w=>{ html += '<tr><td class="heb">'+w.heb+'</td><td>'+readStr(w)+'</td><td>'+w.mean+'</td><td class="note">'+w.ref+'</td><td>'+audioCell(w.heb)+'</td></tr>'; });
    html += '</table>';
    wrap.innerHTML=html; panel.appendChild(wrap);
  }
}

showStart();
</script>
