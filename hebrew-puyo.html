<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヘブル文字ぷよ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--fg:#222;--card:#fff;--bd:#d8d2c4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--fg:#eee;--card:#20232b;--bd:#343844}}
:root[data-theme="dark"]{--bg:#15171c;--fg:#eee;--card:#20232b;--bd:#343844}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;justify-content:center;padding:12px}
.wrap{display:flex;gap:12px;align-items:flex-start;max-width:460px;width:100%}
#board{width:min(62vw,270px);aspect-ratio:1/2;background:var(--card);border:2px solid var(--bd);border-radius:8px;touch-action:none}
.side{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.box{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:13px}
#next{width:56px;height:112px;display:block;margin:4px auto 0}
.big{font-size:22px;font-weight:700}
.leg div{display:flex;align-items:center;gap:6px;margin:2px 0}
.leg b{display:inline-block;width:22px;height:22px;border-radius:50%;color:#fff;text-align:center;line-height:22px;font-family:"Noto Serif Hebrew","Times New Roman",serif}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:12px 0;font-size:18px;touch-action:manipulation}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#msg{min-height:1.3em;font-weight:700;color:#e5484d}
</style></head><body>
<div class="wrap">
<canvas id="board" width="240" height="480"></canvas>
<div class="side">
<div class="box">スコア<div class="big" id="sc">0</div><div id="msg"></div></div>
<div class="box">NEXT<canvas id="next" width="40" height="80"></canvas></div>
<div class="box leg">
<div><b style="background:#e5484d">א</b>アレフ</div>
<div><b style="background:#3b82f6">ב</b>ベート</div>
<div><b style="background:#30a46c">ג</b>ギメル</div>
<div><b style="background:#d99a00">ד</b>ダレット</div>
</div>
<button id="rs">↺ 最初から</button>
<div class="box" style="font-size:11px">盤面を<b>タップ</b>＝右回転<br><b>左右になぞる</b>＝その列へ移動<br><b>下へ払う</b>＝即落下<br>同じ文字4つ以上で消える</div>
</div></div>
<script>
const C=6,R=12,S=40,col=['','#e5484d','#3b82f6','#30a46c','#d99a00'],ch=['','א','ב','ג','ד'];
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const cv=document.getElementById('board'),cx=cv.getContext('2d'),nv=document.getElementById('next'),nx=nv.getContext('2d');
let g,cur,nxt,score,busy,over,acc,last,mark;
const rnd=()=>1+Math.floor(Math.random()*4);
const np=()=>({a:rnd(),b:rnd()});
function init(){g=Array.from({length:R},()=>Array(C).fill(0));score=0;busy=false;over=false;acc=0;mark=null;nxt=np();spawn();msg('');upd()}
function msg(t){document.getElementById('msg').textContent=t}
function upd(){document.getElementById('sc').textContent=score}
function free(x,y){return x>=0&&x<C&&y<R&&(y<0||!g[y][x])}
function valid(x,y,r){return free(x,y)&&free(x+DX[r],y+DY[r])}
function spawn(){cur={x:2,y:1,r:0,a:nxt.a,b:nxt.b};nxt=np();if(!valid(cur.x,cur.y,cur.r)){over=true;msg('ゲームオーバー タップで再開')}}
function mv(dx){if(!busy&&!over&&valid(cur.x+dx,cur.y,cur.r))cur.x+=dx}
function rot(d){if(busy||over)return;const r=(cur.r+d+4)%4;
 if(valid(cur.x,cur.y,r))cur.r=r;
 else{const kx=-DX[r];if(valid(cur.x+kx,cur.y,r)){cur.x+=kx;cur.r=r}else if(r%2==0&&valid(cur.x,cur.y-1,r)){cur.y--;cur.r=r}}}
function step(){if(busy||over)return false;
 if(valid(cur.x,cur.y+1,cur.r)){cur.y++;return true}
 lock();return false}
function lock(){
 [[cur.x,cur.y,cur.a],[cur.x+DX[cur.r],cur.y+DY[cur.r],cur.b]].forEach(([x,y,c])=>{if(y>=0)g[y][x]=c});
 busy=true;resolve(1)}
function gravity(){for(let x=0;x<C;x++){let w=R-1;for(let y=R-1;y>=0;y--)if(g[y][x]){const v=g[y][x];g[y][x]=0;g[w][x]=v;w--}}}
function find(){const seen=Array.from({length:R},()=>Array(C).fill(false)),out=[];
 for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(!g[y][x]||seen[y][x])continue;
  const c=g[y][x],q=[[x,y]],grp=[];seen[y][x]=true;
  while(q.length){const [a,b]=q.pop();grp.push([a,b]);
   for(let d=0;d<4;d++){const u=a+DX[d],v=b+DY[d];if(u>=0&&u<C&&v>=0&&v<R&&!seen[v][u]&&g[v][u]===c){seen[v][u]=true;q.push([u,v])}}}
  if(grp.length>=4)out.push(grp)}
 return out}
function resolve(n){gravity();const gs=find();
 if(!gs.length){busy=false;if(n>1)msg('');spawn();return}
 const cells=gs.flat();mark=cells;
 const bonus=[0,0,8,16,32,64,96,128,160][Math.min(n,8)]||160;
 score+=cells.length*10*Math.max(1,bonus);upd();
 msg(n+'連鎖！');
 setTimeout(()=>{cells.forEach(([x,y])=>g[y][x]=0);mark=null;setTimeout(()=>resolve(n+1),150)},350)}
function piece(c,x,y,s,k,a){const r=s/2-2;
 c.globalAlpha=a;const gr=c.createRadialGradient(x+s/2-r/3,y+s/2-r/3,r/6,x+s/2,y+s/2,r);
 gr.addColorStop(0,'#fff8');gr.addColorStop(.25,col[k]);gr.addColorStop(1,col[k]);
 c.fillStyle=gr;c.beginPath();c.arc(x+s/2,y+s/2,r,0,7);c.fill();
 c.fillStyle='#fff';c.font='bold '+Math.round(s*.55)+'px "Noto Serif Hebrew","Times New Roman",serif';
 c.textAlign='center';c.textBaseline='middle';c.fillText(ch[k],x+s/2,y+s/2+s*.04);c.globalAlpha=1}
function draw(t){
 cx.clearRect(0,0,240,480);
 for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(g[y][x]){
  const m=mark&&mark.some(p=>p[0]==x&&p[1]==y);
  piece(cx,x*S,y*S,S,g[y][x],m&&(Math.floor(t/60)%2)?.35:1)}
 if(!busy&&!over){piece(cx,cur.x*S,cur.y*S,S,cur.a,1);piece(cx,(cur.x+DX[cur.r])*S,(cur.y+DY[cur.r])*S,S,cur.b,1)}
 nx.clearRect(0,0,40,80);piece(nx,0,0,40,nxt.b,1);piece(nx,0,40,40,nxt.a,1)}
function loop(t){const dt=t-(last||t);last=t;acc+=dt;
 const iv=Math.max(120,700-Math.floor(score/3000)*60);
 if(acc>iv){acc=0;step()}
 draw(t);requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&over)return init();
 const k=e.key;
 if(k==='ArrowLeft')mv(-1);else if(k==='ArrowRight')mv(1);
 else if(k==='ArrowDown'){if(step())score++,upd();acc=0}
 else if(k==='ArrowUp'||k==='x'||k==='X')rot(1);else if(k==='z'||k==='Z')rot(-1);
 else return;e.preventDefault()});
const B=(id,f)=>document.getElementById(id).addEventListener('click',f);
B('rs',init);
function hard(){if(busy||over)return;let n=0;while(valid(cur.x,cur.y+1,cur.r)){cur.y++;n++}score+=n;upd();lock()}
let pd=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pd={x:e.clientX,y:e.clientY,c:cur.x,m:false};e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!pd)return;const w=cv.getBoundingClientRect().width/C,dx=e.clientX-pd.x;
 if(Math.abs(dx)>w*.4)pd.m=true;if(!pd.m)return;
 const t=Math.max(0,Math.min(C-1,pd.c+Math.round(dx/w)));
 while(cur.x<t&&valid(cur.x+1,cur.y,cur.r))cur.x++;
 while(cur.x>t&&valid(cur.x-1,cur.y,cur.r))cur.x--});
cv.addEventListener('pointerup',e=>{if(!pd)return;const w=cv.getBoundingClientRect().width/C,dx=e.clientX-pd.x,dy=e.clientY-pd.y;
 if(over){init()}
 else if(dy>w*1.2&&Math.abs(dx)<w)hard();
 else if(!pd.m&&Math.abs(dy)<w*.5)rot(1);
 pd=null});
cv.addEventListener('pointercancel',()=>{pd=null});
init();requestAnimationFrame(loop);
</script></body></html>
