<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヘブル文字ツムツム タップ破壊ゲーム</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@700&display=swap">
<style>
:root {
  --bg: #121829;
  --panel: #1e2642;
  --fg: #f0f3ff;
  --mut: #8b97c6;
  --accent: #f2b84b;
  --danger: #ef5350;
  --card-bg: rgba(30, 38, 66, 0.95);
  --tsum-bg: #2d3861; /* 全ツム共通の背景色 */
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  touch-action: none;
  user-select: none;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: radial-gradient(circle at center, #232c4e 0%, #121829 100%);
  touch-action: none;
}

/* HUD Overlay */
#hud {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  font-size: 16px;
  font-weight: 700;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(18, 24, 41, 0.9) 0%, rgba(18, 24, 41, 0) 100%);
  z-index: 10;
}

#hud > * {
  pointer-events: auto;
}

.hud-item {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(30, 38, 66, 0.8);
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
}

.hud-val {
  color: var(--accent);
  font-size: 18px;
}

.btn-group {
  display: flex;
  gap: 6px;
}

.btn-s {
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  border: 0;
  border-radius: 999px;
  background: #323d6b;
  color: #fff;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.btn-s:hover {
  background: #414e88;
}

.btn-s:active {
  transform: scale(0.95);
}

.btn-cancel {
  background: var(--danger);
  color: #fff;
  font-size: 14px;
  padding: 8px 16px;
  box-shadow: 0 0 12px rgba(239, 83, 80, 0.5);
  display: none;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.btn-cancel:hover {
  background: #f44336;
}

/* Info Bar */
#info-bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding: 10px 20px;
  color: var(--fg);
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  pointer-events: none;
  background: rgba(30, 38, 66, 0.85);
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  z-index: 10;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  white-space: nowrap;
}

/* Modals & Screens */
#ov {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: rgba(18, 24, 41, 0.92);
  backdrop-filter: blur(10px);
  text-align: center;
  padding: 24px;
  z-index: 20;
}

.card {
  background: var(--card-bg);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 24px;
  padding: 32px 28px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

#ov h1 {
  margin: 0;
  font-size: 26px;
  color: var(--accent);
  text-shadow: 0 2px 10px rgba(242, 184, 75, 0.3);
}

#ov p {
  margin: 0;
  color: var(--fg);
  font-size: 15px;
  line-height: 1.6;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 6px 0;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(0,0,0,0.25);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 13px;
}

.legend-char {
  font-family: "Noto Serif Hebrew", serif;
  font-weight: bold;
  font-size: 16px;
}

.time-res {
  font-size: 32px;
  color: var(--accent);
  font-weight: 800;
  margin: 10px 0;
  text-shadow: 0 0 15px rgba(242, 184, 75, 0.4);
}

.btn-main {
  font: inherit;
  font-weight: 800;
  padding: 14px 36px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #f2b84b 0%, #e59a22 100%);
  color: #121829;
  cursor: pointer;
  font-size: 17px;
  box-shadow: 0 4px 15px rgba(242, 184, 75, 0.4);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  width: 100%;
}

.btn-main:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(242, 184, 75, 0.6);
}

.btn-main:active {
  transform: translateY(1px);
}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<!-- HUD Header -->
<div id="hud">
  <div class="hud-item">
    <span>時間</span>
    <b id="tm" class="hud-val">60.0</b>s
  </div>
  <div class="hud-item">
    <span>残り</span>
    <b id="rem-cnt" class="hud-val">0</b>
  </div>
  <div id="target-badge" class="target-badge">
    <span id="target-char" class="target-char"></span>
    <span id="target-count"></span>
  </div>
  <button id="cancel-btn" class="btn-s btn-cancel">解除</button>
  <div class="btn-group">
    <button id="mu" class="btn-s">音ON</button>
  </div>
</div>

<!-- Start / Game Over Modal -->
<div id="ov">
  <div class="card">
    <h1 id="ov-title">ヘブル文字タップ破砕</h1>
    <p id="ov-msg">全27文字からランダムに5文字が選ばれます。<br>最初にタップした文字のツムをすべて見つけてタップ破砕しよう！</p>

    <button id="g0" class="btn-main">スタート</button>
  </div>
</div>

<script>
// 全27文字（基本22文字 + ソフィート5文字）のマスターデータ
const HEBREW_ALL = [
  { char: "א", name: "アレフ" },
  { char: "ב", name: "ベート" },
  { char: "ג", name: "ギメル" },
  { char: "ד", name: "ダレット" },
  { char: "ה", name: "ヘー" },
  { char: "ו", name: "ヴァヴ" },
  { char: "ז", name: "ザイン" },
  { char: "ח", name: "ヘット" },
  { char: "ט", name: "テット" },
  { char: "י", name: "ヨッド" },
  { char: "כ", name: "カフ" },
  { char: "ל", name: "ラメド" },
  { char: "מ", name: "メム" },
  { char: "נ", name: "ヌン" },
  { char: "ס", name: "サメフ" },
  { char: "ע", name: "アイン" },
  { char: "פ", name: "ペー" },
  { char: "צ", name: "ツァディ" },
  { char: "ק", name: "コフ" },
  { char: "ר", name: "レーシュ" },
  { char: "ש", name: "シン" },
  { char: "ת", name: "タヴ" },
  // ソフィート 5文字
  { char: "ך", name: "カフ・ソフィート" },
  { char: "ם", name: "メム・ソフィート" },
  { char: "ן", name: "ヌン・ソフィート" },
  { char: "ף", name: "ペー・ソフィート" },
  { char: "ץ", name: "ツァディ・ソフィート" }
];

const COMMON_COLOR = "#2d3861"; // 全ツム統一の背景色
const TIME_LIMIT = 60.0; // 制限時間

let currentStageConfig = [];
let W = 360, H = 560, R = 28, dpr = 1;
const cv = document.getElementById("cv");
const x = cv.getContext("2d");
const $ = id => document.getElementById(id);

let P = [];
let targetKind = null; // 現在ロック中の文字のインデックス
let activeTappedSet = new Set(); // タップ済みのツムID
let run = false;
let elapsedTime = 0;
let remainingTime = TIME_LIMIT;
let lastFrameTime = 0;

let parts = [], floats = [], burst = [];
let shake = 0;

// 画面サイズ調整
function fit() {
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr;
  cv.height = H * dpr;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function size() {
  R = Math.max(22, Math.min(34, Math.min(W, H) / 11));
}

fit();
size();
addEventListener("resize", () => { fit(); size(); });

// 全27文字からランダムに5文字を選出し、個数（3〜7個）を割り当てる
function setupRandomStage() {
  const shuffled = [...HEBREW_ALL].sort(() => Math.random() - 0.5);
  const selectedFive = shuffled.slice(0, 5);

  currentStageConfig = selectedFive.map(item => ({
    char: item.char,
    name: item.name,
    count: Math.floor(Math.random() * 5) + 3, // 3 ~ 7個
    color: COMMON_COLOR
  }));
}

// ツムの初期配置作成
function initTsums() {
  setupRandomStage();
  P = [];
  let idCounter = 0;
  let idx = 0;
  currentStageConfig.forEach((cfg, kIdx) => {
    for (let i = 0; i < cfg.count; i++) {
      const px = R + Math.random() * (W - 2 * R);
      const py = -R - (idx++) * (R * 1.3);
      P.push({
        id: idCounter++,
        x: px, y: py, px: px, py: py,
        k: kIdx,
        char: cfg.char,
        name: cfg.name,
        color: cfg.color
      });
    }
  });
}

// ゲームスタート
function start() {
  ac();
  initTsums();
  targetKind = null;
  activeTappedSet.clear();
  parts = []; floats = []; burst = [];
  remainingTime = TIME_LIMIT;
  elapsedTime = 0;
  run = true;
  updateHUD();
  updateTargetBadge();
  $("cancel-btn").style.display = "none";
  $("ov").style.display = "none";
  lastFrameTime = performance.now();

  // 開始音
  tone(440, 0.1, "sine", 0.15, 0, 0);
  tone(554, 0.1, "sine", 0.15, 0, 0.08);
  tone(659, 0.2, "sine", 0.2, 0, 0.16);
}

// ロックのキャンセル
function cancelTarget() {
  if (!run || targetKind === null) return;
  targetKind = null;
  activeTappedSet.clear();
  updateTargetBadge();
  $("cancel-btn").style.display = "none";
  tone(300, 0.15, "sine", 0.1, 150);
}

function updateTargetBadge() {
  const badge = $("target-badge");
  if (targetKind === null) {
    badge.style.display = "none";
  } else {
    badge.style.display = "inline-flex";
    const cfg = currentStageConfig[targetKind];
    const totalTarget = P.filter(item => item.k === targetKind).length;
    $("target-char").textContent = cfg.char;
    $("target-count").textContent = `${activeTappedSet.size}/${totalTarget}`;
  }
}

$("cancel-btn").onclick = cancelTarget;
$("g0").onclick = start;

// クリア処理
function gameClear() {
  run = false;
  const clearTime = elapsedTime.toFixed(2);
  
  [523, 659, 783, 1046].forEach((f, i) => {
    tone(f, 0.3, "triangle", 0.2, 0, i * 0.1);
  });
  
  $("ov-title").textContent = "🎉 クリア！";
  $("ov-msg").innerHTML = `すべてのツムを破砕しました！<br><div class="time-res">${clearTime} 秒</div>`;
  $("g0").textContent = "もう一度遊ぶ";
  $("ov").style.display = "flex";
}

// タイムアップ処理
function gameOver() {
  run = false;
  tone(200, 0.4, "sawtooth", 0.2, 80);
  
  $("ov-title").textContent = "タイムアップ！";
  $("ov-msg").innerHTML = `制限時間内に破砕できませんでした。<br>残り: <b>${P.length}</b> 個`;
  $("g0").textContent = "リトライ";
  $("ov").style.display = "flex";
}

// サウンド合成 (AudioContext)
let AC = null, MS = null, muted = false;
function ac() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      MS = AC.createGain();
      MS.gain.value = 0.3;
      const cp = AC.createDynamicsCompressor();
      MS.connect(cp);
      cp.connect(AC.destination);
    } catch (e) {}
  }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}

function tone(f, d, ty, v, sl, dl) {
  if (muted || !AC) return;
  const t = AC.currentTime + (dl || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = ty || "sine";
  o.frequency.setValueAtTime(f, t);
  if (sl) o.frequency.exponentialRampToValueAtTime(Math.max(30, sl), t + d);
  g.gain.setValueAtTime(v || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(MS);
  o.start(t);
  o.stop(t + d + 0.02);
}

$("mu").onclick = () => {
  muted = !muted;
  $("mu").textContent = muted ? "音OFF" : "音ON";
};

// 物理演算エンジン
function phys() {
  const g = R * 0.022;

  for (const p of P) {
    const vx = (p.x - p.px) * 0.985, vy = (p.y - p.py) * 0.985;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy + g;
  }

  for (let it = 0; it < 4; it++) {
    for (let i = 0; i < P.length; i++) {
      const a = P[i];
      if (a.x < R) a.x = R;
      if (a.x > W - R) a.x = W - R;
      if (a.y > H - R) {
        a.y = H - R;
        a.px = a.x - (a.x - a.px) * 0.5;
      }

      for (let j = i + 1; j < P.length; j++) {
        const b = P[j], dx = b.x - a.x, dy = b.y - a.y, m = 2 * R;
        if (Math.abs(dx) > m || Math.abs(dy) > m) continue;
        const d = Math.hypot(dx, dy);
        if (d < m && d > 0.001) {
          const o = (m - d) / 2, nx = dx / d, ny = dy / d;
          a.x -= nx * o; a.y -= ny * o;
          b.x += nx * o; b.y += ny * o;
        }
      }
    }
  }
}

// 描画ループ
function draw() {
  x.clearRect(0, 0, W, H);
  x.save();

  if (shake > 0.3) {
    x.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.88;
  }

  x.font = '700 ' + Math.round(R * 1.25) + 'px "Noto Serif Hebrew","Frank Ruhl Libre",serif';
  x.textAlign = "center";
  x.textBaseline = "middle";

  for (const p of P) {
    const isTapped = activeTappedSet.has(p.id);

    x.beginPath();
    x.arc(p.x, p.y, isTapped ? R + 4 : R - 1, 0, Math.PI * 2);

    x.fillStyle = p.color;

    if (isTapped) {
      x.shadowColor = "#ffffff";
      x.shadowBlur = 18;
    }
    x.fill();
    x.shadowBlur = 0;

    x.lineWidth = isTapped ? 4 : 2;
    x.strokeStyle = isTapped ? "#ffffff" : "rgba(255, 255, 255, 0.25)";
    x.stroke();

    x.fillStyle = isTapped ? "#ffffff" : "#e0e6ff";
    x.fillText(p.char, p.x, p.y + 2);
  }

  for (const b of burst) {
    x.globalAlpha = b.t / 20;
    x.beginPath();
    x.arc(b.x, b.y, (20 - b.t) * 2.2 + R, 0, Math.PI * 2);
    x.strokeStyle = b.color;
    x.lineWidth = 3;
    x.stroke();
    b.t--;
  }
  burst = burst.filter(b => b.t > 0);

  for (const q of parts) {
    q.x += q.vx; q.y += q.vy; q.vy += 0.25; q.l--;
    x.globalAlpha = Math.max(0, q.l / 30);
    x.fillStyle = q.c;
    x.beginPath();
    x.arc(q.x, q.y, q.r, 0, Math.PI * 2);
    x.fill();
  }
  parts = parts.filter(q => q.l > 0);

  for (const f of floats) {
    f.y -= 1.0; f.l--;
    x.globalAlpha = Math.min(1, f.l / 20);
    x.font = '700 ' + f.z + 'px "Hiragino Sans",sans-serif';
    x.fillStyle = f.c;
    x.fillText(f.t, f.x, f.y);
  }
  floats = floats.filter(f => f.l > 0);

  x.restore();
}

function updateHUD() {
  $("tm").textContent = remainingTime.toFixed(1);
  $("rem-cnt").textContent = P.length;
}

function loop(t) {
  if (run) {
    const dt = (t - lastFrameTime) / 1000;
    lastFrameTime = t;
    elapsedTime += dt;
    remainingTime -= dt;

    if (remainingTime <= 0) {
      remainingTime = 0;
      updateHUD();
      gameOver();
      return;
    }
    updateHUD();
  }

  phys();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(t => { lastFrameTime = t; loop(t); });

function pos(e) {
  const r = cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

function hit(mx, my) {
  let best = null, bd = R * 1.35;
  for (const p of P) {
    const d = Math.hypot(p.x - mx, p.y - my);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function handleTap(e) {
  if (!run) return;
  ac();
  const [mx, my] = pos(e);
  const p = hit(mx, my);
  if (!p) return;

  if (targetKind === null) {
    targetKind = p.k;
    activeTappedSet.add(p.id);
    $("cancel-btn").style.display = "inline-block";
    updateTargetBadge();
    tone(440, 0.1, "sine", 0.2);
    checkComplete();
    return;
  }

  if (p.k !== targetKind) {
    tone(120, 0.18, "sawtooth", 0.2);
    shake = 6;
    return;
  }

  if (!activeTappedSet.has(p.id)) {
    activeTappedSet.add(p.id);
    updateTargetBadge();

    tone(440 + activeTappedSet.size * 70, 0.12, "sine", 0.22);
    checkComplete();
  }
}

function checkComplete() {
  const totalTargetNodes = P.filter(item => item.k === targetKind);
  if (activeTappedSet.size === totalTargetNodes.length) {
    const k = targetKind;
    const charName = currentStageConfig[k].name;

    totalTargetNodes.forEach(c => {
      burst.push({ x: c.x, y: c.y, color: "#f2b84b", t: 20 });
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5;
        parts.push({
          x: c.x, y: c.y,
          vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2,
          l: 30, c: "#f2b84b", r: 2 + Math.random() * 3
        });
      }
    });

    floats.push({
      x: W / 2, y: H / 2, l: 45,
      t: `${charName} 全破砕！`,
      c: "#f2b84b", z: 28
    });

    tone(880, 0.25, "triangle", 0.25);

    P = P.filter(item => item.k !== targetKind);
    targetKind = null;
    activeTappedSet.clear();
    updateTargetBadge();
    $("cancel-btn").style.display = "none";

    if (P.length === 0) {
      gameClear();
    }
  }
}

cv.addEventListener("pointerdown", handleTap);
</script>
</body>
</html>
